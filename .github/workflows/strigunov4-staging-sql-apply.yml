name: Strigunov4 protected staging nine SQL apply

on:
  pull_request:
    paths:
      - '.github/workflows/strigunov4-staging-sql-apply.yml'
      - 'scripts/strigunov4/protected_staging_sql_apply.py'
      - 'scripts/strigunov4/staging_sql_host_admission.py'
      - 'scripts/strigunov4/test_protected_staging_sql_apply.py'
      - 'docs/strigunov4/PROTECTED-NINE-SQL-APPLY.md'
      - 'scripts/strigunov4/staging_nine_sql_candidate.py'
      - 'scripts/strigunov4/protected_staging_host_probe.py'
      - 'scripts/strigunov4/candidates/sql/**'
      - 'supabase/migrations/20261016203000_booking_availability_canonical_lock.sql'
      - 'supabase/migrations/20261016213000_booking_availability_shared_writer_lock.sql'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact reviewed protected main commit SHA
        required: true
        type: string
      confirm:
        description: APPLY_STRIGUNOV4_NINE_SQL_<full main SHA>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: strigunov4-staging-nine-sql-apply
  cancel-in-progress: false

jobs:
  offline_source_checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact source and negative security cases without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/strigunov4/protected_staging_sql_apply.py scripts/strigunov4/staging_sql_host_admission.py
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_protected_staging_sql_apply.py' -v
          python3 scripts/strigunov4/staging_nine_sql_candidate.py
          git diff --check

  protected_owner_apply:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Require current protected main, exact owner and first attempt
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ASI-integration/asi-landing
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_ACTOR" = ASI-integration
          test "$GITHUB_ACTOR_ID" = 207600140
          test "$GITHUB_TRIGGERING_ACTOR" = ASI-integration
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = 'ASI-integration/asi-landing/.github/workflows/strigunov4-staging-sql-apply.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = "APPLY_STRIGUNOV4_NINE_SQL_$REVIEWED_SHA"
      - name: Checkout exact protected source with no persistent token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Re-run negative security cases on the exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_protected_staging_sql_apply.py' -v
          python3 scripts/strigunov4/staging_nine_sql_candidate.py
      - name: Verify latest restored backup, process no-send and run nine SQL atomically
        env:
          STAGING_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          STAGING_SQL_CONFIRM: ${{ inputs.confirm }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: python3 scripts/strigunov4/protected_staging_sql_apply.py
