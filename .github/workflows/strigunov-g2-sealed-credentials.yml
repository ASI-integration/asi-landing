          test -s /tmp/g2-canary.cms

  seal_staging_credentials:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'ASI-integration/asi-landing' && github.actor == 'ASI-integration'
    needs: recipient_preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: staging
    steps:
      - name: Encrypt approved existing staging credentials for the one.com host only
        shell: bash
        env:
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          API_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.STAGING_SESSION_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          cat > /tmp/strigunov-g2-recipient.crt <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEJTCCAo2gAwIBAgIUCVQ3JaC7ohI904GdrGpr8sGIc0gwDQYJKoZIhvcNAQEL
          BQAwIjEgMB4GA1UEAwwXQVNJLVN0cmlndW5vdi1HMi1vbmVjb20wHhcNMjYxMTE0
          MTgzOTQ2WhcNMjYxMTI4MTgzOTQ2WjAiMSAwHgYDVQQDDBdBU0ktU3RyaWd1bm92
          LUcyLW9uZWNvbTCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGBANA25xcb
          x08cwIj1nyk5yQCHgbzCHdf30DUBT1/Z/MlHjIBnun41uJvQUN7Iya8G06/IX2Bv
          dXCDS0eEyXgPtPyFAI1SS0PXCfDU4tfdeLGLkXE9Af8Y6LOS59J+ZdaBJ9ypgT3D
          5SuGaiSa4wFuVkFEB10+u8wl4SoGp+nRFWCND4z/Nwk3/Biqd4EO7dlI9FYy9N7i
          nJuZ1yrnmqYt/PZxpmtxUWFK4ZD74ZM6n2pPbgr2PvndpeVkzM+ufut7nwrhcNQz
          22wt21wO8ypwj07SL15scyZElQ0tt+Ww5qxqIip0kO+qdDNJxvbCPmVjhdn+iVTv
          yEm8npY53AOtlxatmkNxtzTVlblAqyk1drBOrJZxITx7x5TU5YveZ9JPdxxTvmmn
          7Mt9kQa0+olO4UYQ0b68lmfW40NWMt4aUbOXp1QcmjjgUjKq+ybxQtoT5iQG6H0+
          gLt5XoO69hmG7CkcXqwVoGBKXjL1JrlX6kH2y676bfa5zgjysEbrPk8bpwIDAQAB
          o1MwUTAdBgNVHQ4EFgQUEszEceWfkS4P+nVaNibxGLfTIB0wHwYDVR0jBBgwFoAU
          EszEceWfkS4P+nVaNibxGLfTIB0wDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0B
          AQsFAAOCAYEAAjZWud1ryy5aW8i23LWn2bq185PMbW7LlCRdITgj/FVrDwOSho1U
          EdfF2XYckkRogZBNOfA6Zka8QBntVJhhFKEpJAaEtet6mnIwTQD3+yhMoSU179+M
          tjEaih0g+717FrEyyDrqd/jzbxFg52QXrHG2ix7TzAG3iy7HtVyBlD9Kha+4vkws
          OWdU9xhVwuLEzTmE4f/cKTeASfEhiUKrbuzW+kxcoB0W0pcs3nwO7BrBXvAv8MSa
          7Z5cZlesJtivB0j83jhLYzeYsM10DB/hOtsqjHe2JQ6H1RkKeUJ9fJors44IjOUX
          gwAx8o13Ryv9p1btNg7JBaMhFEAPpyPvoJ7XnvP/GDLYXFnbWoNuszj37/TS14Jk
          dqyyyosdwDyTiTrvEOIKACQ/+/ZR5IIOng5qk2trco+exYx94gw6rrIPW++6QTps
          uiKWbetf7MhgFNfB3QibSrjkjWpH1gnceS0XvQ3jQkqvfI2RCv2uHZZZ0jQbkSxe
          Jx2UK8ix6z4u
          -----END CERTIFICATE-----
          CERT
          python3 - <<'PY' | openssl cms -encrypt -aes-256-gcm -binary -outform DER -recip /tmp/strigunov-g2-recipient.crt -out strigunov-g2-sealed.cms
          import json, os, sys
          vals = {key: os.environ.get(key, '').strip() for key in ('PROJECT_REF','API_URL','SERVICE_KEY','GOOGLE_ID','GOOGLE_SECRET','SESSION_SECRET')}
          if any(not v for v in vals.values()):
              raise SystemExit('BLOCKED: one or more protected staging credentials missing')
          if vals['PROJECT_REF'] != 'meeravcldnmocjtlqoeu':
              raise SystemExit('BLOCKED: protected staging project ID does not match the independently observed test database')
          if vals['API_URL'].rstrip('/') != 'https://meeravcldnmocjtlqoeu.supabase.co':
              raise SystemExit('BLOCKED: protected staging API URL does not match the expected Supabase project')
          if not vals['GOOGLE_ID'].endswith('.apps.googleusercontent.com'):
              raise SystemExit('BLOCKED: Google OAuth client ID malformed')
          payload = {
            'STAGING_SUPABASE_PROJECT_REF': vals['PROJECT_REF'],
            'SUPABASE_URL': vals['API_URL'],
            'NEXT_PUBLIC_SUPABASE_URL': vals['API_URL'],
            'SUPABASE_SERVICE_ROLE_KEY': vals['SERVICE_KEY'],
            'GOOGLE_CLIENT_ID': vals['GOOGLE_ID'],
            'NEXT_PUBLIC_GOOGLE_CLIENT_ID': vals['GOOGLE_ID'],
            'GOOGLE_CLIENT_SECRET': vals['GOOGLE_SECRET'],
            'SESSION_SECRET': vals['SESSION_SECRET'],
          }
          sys.stdout.write(json.dumps(payload, separators=(',', ':')))
          PY
          test -s strigunov-g2-sealed.cms
          echo 'G2_SEALED_CREDENTIALS=PASS (encrypted artifact only; no plaintext logged)'
      - name: Upload encrypted one.com-only handoff
        uses: actions/upload-artifact@v4
        with:
          name: strigunov-g2-sealed-credentials
          path: strigunov-g2-sealed.cms
          retention-days: 1
          if-no-files-found: error
