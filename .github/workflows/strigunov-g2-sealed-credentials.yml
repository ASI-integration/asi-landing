          test "$(openssl x509 -in /tmp/strigunov-g2-recipient.crt -noout -fingerprint -sha256 | cut -d= -f2)" = "DD:C0:52:B7:8D:45:89:82:E0:C1:1D:0B:FD:E0:BD:0C:E4:8B:41:56:76:1A:8B:F2:85:87:35:15:C4:49:11:CD"
