name: Strigunov G2 sealed credential handoff
on:
  pull_request:
    paths:
      - '.github/workflows/strigunov-g2-sealed-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strigunov-g2-sealed-credentials
  cancel-in-progress: false

jobs:
  recipient_preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the pinned one.com encryption recipient
        shell: bash
        run: |
