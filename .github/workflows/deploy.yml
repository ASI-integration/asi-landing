name: Deploy to VPS

on:
  # Production deploy is manual only.
  # Pushes to main must not deploy production.
  # Staging deploy uses separate staging scripts/config, not this workflow.
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Type DEPLOY_PRODUCTION to deploy production
        required: true
        type: string
      confirm_live_guest_messaging:
        description: For messaging activation type ENABLE_LIVE_GUEST_MESSAGING; for safe UI release type PRESERVE_EXISTING_MESSAGING
        required: true
        type: string
      sha:
        description: Commit SHA or ref to build+deploy (defaults to the triggering SHA)
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  confirm_production_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit production confirmation
        shell: bash
        env:
          OWNER_DEPLOY_CONFIRMATION: ${{ inputs.confirm_production_deploy }}
          OWNER_LIVE_MESSAGING_CONFIRMATION: ${{ inputs.confirm_live_guest_messaging }}
        run: |
          set -euo pipefail
          if [ "${OWNER_DEPLOY_CONFIRMATION}" != "DEPLOY_PRODUCTION" ]; then
            echo "Production deploy is manual only. Set confirm_production_deploy to DEPLOY_PRODUCTION."
            exit 1
          fi
          case "${OWNER_LIVE_MESSAGING_CONFIRMATION}" in
            ENABLE_LIVE_GUEST_MESSAGING|PRESERVE_EXISTING_MESSAGING) ;;
            *)
              echo "Explicitly select ENABLE_LIVE_GUEST_MESSAGING or PRESERVE_EXISTING_MESSAGING."
              exit 1
              ;;
          esac

  build_release:
    runs-on: ubuntu-latest
    needs: [confirm_production_deploy]
    outputs:
      sha: ${{ steps.build_meta.outputs.sha }}
      artifact_name: ${{ steps.build_meta.outputs.artifact_name }}
      artifact_file: ${{ steps.build_meta.outputs.artifact_file }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        shell: bash
        env:
          REQUESTED_RELEASE_REF: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          REF_INPUT="${REQUESTED_RELEASE_REF}"
          if [ -n "${REF_INPUT:-}" ]; then
            echo "ref=${REF_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Resolve canonical SHA + artifact names
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(git rev-parse HEAD)"
          echo "sha=${FULL}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=asi-release-${FULL}" >> "$GITHUB_OUTPUT"
          echo "artifact_file=asi-release-${FULL}.tgz" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (fast gates)
        run: npm run test:location-golden

      - name: Build (production)
        run: npm run build

      - name: Prune devDependencies for runtime bundle
        run: npm prune --omit=dev

      - name: Create release artifact (.tgz)
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.build_meta.outputs.sha }}"

          rm -rf release
          mkdir -p release

          cp package.json package-lock.json next.config.js ecosystem.config.cjs release/
          mkdir -p release/scripts release/tests
          cp scripts/telegram-live-acceptance.mjs release/scripts/
          cp scripts/check-location-pdf-chromium.mjs release/scripts/
          cp scripts/verify-location-report-pdf-production.mjs release/scripts/
          cp scripts/communication-ops-live-acceptance.mjs release/scripts/
          cp scripts/communication-ops-live-acceptance.runner.ts release/scripts/
          cp scripts/telegram-ops-live-acceptance.mjs release/scripts/
          cp scripts/pilot-readiness-live-acceptance.mjs release/scripts/
          cp scripts/pilot-readiness-live-acceptance.runner.ts release/scripts/
          cp scripts/ops-sync.mjs release/scripts/
          cp scripts/ops-sync.runner.ts release/scripts/
          cp scripts/support-bot-live-acceptance.mjs release/scripts/
          cp scripts/support-bot-live-acceptance.runner.ts release/scripts/
          cp scripts/ops-alert-scheduler.mjs release/scripts/
          cp scripts/pm2-sync-ops-alert-scheduler.sh release/scripts/
          cp tsconfig.json release/
          cp -R src release/
          cp tests/telegram-live-cases.ru.json release/tests/
          cp tests/location-report-production-cases.json release/tests/
          if [ -d public ]; then cp -R public release/; fi
          cp -R .next release/
          cp -a node_modules release/

          node - <<'NODE'
          const fs = require('fs');
          const gitSha = (process.env.GIT_SHA_EXACT || '').trim();
          const meta = {
            gitSha,
            builtAt: new Date().toISOString(),
            workflowRunId: process.env.GITHUB_RUN_ID || null,
            github: {
              run_number: process.env.GITHUB_RUN_NUMBER || null,
              workflow: process.env.GITHUB_WORKFLOW || null,
              repository: process.env.GITHUB_REPOSITORY || null,
            },
            node: process.version,
          };
          fs.writeFileSync('release/release-meta.json', JSON.stringify(meta, null, 2) + '\n');
          NODE
        env:
          GIT_SHA_EXACT: ${{ steps.build_meta.outputs.sha }}

      - name: Tar release
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.build_meta.outputs.artifact_file }}"
          tar -czf "$OUT" -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_meta.outputs.artifact_name }}
          path: ${{ steps.build_meta.outputs.artifact_file }}
          if-no-files-found: error

  artifact_smoke:
    runs-on: ubuntu-latest
    needs: [build_release]
    steps:
      - name: Checkout (smoke script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release.outputs.artifact_name }}
          path: release-artifact

      - name: Pre-deploy artifact smoke (/api/health, /api/version, release-meta SHA)
        shell: bash
        env:
          EXPECT_SHA: ${{ needs.build_release.outputs.sha }}
          ARTIFACT_FILE: ${{ needs.build_release.outputs.artifact_file }}
        run: |
          set -euo pipefail
          ARTIFACT_PATH="release-artifact/${ARTIFACT_FILE}"
          if [[ ! -f "$ARTIFACT_PATH" ]]; then
            ARTIFACT_PATH="$(find release-artifact -type f -name "${ARTIFACT_FILE}" | head -n1 || true)"
          fi
          if [[ -z "${ARTIFACT_PATH:-}" ]] || [[ ! -f "$ARTIFACT_PATH" ]]; then
            echo "Artifact tarball not found (expected release-artifact/${ARTIFACT_FILE})"
            find release-artifact -type f 2>/dev/null || ls -la release-artifact || true
            exit 1
          fi
          chmod +x scripts/ci-artifact-smoke.sh
          bash scripts/ci-artifact-smoke.sh "$ARTIFACT_PATH" 13077

  deploy:
    runs-on: ubuntu-latest
    needs: [build_release, artifact_smoke]
    environment: production
    env:
      TWOGIS_CATALOG_API_KEY: ${{ secrets.TWOGIS_CATALOG_API_KEY }}
      GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
      BOOKING_OPS_AUTO_SEND_RUNNER_SECRET: ${{ secrets.BOOKING_OPS_AUTO_SEND_RUNNER_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      INTERNAL_TEST_SECRET: ${{ secrets.INTERNAL_TEST_SECRET }}
      ASI_RUNTIME_INGEST_TOKEN: ${{ secrets.ASI_RUNTIME_INGEST_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_CORE_BOT_TOKEN: ${{ secrets.TELEGRAM_CORE_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
    steps:
      - name: Checkout deploy scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release.outputs.artifact_name }}
          path: release-artifact

      - name: Prepare production environment (existing live messaging mode)
        if: inputs.confirm_live_guest_messaging == 'ENABLE_LIVE_GUEST_MESSAGING'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BOOKING_OPS_AUTO_SEND_RUNNER_SECRET:-}" ]; then
            echo "Missing required secret: BOOKING_OPS_AUTO_SEND_RUNNER_SECRET"
            exit 1
          fi
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing required secret: SUPABASE_URL"
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "Missing required secret: SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi
          if [ -z "${SESSION_SECRET:-}" ]; then
            echo "Missing required secret: SESSION_SECRET"
            exit 1
          fi
          if [ -z "${INTERNAL_TEST_SECRET:-}" ]; then
            echo "Missing required secret: INTERNAL_TEST_SECRET"
            exit 1
          fi
          if [ -z "${ASI_RUNTIME_INGEST_TOKEN:-}" ]; then
            echo "Missing required secret: ASI_RUNTIME_INGEST_TOKEN"
            exit 1
          fi
          if [ "${#ASI_RUNTIME_INGEST_TOKEN}" -lt 32 ]; then
            echo "ASI_RUNTIME_INGEST_TOKEN does not meet the minimum length of 32 characters"
            exit 1
          fi
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "Missing required secret: DEEPSEEK_API_KEY"
            exit 1
          fi
          if [ -z "${TELEGRAM_CORE_BOT_TOKEN:-}" ]; then
            echo "Missing required secret: TELEGRAM_CORE_BOT_TOKEN"
            exit 1
          fi
          if [ "${#SESSION_SECRET}" -lt 32 ]; then
            echo "SESSION_SECRET does not meet the minimum length of 32 characters"
            exit 1
          fi
          TELEGRAM_WEBHOOK_SECRET_DERIVED="$(node -e "const c=require('node:crypto'); process.stdout.write(c.createHash('sha256').update('asi-telegram-webhook-v1\0'+process.env.SESSION_SECRET).digest('hex'))")"
          test -n "$TELEGRAM_WEBHOOK_SECRET_DERIVED"
          umask 077
          {
            printf 'NODE_ENV=production\n'
            printf 'PORT=3000\n'
            printf 'BOOKING_OPS_AUTO_SEND_RUNNER_SECRET=%s\n' "$BOOKING_OPS_AUTO_SEND_RUNNER_SECRET"
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'INTERNAL_TEST_SECRET=%s\n' "$INTERNAL_TEST_SECRET"
            printf 'ASI_RUNTIME_INGEST_TOKEN=%s\n' "$ASI_RUNTIME_INGEST_TOKEN"
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
            printf 'GUEST_CONCIERGE_LLM_ENABLED=true\n'
            printf 'GUEST_CONCIERGE_LLM_MODEL=deepseek-v4-flash\n'
            printf 'LLM_ROUTER_MODE=fixed\n'
            printf 'LLM_ROUTER_PROVIDER=deepseek\n'
            printf 'DEEPSEEK_MODEL=deepseek-v4-flash\n'
            printf 'LLM_SAFE_DOMAIN_ENABLED=1\n'
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_CORE_BOT_TOKEN"
            printf 'TELEGRAM_WEBHOOK_SECRET=%s\n' "$TELEGRAM_WEBHOOK_SECRET_DERIVED"
            printf 'DRY_RUN_TELEGRAM_OUTBOUND=0\n'
            printf 'TELEGRAM_DRY_RUN=0\n'
            printf 'COMMUNICATION_KILL_SWITCH=0\n'
            printf 'COMMUNICATION_AUTOPILOT_FORCE_DISABLED=0\n'
            printf 'COMMUNICATION_AUTOPILOT_FORCE_ENABLED=0\n'
            printf 'COMM_STATE_DIR=/var/www/asi/shared/communication-state\n'
            printf 'SESSION_STORE_DIR=/var/www/asi/shared/communication-state\n'
            printf 'CONVERSATION_SESSION_DIR=/var/www/asi/shared/communication-state\n'
            if [ -n "${TELEGRAM_TEST_CHAT_ID:-}" ]; then
              printf 'TELEGRAM_TEST_CHAT_ID=%s\n' "$TELEGRAM_TEST_CHAT_ID"
              printf 'TELEGRAM_AUTOPILOT_TEST_CHAT_ID=%s\n' "$TELEGRAM_TEST_CHAT_ID"
            fi
            if [ -n "${TWOGIS_CATALOG_API_KEY:-}" ]; then
              printf 'TWOGIS_CATALOG_API_KEY=%s\n' "$TWOGIS_CATALOG_API_KEY"
            fi
            if [ -n "${GOOGLE_MAPS_SERVER_API_KEY:-}" ]; then
              printf 'GOOGLE_MAPS_SERVER_API_KEY=%s\n' "$GOOGLE_MAPS_SERVER_API_KEY"
            fi
          } > production.env

      - name: Prepare production environment (preserve existing messaging)
        if: inputs.confirm_live_guest_messaging == 'PRESERVE_EXISTING_MESSAGING'
        shell: bash
        run: |
          set -euo pipefail
          # No Telegram/communication vars or credentials are placed in this overlay.
          # The deployment script preserves existing server-local settings.
          umask 077
          printf 'NODE_ENV=production\nPORT=3000\n' > production.env

      - name: Deploy systemd release over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          SHA="${{ needs.build_release.outputs.sha }}"
          ARTIFACT_FILE="${{ needs.build_release.outputs.artifact_file }}"
          ARTIFACT_PATH="release-artifact/${ARTIFACT_FILE}"
          REMOTE_USER="project_ayfaar"
          REMOTE_TMP="/home/project_ayfaar/asi-deploy-tmp"
          REMOTE_PORT="${VPS_PORT:-22}"

          [ -f "$ARTIFACT_PATH" ] || { echo "Artifact missing: $ARTIFACT_PATH"; exit 1; }
          [ -n "${VPS_HOST:-}" ] || { echo "Missing VPS_HOST"; exit 1; }
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "Missing VPS_SSH_KEY"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          SSH_OPTS=(
            -i ~/.ssh/id_ed25519
            -p "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )
          SCP_OPTS=(
            -i ~/.ssh/id_ed25519
            -P "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )

          echo "SSH preflight: ${REMOTE_USER}@${VPS_HOST}:${REMOTE_PORT}"
          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$VPS_HOST" 'test "$(id -un)" = project_ayfaar && hostname && echo SSH_OK'
          if [ "${{ inputs.confirm_live_guest_messaging }}" = "PRESERVE_EXISTING_MESSAGING" ]; then
            # Fail closed; never fall back to a default env or silently enable messaging.
            ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$VPS_HOST" 'test -s /var/www/asi/shared/.env.production.local && echo EXISTING_ENV_PRESENT'
          fi
          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$VPS_HOST" "mkdir -p '$REMOTE_TMP' && chmod 700 '$REMOTE_TMP'"

          echo "Pre-deploy disk cleanup"
          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$VPS_HOST" "
            set -e
            CURRENT_TARGET=\$(readlink -f /var/www/asi/current 2>/dev/null || true)
            echo 'Disk before cleanup:'
            df -h /var/www/asi || true
            rm -f '$REMOTE_TMP'/*.tgz '$REMOTE_TMP'/production.env '$REMOTE_TMP'/deploy-production-systemd-artifact.sh 2>/dev/null || true
            find /var/www/asi/releases -mindepth 1 -maxdepth 1 -type d -name '*.tmp.*' -exec rm -rf -- {} + 2>/dev/null || true
            while IFS= read -r release_path; do
              [ -z "\$release_path" ] && continue
              if [ -n "\$CURRENT_TARGET" ] && [ "\$release_path" = "\$CURRENT_TARGET" ]; then
                continue
              fi
              rm -rf -- "\$release_path"
            done < <(find /var/www/asi/releases -mindepth 1 -maxdepth 1 -type d ! -name '*.tmp.*' -print 2>/dev/null || true)
            echo 'Disk after cleanup:'
            df -h /var/www/asi || true
          "

          scp "${SCP_OPTS[@]}" \
            scripts/deploy-production-systemd-artifact.sh \
            production.env \
            "$ARTIFACT_PATH" \
            "$REMOTE_USER@$VPS_HOST:$REMOTE_TMP/"

          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$VPS_HOST" \
            "ASI_BASE_DIR='/var/www/asi' APP_PORT='3000' bash '$REMOTE_TMP/deploy-production-systemd-artifact.sh' '$SHA' '$REMOTE_TMP/$ARTIFACT_FILE' '$REMOTE_TMP/production.env'"

          ssh "${SSH_OPTS[@]}" "$REMOTE_USER@$VPS_HOST" \
            "rm -f '$REMOTE_TMP/deploy-production-systemd-artifact.sh' '$REMOTE_TMP/production.env' '$REMOTE_TMP/$ARTIFACT_FILE'"

          echo "LIVE_SHA_EXPECTED=$SHA"
          curl -fsS --max-time 10 https://asi-global.ru/api/version

      - name: Ensure Telegram production webhook
        if: inputs.confirm_live_guest_messaging == 'ENABLE_LIVE_GUEST_MESSAGING'
        shell: bash
        run: |
          set -euo pipefail
          TELEGRAM_WEBHOOK_SECRET_DERIVED="$(node -e "const c=require('node:crypto'); process.stdout.write(c.createHash('sha256').update('asi-telegram-webhook-v1\0'+process.env.SESSION_SECRET).digest('hex'))")"
          PAYLOAD="$(TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET_DERIVED" node -e "process.stdout.write(JSON.stringify({url:'https://asi-global.ru/api/telegram/webhook',secret_token:process.env.TELEGRAM_WEBHOOK_SECRET,allowed_updates:['message','edited_message','callback_query']}))")"
          RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "https://api.telegram.org/bot${TELEGRAM_CORE_BOT_TOKEN}/setWebhook" \
            -H 'content-type: application/json' \
            --data "$PAYLOAD")"
          node -e "const r=JSON.parse(process.argv[1]); if(r.ok!==true) throw new Error('telegram_setWebhook_failed'); console.log('TELEGRAM_WEBHOOK_SET=ok')" "$RESPONSE"

          INFO="$(curl --fail-with-body --silent --show-error --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_CORE_BOT_TOKEN}/getWebhookInfo")"
          node -e "const r=JSON.parse(process.argv[1]); if(r.ok!==true||r.result?.url!=='https://asi-global.ru/api/telegram/webhook') throw new Error('telegram_webhook_verification_failed'); console.log('TELEGRAM_WEBHOOK_VERIFIED=ok')" "$INFO"