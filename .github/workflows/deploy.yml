name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA or ref to build+deploy (defaults to the triggering SHA)
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build_release:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.build_meta.outputs.sha }}
      artifact_name: ${{ steps.build_meta.outputs.artifact_name }}
      artifact_file: ${{ steps.build_meta.outputs.artifact_file }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        shell: bash
        run: |
          set -euo pipefail
          REF_INPUT="${{ inputs.sha }}"
          if [ -n "${REF_INPUT:-}" ]; then
            echo "ref=${REF_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Resolve canonical SHA + artifact names
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(git rev-parse HEAD)"
          echo "sha=${FULL}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=asi-release-${FULL}" >> "$GITHUB_OUTPUT"
          echo "artifact_file=asi-release-${FULL}.tgz" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (fast gates)
        run: npm run test:location-golden

      - name: Build (production)
        run: npm run build

      - name: Create release artifact (.tgz)
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.build_meta.outputs.sha }}"
          OUT="${{ steps.build_meta.outputs.artifact_file }}"

          rm -rf release
          mkdir -p release

          cp package.json package-lock.json next.config.js ecosystem.config.cjs release/
          if [ -d public ]; then cp -R public release/; fi
          cp -R .next release/

          node - <<'NODE'
          const fs = require('fs');
          const sha = process.env.GITHUB_SHA_EXACT || '';
          const meta = {
            sha,
            built_at_iso: new Date().toISOString(),
            github: {
              run_id: process.env.GITHUB_RUN_ID || null,
              run_number: process.env.GITHUB_RUN_NUMBER || null,
              workflow: process.env.GITHUB_WORKFLOW || null,
              repository: process.env.GITHUB_REPOSITORY || null,
            },
            node: process.version,
          };
          fs.writeFileSync('release/.release.build.json', JSON.stringify(meta, null, 2) + '\n');
          NODE
        env:
          GITHUB_SHA_EXACT: ${{ steps.build_meta.outputs.sha }}

      - name: Tar release
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.build_meta.outputs.artifact_file }}"
          tar -czf "$OUT" -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_meta.outputs.artifact_name }}
          path: ${{ steps.build_meta.outputs.artifact_file }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: [build_release]
    env:
      TWOGIS_CATALOG_API_KEY: ${{ secrets.TWOGIS_CATALOG_API_KEY }}
      GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
    steps:
      - name: Checkout (deploy script for SCP)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release.outputs.artifact_name }}
          path: release-artifact

      - name: Deploy over SSH (auto-detect port)
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          SHA="${{ needs.build_release.outputs.sha }}"
          ARTIFACT_FILE="${{ needs.build_release.outputs.artifact_file }}"
          RELEASE_DIR="release-artifact"
          ARTIFACT_PATH="${RELEASE_DIR}/${ARTIFACT_FILE}"
          if [ ! -f "$ARTIFACT_PATH" ]; then
            ARTIFACT_PATH="$(find "$RELEASE_DIR" -type f -name "$ARTIFACT_FILE" | head -n1 || true)"
          fi
          if [ -z "${ARTIFACT_PATH:-}" ] || [ ! -f "$ARTIFACT_PATH" ]; then
            echo "Artifact tarball not found (expected ${RELEASE_DIR}/${ARTIFACT_FILE})"
            find "$RELEASE_DIR" -type f 2>/dev/null || ls -la
            exit 1
          fi

          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "Missing one of required secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY"
            exit 1
          fi

          echo "Resolving VPS_HOST..."
          getent hosts "$VPS_HOST" || true

          if [ -n "${VPS_PORT:-}" ]; then
            CANDIDATE_PORTS=("$VPS_PORT")
          else
            CANDIDATE_PORTS=(22 2222 22022 22222)
          fi

          SELECTED_PORT=""
          for p in "${CANDIDATE_PORTS[@]}"; do
            echo "Preflight TCP check: ${VPS_HOST}:${p}"
            if timeout 6 bash -lc "cat < /dev/null > /dev/tcp/${VPS_HOST}/${p}" 2>/dev/null; then
              SELECTED_PORT="$p"
              break
            fi
          done

          if [ -z "$SELECTED_PORT" ]; then
            echo "No reachable SSH port found (tried: ${CANDIDATE_PORTS[*]}). Likely firewall/security-group blocking inbound SSH or VPS is down."
            exit 1
          fi

          echo "Selected SSH port: ${SELECTED_PORT}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          SSH_OPTS=(
            -p "$SELECTED_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )

          SCP_OPTS=(
            -P "$SELECTED_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )

          echo "Copying deploy script + artifact to VPS..."
          scp "${SCP_OPTS[@]}" scripts/deploy-artifact.sh "${VPS_USER}@${VPS_HOST}:/tmp/asi-deploy-artifact.sh"
          scp "${SCP_OPTS[@]}" "$ARTIFACT_PATH" "${VPS_USER}@${VPS_HOST}:/tmp/${ARTIFACT_FILE}"

          ssh "${SSH_OPTS[@]}" "${VPS_USER}@${VPS_HOST}" \
            "TWOGIS_CATALOG_API_KEY='${TWOGIS_CATALOG_API_KEY:-}' GOOGLE_MAPS_SERVER_API_KEY='${GOOGLE_MAPS_SERVER_API_KEY:-}' bash -lc 'set -euo pipefail
              echo \"Deploying SHA: ${SHA}\"

              chmod +x /tmp/asi-deploy-artifact.sh || true
              ASI_BASE_DIR=\"/var/www/asi\" bash /tmp/asi-deploy-artifact.sh \"${SHA}\" \"/tmp/${ARTIFACT_FILE}\"

              rm -f /tmp/asi-deploy-artifact.sh \"/tmp/${ARTIFACT_FILE}\"

              echo \"LIVE_SHA_EXPECTED=${SHA}\"
              curl -fsS http://127.0.0.1:3000/api/version
              pm2 status
            '"
