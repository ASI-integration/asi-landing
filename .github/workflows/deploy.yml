name: Deploy to VPS

on:
  # Production deploy is manual only.
  # Pushes to main must not deploy production.
  # Staging deploy uses separate staging scripts/config, not this workflow.
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Type DEPLOY_PRODUCTION to deploy production
        required: true
        type: string
      sha:
        description: Commit SHA or ref to build+deploy (defaults to the triggering SHA)
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  confirm_production_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production_deploy }}" != "DEPLOY_PRODUCTION" ]; then
            echo "Production deploy is manual only. Set confirm_production_deploy to DEPLOY_PRODUCTION."
            exit 1
          fi

  build_release:
    runs-on: ubuntu-latest
    needs: [confirm_production_deploy]
    outputs:
      sha: ${{ steps.build_meta.outputs.sha }}
      artifact_name: ${{ steps.build_meta.outputs.artifact_name }}
      artifact_file: ${{ steps.build_meta.outputs.artifact_file }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        shell: bash
        run: |
          set -euo pipefail
          REF_INPUT="${{ inputs.sha }}"
          if [ -n "${REF_INPUT:-}" ]; then
            echo "ref=${REF_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ steps.checkout_ref.outputs.ref }}

      - name: Resolve canonical SHA + artifact names
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(git rev-parse HEAD)"
          echo "sha=${FULL}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=asi-release-${FULL}" >> "$GITHUB_OUTPUT"
          echo "artifact_file=asi-release-${FULL}.tgz" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (fast gates)
        run: npm run test:location-golden

      - name: Build (production)
        run: npm run build

      - name: Prune devDependencies for runtime bundle
        run: npm prune --omit=dev

      - name: Create release artifact (.tgz)
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.build_meta.outputs.sha }}"

          rm -rf release
          mkdir -p release

          cp package.json package-lock.json next.config.js ecosystem.config.cjs release/
          mkdir -p release/scripts release/tests
          cp scripts/telegram-live-acceptance.mjs release/scripts/
          cp scripts/check-location-pdf-chromium.mjs release/scripts/
          cp scripts/verify-location-report-pdf-production.mjs release/scripts/
          cp scripts/communication-ops-live-acceptance.mjs release/scripts/
          cp scripts/communication-ops-live-acceptance.runner.ts release/scripts/
          cp scripts/telegram-ops-live-acceptance.mjs release/scripts/
          cp scripts/pilot-readiness-live-acceptance.mjs release/scripts/
          cp scripts/pilot-readiness-live-acceptance.runner.ts release/scripts/
          cp scripts/ops-sync.mjs release/scripts/
          cp scripts/ops-sync.runner.ts release/scripts/
          cp scripts/support-bot-live-acceptance.mjs release/scripts/
          cp scripts/support-bot-live-acceptance.runner.ts release/scripts/
          cp scripts/ops-alert-scheduler.mjs release/scripts/
          cp tsconfig.json release/
          cp -R src release/
          cp tests/telegram-live-cases.ru.json release/tests/
          cp tests/location-report-production-cases.json release/tests/
          if [ -d public ]; then cp -R public release/; fi
          cp -R .next release/
          cp -a node_modules release/

          node - <<'NODE'
          const fs = require('fs');
          const gitSha = (process.env.GIT_SHA_EXACT || '').trim();
          const meta = {
            gitSha,
            builtAt: new Date().toISOString(),
            workflowRunId: process.env.GITHUB_RUN_ID || null,
            github: {
              run_number: process.env.GITHUB_RUN_NUMBER || null,
              workflow: process.env.GITHUB_WORKFLOW || null,
              repository: process.env.GITHUB_REPOSITORY || null,
            },
            node: process.version,
          };
          fs.writeFileSync('release/release-meta.json', JSON.stringify(meta, null, 2) + '\n');
          NODE
        env:
          GIT_SHA_EXACT: ${{ steps.build_meta.outputs.sha }}

      - name: Tar release
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.build_meta.outputs.artifact_file }}"
          tar -czf "$OUT" -C release .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build_meta.outputs.artifact_name }}
          path: ${{ steps.build_meta.outputs.artifact_file }}
          if-no-files-found: error

  artifact_smoke:
    runs-on: ubuntu-latest
    needs: [build_release]
    steps:
      - name: Checkout (smoke script)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release.outputs.artifact_name }}
          path: release-artifact

      - name: Pre-deploy artifact smoke (/api/health, /api/version, release-meta SHA)
        shell: bash
        env:
          EXPECT_SHA: ${{ needs.build_release.outputs.sha }}
          ARTIFACT_FILE: ${{ needs.build_release.outputs.artifact_file }}
        run: |
          set -euo pipefail
          ARTIFACT_PATH="release-artifact/${ARTIFACT_FILE}"
          if [[ ! -f "$ARTIFACT_PATH" ]]; then
            ARTIFACT_PATH="$(find release-artifact -type f -name "${ARTIFACT_FILE}" | head -n1 || true)"
          fi
          if [[ -z "${ARTIFACT_PATH:-}" ]] || [[ ! -f "$ARTIFACT_PATH" ]]; then
            echo "Artifact tarball not found (expected release-artifact/${ARTIFACT_FILE})"
            find release-artifact -type f 2>/dev/null || ls -la release-artifact || true
            exit 1
          fi
          chmod +x scripts/ci-artifact-smoke.sh
          bash scripts/ci-artifact-smoke.sh "$ARTIFACT_PATH" 13077

  deploy:
    runs-on: ubuntu-latest
    needs: [build_release, artifact_smoke]
    environment: production
    env:
      TWOGIS_CATALOG_API_KEY: ${{ secrets.TWOGIS_CATALOG_API_KEY }}
      GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
      BOOKING_OPS_AUTO_SEND_RUNNER_SECRET: ${{ secrets.BOOKING_OPS_AUTO_SEND_RUNNER_SECRET }}
    steps:
      - name: Checkout (deploy script for SCP)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build_release.outputs.artifact_name }}
          path: release-artifact

      - name: Deploy over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          SHA="${{ needs.build_release.outputs.sha }}"
          ARTIFACT_FILE="${{ needs.build_release.outputs.artifact_file }}"
          RELEASE_DIR="release-artifact"
          ARTIFACT_PATH="${RELEASE_DIR}/${ARTIFACT_FILE}"
          if [ ! -f "$ARTIFACT_PATH" ]; then
            ARTIFACT_PATH="$(find "$RELEASE_DIR" -type f -name "$ARTIFACT_FILE" | head -n1 || true)"
          fi
          if [ -z "${ARTIFACT_PATH:-}" ] || [ ! -f "$ARTIFACT_PATH" ]; then
            echo "Artifact tarball not found (expected ${RELEASE_DIR}/${ARTIFACT_FILE})"
            find "$RELEASE_DIR" -type f 2>/dev/null || ls -la
            exit 1
          fi

          REMOTE_USER="project_ayfaar"
          REMOTE_TMP="/home/project_ayfaar/asi-deploy-tmp"
          REMOTE_PORT="${VPS_PORT:-22}"

          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_SSH_KEY:-}" ]; then
            echo "Missing one of required secrets: VPS_HOST, VPS_SSH_KEY"
            exit 1
          fi

          echo "Deploy target: ${REMOTE_USER}@${VPS_HOST}:${REMOTE_PORT}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY=~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          echo "SSH key diagnostics (fingerprint only, no key material):"
          if ! SSH_KEY_FP="$(ssh-keygen -lf "$SSH_KEY" 2>&1)"; then
            echo "VPS_SSH_KEY secret is not a valid SSH private key."
            echo "${SSH_KEY_FP}"
            echo "Ensure the secret contains a full OpenSSH private key (BEGIN/END lines, no extra quotes)."
            exit 1
          fi
          echo "private_key: ${SSH_KEY_FP}"
          if SSH_PUB_FP="$(ssh-keygen -y -f "$SSH_KEY" 2>/dev/null | ssh-keygen -lf - 2>/dev/null)"; then
            echo "public_key:  ${SSH_PUB_FP}"
          else
            echo "public_key:  (could not derive from secret)"
          fi

          SSH_OPTS=(
            -i "$SSH_KEY"
            -p "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )

          SCP_OPTS=(
            -i "$SSH_KEY"
            -P "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -p "$REMOTE_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "SSH preflight: ${REMOTE_USER}@${VPS_HOST}:${REMOTE_PORT}"
          set +e
          PREFLIGHT_OUT="$(ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" \
            'whoami; hostname; echo SSH_OK')"
          PREFLIGHT_RC=$?
          set -e

          if [ "$PREFLIGHT_RC" -ne 0 ]; then
            echo "SSH preflight failed (exit ${PREFLIGHT_RC}) for ${REMOTE_USER}@${VPS_HOST}:${REMOTE_PORT}"
            if [ -n "${PREFLIGHT_OUT:-}" ]; then
              echo "$PREFLIGHT_OUT"
            fi
            echo "Loaded key fingerprint: ${SSH_KEY_FP}"
            echo "Compare public_key fingerprint above with ${REMOTE_USER}@server authorized_keys."
            echo "Check VPS_HOST, VPS_PORT (default 22), and that VPS_SSH_KEY is authorized for user ${REMOTE_USER}."
            exit 1
          fi
          echo "$PREFLIGHT_OUT"

          PREFLIGHT_LINES="$(printf '%s\n' "$PREFLIGHT_OUT" | grep -vE '^Warning: ')"
          if ! printf '%s\n' "$PREFLIGHT_LINES" | grep -Fxq "$REMOTE_USER"; then
            echo "SSH preflight connected as unexpected user: expected line '${REMOTE_USER}'"
            echo "$PREFLIGHT_OUT"
            exit 1
          fi
          if ! echo "$PREFLIGHT_OUT" | grep -q 'SSH_OK'; then
            echo "SSH preflight missing SSH_OK marker"
            exit 1
          fi
          echo "Ensuring remote deploy temp dir: ${REMOTE_TMP}"
          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" \
            "mkdir -p \"${REMOTE_TMP}\" && chmod 700 \"${REMOTE_TMP}\""

          echo "Cleaning stale remote deploy temp artifacts..."
          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" \
            "rm -f \"${REMOTE_TMP}\"/asi-release-*.tgz \"${REMOTE_TMP}\"/asi-deploy-artifact.sh && df -h \"${REMOTE_TMP}\" && du -sh \"${REMOTE_TMP}\" || true"

          echo "Cleaning old remote releases before artifact upload..."
          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "bash -s" <<'REMOTE_RELEASE_CLEANUP'
            set -euo pipefail

            BASE_DIR="/var/www/asi"
            RELEASES_DIR="${BASE_DIR}/releases"
            CURRENT_LINK="${BASE_DIR}/current"
            current_target="$(readlink -f "${CURRENT_LINK}" 2>/dev/null || true)"

            if [ ! -d "${RELEASES_DIR}" ]; then
              echo "Release dir does not exist yet: ${RELEASES_DIR}"
              exit 0
            fi

            echo "Current release target: ${current_target:-unknown}"
            echo "Disk before release cleanup:"
            df -h "${BASE_DIR}" || true
            du -sh "${RELEASES_DIR}" 2>/dev/null || true

            remove_stale_release() {
              local release_path="$1"
              if rm -rf -- "${release_path}" 2>/dev/null; then
                echo "Removed stale release: ${release_path}"
                return 0
              fi
              echo "WARN: rm failed for ${release_path}, trying sudo..."
              if sudo rm -rf -- "${release_path}" 2>/dev/null; then
                echo "Removed stale release via sudo: ${release_path}"
                return 0
              fi
              echo "WARN: sudo rm failed for ${release_path}, fixing ownership then retrying..."
              sudo chown -R "$(whoami):$(whoami)" "${release_path}" 2>/dev/null || true
              rm -rf -- "${release_path}" 2>/dev/null || sudo rm -rf -- "${release_path}" 2>/dev/null || true
              if [ ! -e "${release_path}" ]; then
                echo "Removed stale release after chown: ${release_path}"
                return 0
              fi
              echo "ERROR: could not remove stale release ${release_path}"
              return 1
            }

            find "${RELEASES_DIR}" -mindepth 1 -maxdepth 1 -type d -name "*.tmp.*" -exec rm -rf -- {} + 2>/dev/null || true
            find "${RELEASES_DIR}" -mindepth 1 -maxdepth 1 -type d ! -name "*.tmp.*" -print 2>/dev/null |
              while IFS= read -r release_path; do
                [ -z "${release_path}" ] && continue
                [ -n "${current_target}" ] && [ "${release_path}" = "${current_target}" ] && continue
                remove_stale_release "${release_path}" || true
              done

            echo "Disk after release cleanup:"
            df -h "${BASE_DIR}" || true
            du -sh "${RELEASES_DIR}" 2>/dev/null || true
          REMOTE_RELEASE_CLEANUP

          echo "Copying deploy script + artifact to VPS ${REMOTE_TMP}..."
          scp "${SCP_OPTS[@]}" scripts/deploy-artifact.sh "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/asi-deploy-artifact.sh"
          scp "${SCP_OPTS[@]}" "$ARTIFACT_PATH" "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/${ARTIFACT_FILE}"

          echo "Verifying artifact on VPS..."
          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" \
            "ls -lh ${REMOTE_TMP}/asi-release-*.tgz | tail -5"

          if [ -z "${BOOKING_OPS_AUTO_SEND_RUNNER_SECRET:-}" ]; then
            echo "Missing required secret: BOOKING_OPS_AUTO_SEND_RUNNER_SECRET"
            exit 1
          fi

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" \
            "TWOGIS_CATALOG_API_KEY='${TWOGIS_CATALOG_API_KEY:-}' GOOGLE_MAPS_SERVER_API_KEY='${GOOGLE_MAPS_SERVER_API_KEY:-}' BOOKING_OPS_AUTO_SEND_RUNNER_SECRET='${BOOKING_OPS_AUTO_SEND_RUNNER_SECRET}' bash -lc 'set -euo pipefail
              echo \"Deploying SHA: ${SHA}\"

              ENV_FILE=\"/var/www/asi/shared/.env.production.live\"
              ENV_TMP=\"${REMOTE_TMP}/.env.production.live.tmp\"
              umask 077
              if [ -f \"\${ENV_FILE}\" ]; then
                grep -v \"^BOOKING_OPS_AUTO_SEND_RUNNER_SECRET=\" \"\${ENV_FILE}\" > \"\${ENV_TMP}\" || true
              else
                : > \"\${ENV_TMP}\"
              fi
              printf \"BOOKING_OPS_AUTO_SEND_RUNNER_SECRET=%s\\n\" \"\${BOOKING_OPS_AUTO_SEND_RUNNER_SECRET}\" >> \"\${ENV_TMP}\"
              mv \"\${ENV_TMP}\" \"\${ENV_FILE}\"
              chmod 600 \"\${ENV_FILE}\"

              chmod +x ${REMOTE_TMP}/asi-deploy-artifact.sh || true
              ASI_BASE_DIR=\"/var/www/asi\" bash ${REMOTE_TMP}/asi-deploy-artifact.sh \"${SHA}\" \"${REMOTE_TMP}/${ARTIFACT_FILE}\"

              rm -f ${REMOTE_TMP}/asi-deploy-artifact.sh \"${REMOTE_TMP}/${ARTIFACT_FILE}\"

              echo \"LIVE_SHA_EXPECTED=${SHA}\"
              curl -fsS http://127.0.0.1:3000/api/version
              pm2 status
            '"
