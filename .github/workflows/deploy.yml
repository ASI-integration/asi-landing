name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/asi-landing
            git fetch origin
            git reset --hard origin/main
            cp .env.production.live .env.production.local
            npm ci
            npm run build
            # Main site: this repo only (not automation-core apps/web).
            pm2 startOrReload ecosystem.config.cjs --only asi-landing
            pm2 save
            pm2 status
