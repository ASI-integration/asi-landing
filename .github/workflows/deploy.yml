name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Injected into the remote SSH session via `envs` below; merged into `.env.production.live` before build.
      TWOGIS_CATALOG_API_KEY: ${{ secrets.TWOGIS_CATALOG_API_KEY }}
      GOOGLE_MAPS_SERVER_API_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_API_KEY }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: TWOGIS_CATALOG_API_KEY,GOOGLE_MAPS_SERVER_API_KEY
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/asi-landing
            git fetch origin
            git reset --hard origin/main
            merge_secret_into_env_file() {
              key="$1"
              val="$2"
              if [ -z "${val:-}" ]; then
                return 0
              fi
              tmp="$(mktemp)"
              if [ -f .env.production.live ]; then
                grep -v "^${key}=" .env.production.live >"$tmp" || true
              else
                : >"$tmp"
              fi
              printf '%s\n' "${key}=${val}" >>"$tmp"
              mv "$tmp" .env.production.live
            }
            merge_secret_into_env_file TWOGIS_CATALOG_API_KEY "${TWOGIS_CATALOG_API_KEY:-}"
            merge_secret_into_env_file GOOGLE_MAPS_SERVER_API_KEY "${GOOGLE_MAPS_SERVER_API_KEY:-}"
            cp .env.production.live .env.production.local
            npm ci
            npm run build
            # Main site: this repo only (not automation-core apps/web).
            pm2 startOrReload ecosystem.config.cjs --only asi-landing
            pm2 save
            pm2 status
