name: Temporary Semantic Concierge v2 Patch

on:
  push:
    branches:
      - chatgpt/semantic-concierge-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/semantic-concierge-v2
          fetch-depth: 0

      - name: Apply semantic concierge v2 changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # 1) Semantic-first routing: a casual mention of an apartment/object is not itself a property question.
          replace_once(
              'src/lib/communication/guest-intent-router.ts',
              """function isGuestPropertyQuestion(text: string): boolean {
  return has(
    text,
    /адрес|как\\s+добраться|где\\s+наход|как\\s+найти|wi-?fi|вай-?фай|интернет|парол.*сет|парков/,
    /описан|квартир|объект|что\\s+за\\s+жиль/,
  );
}""",
              """function isGuestPropertyQuestion(text: string): boolean {
  return has(
    text,
    // Strong operational cues are deterministic and grounded.
    /адрес|как\\s+добраться|где\\s+наход|как\\s+найти|wi-?fi|вай-?фай|интернет|парол.*сет|парков/,
    // Bare mentions such as «хочу отдохнуть в квартире» are conversation, not a request
    // for the property passport. Require an actual property-information question.
    /(?:расскаж|опиш|описан|что\\s+за|что\\s+есть|какие?.*удобств|есть\\s+ли).{0,80}(?:квартир|объект|жиль|апартамент)/,
    /(?:квартир|объект|жиль|апартамент).{0,80}(?:что\\s+есть|какие?.*удобств|есть\\s+ли|как\\s+выгляд|описан)/,
  );
}""",
          )

          # 2) Voice mirrors safe inbound voice across adjacent conversational topics by default.
          replace_once(
              'src/lib/communication/voice-response-settings.ts',
              '  voiceForAllInboundVoice: false,',
              '  voiceForAllInboundVoice: true,',
          )

          # 3) Hybrid voice + compact copyable companion text.
          replace_once(
              'src/lib/communication/voice-response-policy.ts',
              """  | 'inbound_voice_allowed'
  | 'preferred_voice'""",
              """  | 'inbound_voice_allowed'
  | 'inbound_voice_with_companion_text'
  | 'preferred_voice'""",
          )
          replace_once(
              'src/lib/communication/voice-response-policy.ts',
              """  voiceText?: string;
  maxDurationSeconds?: number;""",
              """  voiceText?: string;
  /** Exact copyable data sent as a short text after the voice bubble. */
  companionText?: string;
  maxDurationSeconds?: number;""",
          )

          marker = """function isUrgentIntent(input: VoiceResponsePolicyInput): boolean {"""
          p = Path('src/lib/communication/voice-response-policy.ts')
          s = p.read_text()
          if s.count(marker) != 1:
              raise SystemExit('voice-response-policy: isUrgentIntent marker mismatch')
          helper = r'''
export function splitCopyableGuestData(replyText: string): {
  voiceText: string;
  companionText: string | null;
} {
  const source = String(replyText ?? '').trim();
  if (!source) return { voiceText: '', companionText: null };

  const captured: string[] = [];
  let voiceText = source;
  const patterns: RegExp[] = [
    /(?:адрес|address)\s*:\s*[^.!?\n]+[.!]?/giu,
    /(?:ssid|сеть)\s*:\s*[^.!?\n]+[.!]?/giu,
    /(?:парол(?:ь|я)?(?:\s+wi[-\s]?fi)?|password|passcode|pin|пин(?:-?код)?)\s*:\s*[^,;.!?\n]+[.!]?/giu,
    /(?:номер\s+бронирования|booking\s+(?:reference|number)|reservation\s+(?:reference|number))\s*(?::|№|#|=|\bis\b)\s*[A-ZА-Я0-9][A-ZА-Я0-9._/-]{3,}/giu,
    /(?:https?:\/\/|www\.)\S+/giu,
    /[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/g,
    /(?:телефон|phone)\s*:\s*\+?\d(?:[\s().-]*\d){7,}/giu,
  ];

  for (const pattern of patterns) {
    voiceText = voiceText.replace(pattern, (match) => {
      const clean = match.trim();
      if (clean) captured.push(clean);
      return ' ';
    });
  }

  const companionText = [...new Set(captured)].join('\n').trim() || null;
  voiceText = voiceText
    .replace(/\s+([,.!?;:])/g, '$1')
    .replace(/\s{2,}/g, ' ')
    .replace(/^[,;:\s]+|[,;:\s]+$/g, '')
    .trim();

  if (companionText && voiceText.length < 8) {
    voiceText = 'Я отправила точные данные отдельным сообщением, чтобы их было удобно скопировать.';
  }
  return { voiceText, companionText };
}

'''
          p.write_text(s.replace(marker, helper + marker, 1))

          replace_once(
              'src/lib/communication/voice-response-policy.ts',
              """  if (containsCopyableGuestData(input.replyText)) {
    return { shouldSendVoice: false, reason: 'copyable_data_text_only', timezoneSource };
  }""",
              """  if (containsCopyableGuestData(input.replyText)) {
    const hybridAllowed =
      modalityAllowsVoice &&
      !isStaffRole(input.role) &&
      (isCoreStayTopic(input) || isAdjacentTopic(input) || isMetaVoiceReply(input));
    if (hybridAllowed) {
      const split = splitCopyableGuestData(input.replyText);
      if (split.companionText) {
        const voiceText = prepareVoiceTextForTts(split.voiceText, settings.maxVoiceTextChars);
        if (voiceText.length >= 8 && voiceText.length <= settings.maxVoiceTextChars) {
          return {
            shouldSendVoice: true,
            reason: 'inbound_voice_with_companion_text',
            voiceText,
            companionText: split.companionText,
            maxDurationSeconds,
            timezoneSource,
          };
        }
      }
    }
    return { shouldSendVoice: false, reason: 'copyable_data_text_only', timezoneSource };
  }""",
          )

          # 4) Telegram sends only compact companion data after a successful voice response.
          replace_once(
              'src/lib/communication/channels/telegram.ts',
              """      if (isVoiceReplyGloballyEnabled() && decision?.shouldSendVoice) {
        const voiceSent = await sendVoiceReply(chatId, { chatId, decision });
        if (voiceSent) {
          // Voice is the primary response in voice mode. Do not duplicate the same
          // payload as text; text remains the delivery fallback only.
          return true;
        }
        console.warn('[tg:voice] voice_reply.text_fallback', {
          chat_id: chatId,
          update_id: typeof metadata?.update_id === 'number' ? metadata.update_id : null,
          reason: decision.reason,
        });
      }""",
              """      if (isVoiceReplyGloballyEnabled() && decision?.shouldSendVoice) {
        const voiceSent = await sendVoiceReply(chatId, { chatId, decision });
        if (voiceSent) {
          const companionText = String(decision.companionText ?? '').trim();
          if (!companionText) {
            // Voice is the primary response in voice mode. Do not duplicate the same payload as text.
            return true;
          }
          const baseHandler =
            typeof metadata?.reply_handler === 'string' && metadata.reply_handler.length > 0
              ? metadata.reply_handler
              : 'telegram_adapter:unspecified_handler';
          const updateIdRaw = metadata?.update_id;
          const update_id = typeof updateIdRaw === 'number' && Number.isFinite(updateIdRaw) ? updateIdRaw : undefined;
          const companionSent = await replyToTelegram(chatId, companionText, {
            handler: `${baseHandler}:voice_companion`,
            update_id,
          });
          if (companionSent) return true;
          console.warn('[tg:voice] voice_reply.companion_text_fallback', {
            chat_id: chatId,
            update_id: update_id ?? null,
          });
          // If the compact companion failed, fall through to the full text fallback so exact data is not lost.
        } else {
          console.warn('[tg:voice] voice_reply.text_fallback', {
            chat_id: chatId,
            update_id: typeof metadata?.update_id === 'number' ? metadata.update_id : null,
            reason: decision.reason,
          });
        }
      }""",
          )

          # 5) MiniGPT safe-domain provider must not silently inherit a disabled router provider.
          replace_once(
              'src/lib/communication/llm-safe-domain-layer.ts',
              """  const providerName = String(process.env.LLM_SAFE_DOMAIN_PROVIDER ?? process.env.LLM_ROUTER_PROVIDER ?? 'openai')
    .toLowerCase() as LlmSafeDomainProviderName;
  if (providerName !== 'openai' && providerName !== 'deepseek') return undefined;

  const apiKey =
    providerName === 'deepseek'
      ? process.env.DEEPSEEK_API_KEY
      : process.env.OPENAI_API_KEY ?? process.env.LLM_API_KEY;
  if (!apiKey) return undefined;""",
              """  const explicitProvider = String(process.env.LLM_SAFE_DOMAIN_PROVIDER ?? '').trim().toLowerCase();
  const routerProvider = String(process.env.LLM_ROUTER_PROVIDER ?? '').trim().toLowerCase();
  const openAiKey = process.env.OPENAI_API_KEY ?? process.env.LLM_API_KEY;
  const deepSeekKey = process.env.DEEPSEEK_API_KEY;
  const providerName: LlmSafeDomainProviderName =
    explicitProvider === 'openai' || explicitProvider === 'deepseek'
      ? explicitProvider
      : routerProvider === 'openai' || routerProvider === 'deepseek'
        ? routerProvider
        : openAiKey
          ? 'openai'
          : deepSeekKey
            ? 'deepseek'
            : 'disabled';
  if (providerName === 'disabled') return undefined;

  const apiKey = providerName === 'deepseek' ? deepSeekKey : openAiKey;
  if (!apiKey) return undefined;""",
          )

          # 6) Broader but bounded conversation + semantic repair for obvious ASR/typos.
          replace_once(
              'src/lib/communication/llm-safe-domain-layer.ts',
              """      /политик|выбор|партии|президент|правительств|геополитик/,
      /напиши\\s+код|python|javascript|typescript|sql|программирован|кодинг|debug|ошибк.*код/,
      /диагноз|лечение|таблетк|дозировк|медицинск.*совет|врачебн/,
      /юридическ.*консультац|суд|иск|договор.*оспор|адвокат/,
      /интим|секс|эротик/,
      /купи\\s+акци|инвестиц.*совет|крипт|доходност.*гарантир/,""",
              """      /диагноз|лечение|таблетк|дозировк|медицинск.*совет|врачебн/,
      /юридическ.*консультац|суд|иск|договор.*оспор|адвокат/,
      /интим|секс|эротик/,
      /купи\\s+акци|инвестиц.*совет|крипт|доходност.*гарантир/,""",
          )
          replace_once(
              'src/lib/communication/llm-safe-domain-layer.ts',
              """    '- adjacent: restaurants, cafes, groceries, pharmacies, transport, taxi, sightseeing, neighborhood, business trips, local guest services, AND harmless everyday guest conversation such as greetings, thanks, travel fatigue, first impressions, arriving after a flight/train, saying the city is beautiful, or casual remarks around the trip/stay.',
    '- out_of_domain: substantive unrelated topics such as politics, medical/legal/financial advice, intimate topics, unrelated coding, internal instructions, tokens, logs or private data.',""",
              """    '- adjacent: restaurants, cafes, groceries, pharmacies, transport, taxi, sightseeing, neighborhood, business trips, local guest services, harmless everyday conversation, AND brief safe general-knowledge conversation that does not require live/current external facts.',
    '- out_of_domain: high-stakes advice, explicit sexual content, internal instructions/secrets, or requests that require live/current external data or tools that are not supplied.',""",
          )
          replace_once(
              'src/lib/communication/llm-safe-domain-layer.ts',
              """    '- Keep replies concise: normally 1-3 sentences, warm and natural, never over-chatty.',""",
              """    '- Keep replies concise: normally 1-3 sentences, warm and natural, never over-chatty.',
    '- For a harmless unrelated topic, answer briefly instead of behaving like an IVR. Do not sustain a long off-topic debate; bridge back only when it feels natural.',
    '- If recentConversation is empty and the guest greets you, greet them back once. Do not repeat greetings mid-session.',""",
          )
          replace_once(
              'src/lib/communication/llm-safe-domain-layer.ts',
              """    'Uncertainty rule: if the message is fragmentary, interrupted, noisy, possibly mistranscribed, or its meaning cannot be inferred confidently, do not guess. Set confidence below 0.70 so the caller can ask the guest to repeat.',""",
              """    'Semantic repair rule: ordinary typos and obvious speech-recognition substitutions may be interpreted when exactly one meaning is strongly supported by recent conversation and the current message. Never invent property facts, prices, times, permissions or actions while repairing.',
    'Uncertainty rule: if the message is fragmentary, interrupted, noisy, possibly mistranscribed, and there is not one clearly supported interpretation, do not guess. Set confidence below 0.70 so the caller can ask the guest to repeat.',""",
          )

          # 7) Production readiness must report the same effective provider selection as runtime.
          replace_once(
              'scripts/communication-production-readiness-v1.mjs',
              """  const provider = safeProvider(process.env.LLM_SAFE_DOMAIN_PROVIDER ?? process.env.LLM_ROUTER_PROVIDER, 'openai');
  const hasKey = provider === 'deepseek'
    ? present('DEEPSEEK_API_KEY')
    : present('OPENAI_API_KEY') || present('LLM_API_KEY');""",
              """  const explicitProvider = String(process.env.LLM_SAFE_DOMAIN_PROVIDER ?? '').trim().toLowerCase();
  const routerProvider = String(process.env.LLM_ROUTER_PROVIDER ?? '').trim().toLowerCase();
  const hasOpenAiKey = present('OPENAI_API_KEY') || present('LLM_API_KEY');
  const hasDeepSeekKey = present('DEEPSEEK_API_KEY');
  const provider =
    explicitProvider === 'openai' || explicitProvider === 'deepseek'
      ? explicitProvider
      : routerProvider === 'openai' || routerProvider === 'deepseek'
        ? routerProvider
        : hasOpenAiKey
          ? 'openai'
          : hasDeepSeekKey
            ? 'deepseek'
            : 'disabled';
  const hasKey = provider === 'deepseek' ? hasDeepSeekKey : provider === 'openai' ? hasOpenAiKey : false;""",
          )

          # 8) Document the dedicated safe-domain provider knob instead of inheriting router=disabled by accident.
          env = Path('.env.example')
          env_text = env.read_text()
          anchor = """LLM_ROUTER_AUTO_FALLBACK_ENABLED=true

# Telegram guest semantic router"""
          replacement = """LLM_ROUTER_AUTO_FALLBACK_ENABLED=true

# Conversational Concierge / MiniGPT safe-domain layer.
# When enabled and LLM_SAFE_DOMAIN_PROVIDER is empty, runtime chooses an available OpenAI-compatible
# LLM_API_KEY/OPENAI_API_KEY provider (or DeepSeek) instead of inheriting LLM_ROUTER_PROVIDER=disabled.
LLM_SAFE_DOMAIN_ENABLED=false
LLM_SAFE_DOMAIN_PROVIDER=
LLM_SAFE_DOMAIN_MODEL=

# Telegram guest semantic router"""
          if env_text.count(anchor) != 1:
              raise SystemExit('.env.example anchor mismatch')
          env.write_text(env_text.replace(anchor, replacement, 1))

          # 9) Focused regression pack.
          Path('src/lib/communication/__tests__/semantic-concierge-v2.test.ts').write_text(r'''import { afterEach, describe, expect, it } from 'vitest';

import { classifyGuestCommunicationIntent } from '../guest-intent-router';
import { getConfiguredLlmSafeDomainProvider } from '../llm-safe-domain-layer';
import {
  containsCopyableGuestData,
  evaluateVoiceResponsePolicy,
  splitCopyableGuestData,
} from '../voice-response-policy';
import { DEFAULT_PROPERTY_VOICE_POLICY } from '../voice-response-settings';
import { resolvePropertyTimezone } from '../property-timezone';

const originalEnv = { ...process.env };
afterEach(() => {
  process.env = { ...originalEnv };
});

const budget = {
  dailyReplyCount: 0,
  dailyEstimatedSeconds: 0,
  monthlyEstimatedSeconds: 0,
  dailyCapReached: false,
  monthlyCapReached: false,
};

describe('Semantic Concierge v2', () => {
  it('does not turn a casual apartment mention into a property-passport question', () => {
    const result = classifyGuestCommunicationIntent({
      messageText: 'Здравствуйте. Я только что прилетел в Петербург. Очень устал с дороги, хочу отдохнуть в вашей квартире.',
      currentIdentity: 'test_guest',
    });
    expect(result.detectedIntent).toBe('unclear_role');
    expect(result.shouldEscalate).toBe(false);
  });

  it('keeps explicit property questions deterministic', () => {
    expect(
      classifyGuestCommunicationIntent({
        messageText: 'Расскажите, пожалуйста, что есть в квартире?',
        currentIdentity: 'test_guest',
      }).detectedIntent,
    ).toBe('guest_property_question');
    expect(
      classifyGuestCommunicationIntent({
        messageText: 'Какой адрес квартиры?',
        currentIdentity: 'test_guest',
      }).detectedIntent,
    ).toBe('guest_property_question');
  });

  it('keeps local recommendations ahead of generic property wording', () => {
    expect(
      classifyGuestCommunicationIntent({
        messageText: 'Посоветуйте хороший ресторан недалеко от объекта.',
        currentIdentity: 'test_guest',
      }).detectedIntent,
    ).toBe('guest_local_recommendation');
  });

  it('keeps sensitive rails deterministic', () => {
    const result = classifyGuestCommunicationIntent({
      messageText: 'Замок сломан, я не могу попасть внутрь.',
      currentIdentity: 'test_guest',
    });
    expect(result.detectedIntent).toBe('emergency_or_damage');
    expect(result.shouldEscalate).toBe(true);
  });

  it('uses an available OpenAI-compatible LLM key when router provider is disabled', () => {
    process.env.LLM_SAFE_DOMAIN_ENABLED = '1';
    delete process.env.LLM_SAFE_DOMAIN_PROVIDER;
    process.env.LLM_ROUTER_PROVIDER = 'disabled';
    process.env.LLM_API_KEY = 'test-key';
    process.env.LLM_BASE_URL = 'https://example.invalid/v1';
    const provider = getConfiguredLlmSafeDomainProvider();
    expect(provider?.name).toBe('openai');
  });

  it('does not invent a provider when no safe-domain credentials exist', () => {
    process.env.LLM_SAFE_DOMAIN_ENABLED = '1';
    delete process.env.LLM_SAFE_DOMAIN_PROVIDER;
    process.env.LLM_ROUTER_PROVIDER = 'disabled';
    delete process.env.LLM_API_KEY;
    delete process.env.OPENAI_API_KEY;
    delete process.env.DEEPSEEK_API_KEY;
    expect(getConfiguredLlmSafeDomainProvider()).toBeUndefined();
  });

  it('mirrors a safe adjacent voice turn as voice by default', () => {
    const decision = evaluateVoiceResponsePolicy({
      inboundTransport: 'telegram_voice',
      userVoiceSettings: {
        voiceRepliesEnabled: true,
        voiceNoticeSent: false,
        preferredResponseModality: null,
      },
      propertyVoiceSettings: { ...DEFAULT_PROPERTY_VOICE_POLICY },
      budget,
      replyText: 'Конечно. Скажите, вам хочется грузинскую кухню или просто хороший недорогой ужин?',
      ttsConfigured: true,
      propertyTimezone: resolvePropertyTimezone('Europe/Moscow'),
      role: 'guest',
      detectedIntent: 'guest_local_recommendation',
      domainZone: 'adjacent',
      responseMode: 'answer_from_concierge',
    });
    expect(DEFAULT_PROPERTY_VOICE_POLICY.voiceForAllInboundVoice).toBe(true);
    expect(decision.shouldSendVoice).toBe(true);
    expect(decision.reason).toBe('inbound_voice_allowed');
  });

  it('splits exact copyable data into a compact companion text instead of duplicating the whole reply', () => {
    const reply = 'Да, конечно. Адрес: Санкт-Петербург, Лиговский проспект, 108. Заезд после 14:00.';
    expect(containsCopyableGuestData(reply)).toBe(true);
    const split = splitCopyableGuestData(reply);
    expect(split.voiceText).toContain('Да, конечно');
    expect(split.voiceText).toContain('Заезд после 14:00');
    expect(split.voiceText).not.toContain('Лиговский');
    expect(split.companionText).toContain('Адрес: Санкт-Петербург, Лиговский проспект, 108');

    const decision = evaluateVoiceResponsePolicy({
      inboundTransport: 'telegram_voice',
      userVoiceSettings: {
        voiceRepliesEnabled: true,
        voiceNoticeSent: false,
        preferredResponseModality: null,
      },
      propertyVoiceSettings: { ...DEFAULT_PROPERTY_VOICE_POLICY },
      budget,
      replyText: reply,
      ttsConfigured: true,
      propertyTimezone: resolvePropertyTimezone('Europe/Moscow'),
      role: 'guest',
      detectedIntent: 'guest_property_question',
      domainZone: 'core',
      responseMode: 'answer_from_property',
    });
    expect(decision.shouldSendVoice).toBe(true);
    expect(decision.reason).toBe('inbound_voice_with_companion_text');
    expect(decision.companionText).toContain('Лиговский');
    expect(decision.voiceText).not.toContain('Лиговский');
  });
});
''')

          # Add adapter-level companion delivery regression to the existing suite.
          p = Path('src/lib/communication/__tests__/telegram-voice-reply-fallback.test.ts')
          s = p.read_text()
          marker = """  it('skips voice attempt when policy decision is absent', async () => {"""
          if s.count(marker) != 1:
              raise SystemExit('telegram voice test insertion marker mismatch')
          extra = r'''  it('sends only compact companion text after a successful hybrid voice reply', async () => {
    mockSendVoiceReply.mockResolvedValue(true);
    const adapter = new TelegramAdapter();

    const sent = await adapter.sendMessage('42', 'Адрес: Санкт-Петербург, Лиговский проспект, 108.', {
      update_id: 10025,
      reply_handler: 'test:hybrid_voice',
      voice_response_decision: {
        shouldSendVoice: true,
        reason: 'inbound_voice_with_companion_text',
        voiceText: 'Я отправила точный адрес отдельным сообщением.',
        companionText: 'Адрес: Санкт-Петербург, Лиговский проспект, 108.',
      },
    });

    expect(sent).toBe(true);
    expect(mockSendVoiceReply).toHaveBeenCalledOnce();
    expect(mockReplyToTelegram).toHaveBeenCalledOnce();
    expect(mockReplyToTelegram).toHaveBeenCalledWith(
      42,
      'Адрес: Санкт-Петербург, Лиговский проспект, 108.',
      { handler: 'test:hybrid_voice:voice_companion', update_id: 10025 },
    );
  });

'''
          p.write_text(s.replace(marker, extra + marker, 1))
          PY

      - name: Verify targeted changes
        shell: bash
        run: |
          grep -n "voiceForAllInboundVoice: true" src/lib/communication/voice-response-settings.ts
          grep -n "inbound_voice_with_companion_text" src/lib/communication/voice-response-policy.ts
          grep -n "openAiKey" src/lib/communication/llm-safe-domain-layer.ts
          grep -n "Semantic repair rule" src/lib/communication/llm-safe-domain-layer.ts
          grep -n "Semantic Concierge v2" src/lib/communication/__tests__/semantic-concierge-v2.test.ts
          git diff --check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_tmp-semantic-concierge-v2-patch.yml
          git config user.name "ASI-integration"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/lib/communication/guest-intent-router.ts \
            src/lib/communication/voice-response-settings.ts \
            src/lib/communication/voice-response-policy.ts \
            src/lib/communication/channels/telegram.ts \
            src/lib/communication/llm-safe-domain-layer.ts \
            scripts/communication-production-readiness-v1.mjs \
            .env.example \
            src/lib/communication/__tests__/semantic-concierge-v2.test.ts \
            src/lib/communication/__tests__/telegram-voice-reply-fallback.test.ts \
            .github/workflows/_tmp-semantic-concierge-v2-patch.yml
          git commit -m "feat(communication): semantic concierge v2"
          git push origin HEAD:chatgpt/semantic-concierge-v2
