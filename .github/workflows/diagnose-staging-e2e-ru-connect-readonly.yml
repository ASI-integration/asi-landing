# TEMPORARY / diagnostic-only for PR #318 LIVE STAGING E2E resume.
# Read-only row verification against staging. Does not deploy, migrate, or mutate.
name: Diagnose Staging E2E RU Connect Rows (Read-Only)

on:
  push:
    branches:
      - ops/staging-e2e-race-verify-readonly-20260920
    paths:
      - '.github/workflows/diagnose-staging-e2e-ru-connect-readonly.yml'
      - 'scripts/diagnose-staging-e2e-ru-connect-readonly.sh'
  workflow_dispatch:
    inputs:
      confirm_readonly_diagnostic:
        description: Type RUN_STAGING_E2E_RU_CONNECT_ROW_READONLY_DIAGNOSTIC
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-staging-e2e-ru-connect-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Require explicit read-only confirmation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CONFIRM_READONLY_DIAGNOSTIC: ${{ inputs.confirm_readonly_diagnostic }}
        run: |
          set -euo pipefail
          required="RUN_STAGING_E2E_RU_CONNECT_ROW_READONLY_DIAGNOSTIC"
          if [[ "$CONFIRM_READONLY_DIAGNOSTIC" != "$required" ]]; then
            echo "::error::Read-only diagnostic confirmation phrase mismatch."
            exit 1
          fi

      - name: Checkout diagnostic script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify staging database identity
        shell: bash
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${STAGING_DATABASE_URL:-}" ]]; then
            echo "::add-mask::${STAGING_DATABASE_URL}"
          fi
          node - <<'NODE'
          const ref = (process.env.STAGING_SUPABASE_PROJECT_REF || '').trim();
          const api = (process.env.STAGING_SUPABASE_URL || '').trim();
          const database = (process.env.STAGING_DATABASE_URL || '').trim();
          if (!ref || !/^[a-z0-9]{20}$/.test(ref)) {
            throw new Error('Missing or invalid STAGING_SUPABASE_PROJECT_REF');
          }
          if (!api || !database) {
            throw new Error('Missing STAGING_SUPABASE_URL or STAGING_DATABASE_URL');
          }
          let apiUrl;
          let databaseUrl;
          try {
            apiUrl = new URL(api);
            databaseUrl = new URL(database);
          } catch {
            throw new Error('A staging database URL is invalid');
          }
          const apiIdentity = apiUrl.hostname.toLowerCase();
          const databaseIdentity = `${databaseUrl.hostname}:${decodeURIComponent(databaseUrl.username)}`.toLowerCase();
          if (!apiIdentity.includes(ref) || !databaseIdentity.includes(ref)) {
            throw new Error('Staging database identity does not match STAGING_SUPABASE_PROJECT_REF');
          }
          console.log(`STAGING_IDENTITY_CHECK=PASS`);
          console.log(`Staging Supabase project: ${ref}`);
          NODE

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Inspect staging E2E RU connect rows read-only
        id: inspect
        shell: bash
        env:
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_E2E_ROW_DIAGNOSTIC_ARTIFACT: staging-e2e-ru-connect-row-diagnostic.txt
          E2E_EMAIL: asi.ru.race.e2e.1789916949263@example.com
          E2E_USER_ID: f62d16c8-9f38-4bff-9d43-45de863757c7
          E2E_MARKER: RU_RACE_E2E_20260920T150909Z
          PGCONNECT_TIMEOUT: "10"
        run: |
          set -euo pipefail
          chmod +x scripts/diagnose-staging-e2e-ru-connect-readonly.sh
          bash scripts/diagnose-staging-e2e-ru-connect-readonly.sh
          echo "=== DIAGNOSTIC_ARTIFACT_BEGIN ==="
          cat staging-e2e-ru-connect-row-diagnostic.txt
          echo "=== DIAGNOSTIC_ARTIFACT_END ==="

      - name: Upload sanitized diagnostic artifact
        if: ${{ always() && hashFiles('staging-e2e-ru-connect-row-diagnostic.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-ru-connect-row-diagnostic
          path: staging-e2e-ru-connect-row-diagnostic.txt
          if-no-files-found: error
          retention-days: 7

