name: ASI one.com credential probe (read only)
on:
  push:
    branches:
      - ops/onecom-ssh-check-20261112
    paths:
      - .github/workflows/asi-onecom-credential-probe.yml

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 4
    steps:
      - name: Determine whether existing production SSH connection can access one.com
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ "${VPS_HOST:-}" != "81.88.19.230" ]]; then
            echo "PRODUCTION_HOST_NOT_ONECOM"
            exit 0
          fi
          if [[ -z "${VPS_SSH_KEY:-}" ]]; then
            echo "PRODUCTION_SSH_KEY_MISSING"
            exit 0
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          if ssh -F /dev/null -i "$key" -p "${VPS_PORT:-22}" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=9 -o StrictHostKeyChecking=accept-new administrator@81.88.19.230 'id -un >/dev/null' 2>/dev/null; then
            echo "ONECOM_PRODUCTION_SSH_READY"
          else
            echo "PRODUCTION_SSH_NOT_AUTHORIZED"
          fi
  staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Determine whether existing staging SSH connection can access one.com
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ "${STAGING_SSH_HOST:-}" != "81.88.19.230" ]]; then
            echo "STAGING_HOST_NOT_ONECOM"
            exit 0
          fi
          if [[ -z "${STAGING_SSH_PRIVATE_KEY:-}" ]]; then
            echo "STAGING_SSH_KEY_MISSING"
            exit 0
          fi
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$key"
          if ssh -F /dev/null -i "$key" -p "${STAGING_SSH_PORT:-22}" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=9 -o StrictHostKeyChecking=accept-new "${STAGING_SSH_USER:-administrator}@81.88.19.230" 'id -un >/dev/null' 2>/dev/null; then
            echo "ONECOM_STAGING_SSH_READY"
          else
            echo "STAGING_SSH_NOT_AUTHORIZED"
          fi
