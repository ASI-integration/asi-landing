name: AI Reviewer Gate

# Trusted workflow from the protected default branch. PR contents are data, never executed.
# NO-SPEND: P1 SQLite escrow is not reserved from this runner, so Cloud.ru is absent.
# This file replaces the paid gate only after it is merged to main.
# Marking this PR Ready for review before that merge runs the previous workflow on main.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  adversarial-review:
    # Same-repo, non-draft PRs still run the check. The check cannot spend.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact PR commit as data (never execute it)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git -c core.hooksPath=/dev/null fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Refuse paid review without one.com escrow reservation
        timeout-minutes: 2
        env:
          ASI_REVIEWER_PERMIT: ${{ vars.ASI_REVIEWER_PERMIT }}
          ASI_REVIEWER_BUDGET: ${{ vars.ASI_REVIEWER_BUDGET }}
          ASI_REVIEWER_OWNER_PUBLIC_KEY: ${{ vars.ASI_REVIEWER_OWNER_PUBLIC_KEY }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/agent-os/reviewer-permit-cli.mjs
