name: Agent Intake Triage

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_body_path:
        description: Optional local markdown fixture path for dry triage
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: agent-intake-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify repository intake templates
        run: node scripts/agent-os/check-agent-intake.mjs --repo

      - name: Materialize issue body for triage
        id: body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          FIXTURE_PATH: ${{ inputs.issue_body_path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-intake"
          TARGET="$RUNNER_TEMP/agent-intake/issue-body.md"
          if [ -n "${FIXTURE_PATH:-}" ]; then
            cp "$FIXTURE_PATH" "$TARGET"
          else
            printf '%s\n' "${ISSUE_BODY:-}" > "$TARGET"
          fi
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Triage issue body
        id: triage
        run: |
          set +e
          node scripts/agent-os/check-agent-intake.mjs --issue-body "${{ steps.body.outputs.path }}" \
            >"$RUNNER_TEMP/agent-intake/triage.stdout" \
            2>"$RUNNER_TEMP/agent-intake/triage.stderr"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "outcome=pass" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/agent-intake/triage.stdout"
          else
            echo "outcome=fail" >> "$GITHUB_OUTPUT"
            cat "$RUNNER_TEMP/agent-intake/triage.stderr"
          fi
          exit 0

      - name: Comment when intake is incomplete
        if: steps.triage.outputs.outcome == 'fail' && github.event.issue != null
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const stderr = fs.readFileSync(`${process.env.RUNNER_TEMP}/agent-intake/triage.stderr`, 'utf8').trim();
            let blockers = ['Issue is not agent-ready. Use the Agent-ready task template and fill every required field.'];
            try {
              const parsed = JSON.parse(stderr);
              if (Array.isArray(parsed.blockers) && parsed.blockers.length) blockers = parsed.blockers;
              else if (parsed.error) blockers = [parsed.error];
            } catch {
              // keep default blockers
            }
            const body = [
              '## Agent intake triage: BLOCKED',
              '',
              'This issue is not agent-ready. Free-form / incomplete intake is fail-closed (AO-006).',
              '',
              'Open or edit the issue with the **Agent-ready task** form and complete every required field.',
              '',
              'Blockers:',
              ...blockers.map((item) => `- ${item}`),
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: ['agent-intake-blocked'],
              });
            } catch (error) {
              core.warning(`Could not add agent-intake-blocked label: ${error.message}`);
            }

      - name: Fail closed when intake is incomplete
        if: steps.triage.outputs.outcome == 'fail'
        run: |
          echo "Agent intake triage blocked the issue."
          cat "$RUNNER_TEMP/agent-intake/triage.stderr"
          exit 1
