name: Unified real estate offline
on:
  pull_request:
    paths:
      - 'src/lib/real-estate-intelligence/**'
      - 'docs/unified-real-estate/**'
      - '.github/workflows/unified-real-estate-offline.yml'
permissions:
  contents: read
concurrency:
  group: unified-real-estate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'ASI-integration/asi-landing' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'asi/location-unified-intelligence-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      REVIEWED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Owner and exact-source gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = ASI-integration
          test "$GITHUB_ACTOR_ID" = 207600140
          test "$GITHUB_TRIGGERING_ACTOR" = ASI-integration
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Source receipt
        run: |
          mkdir -p audit-results
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE_SHA"
          node -e 'require("fs").writeFileSync("audit-results/source.json",JSON.stringify({head:process.env.REVIEWED_SOURCE_SHA,run:process.env.GITHUB_RUN_ID,syntheticOnly:true,productionTouched:false,geographicCalibration:"BASELINE_HOLD_UNCHANGED"}))'
      - name: Deterministic scenario, geometry, financial and evidence acceptance
        env:
          NODE_OPTIONS: --require=./scripts/acceptance/location-audit-offline.cjs
        run: node node_modules/vitest/vitest.mjs run src/lib/real-estate-intelligence/__tests__/unified-scenarios.test.ts --maxWorkers=2 --reporter=json --outputFile=audit-results/tests.json
      - name: Typecheck
        run: npm run typecheck
      - name: Focused lint
        run: node node_modules/eslint/bin/eslint.js src/lib/real-estate-intelligence --ext .ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unified-real-estate-${{ github.run_id }}
          path: audit-results/*
          retention-days: 7
          if-no-files-found: error
