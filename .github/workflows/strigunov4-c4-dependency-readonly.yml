name: Strigunov4 C4 fixed dependency read-only proof

on:
  pull_request:
    paths:
      - '.github/workflows/strigunov4-c4-dependency-readonly.yml'
      - 'scripts/strigunov4/c4_dependency_readonly.py'
      - 'scripts/strigunov4/c4_dependency_manifest.json'
      - 'scripts/strigunov4/test_c4_dependency_postgres.py'
      - 'scripts/strigunov4/c4_incident_readonly.py'
      - 'scripts/strigunov4/protected_staging_sql_apply.py'
      - 'scripts/strigunov4/test_c4_dependency_readonly.py'
      - 'docs/strigunov4/C4-DEPENDENCY-PROOF.md'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact reviewed current protected main SHA
        required: true
        type: string
      confirm:
        description: PROVE_C4_DEPENDENCIES_<full SHA>
        required: true
        type: string
      incident_run:
        description: Fixed failed physical booking run 39047710115
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'strigunov4-staging-nine-sql-apply' || format('strigunov4-c4-dependency-pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  offline_source_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source-only security and JSON witness tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/strigunov4/c4_dependency_readonly.py
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_c4_dependency_readonly.py' -v
          git diff --check

  isolated_dependency_postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: c4_dependency
          POSTGRES_DB: c4_dependency
          POSTGRES_PASSWORD: isolated_fixture_only
        ports:
          - 127.0.0.1:55481:5432
        options: >-
          --health-cmd "pg_isready -U c4_dependency -d c4_dependency"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Actual isolated PostgreSQL dependency and rollback scenarios
        env:
          C4_DEPENDENCY_ISOLATED_PG: '1'
        run: python3 -m unittest discover -s scripts/strigunov4 -p 'test_c4_dependency_postgres.py' -v

  protected_dependency_readonly:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing'
    needs: [offline_source_tests, isolated_dependency_postgres]
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact owner, main source, current SHA and incident gate
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CONFIRM: ${{ inputs.confirm }}
          INCIDENT: ${{ inputs.incident_run }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ASI-integration/asi-landing"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "ASI-integration"
          test "$GITHUB_ACTOR_ID" = "207600140"
          test "$GITHUB_TRIGGERING_ACTOR" = "ASI-integration"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_WORKFLOW_REF" = 'ASI-integration/asi-landing/.github/workflows/strigunov4-c4-dependency-readonly.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = "PROVE_C4_DEPENDENCIES_$GITHUB_SHA"
          test "$INCIDENT" = "39047710115"
          test "$(git ls-remote https://github.com/ASI-integration/asi-landing.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned PostgreSQL17 TLS verify-full read-only dependent tables inventory
        env:
          C4_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          C4_CONFIRM: ${{ inputs.confirm }}
          C4_INCIDENT_RUN: ${{ inputs.incident_run }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: python3 scripts/strigunov4/c4_dependency_readonly.py
