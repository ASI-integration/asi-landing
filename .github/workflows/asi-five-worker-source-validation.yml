name: ASI five-worker native bridge tests

on:
  pull_request:
    paths:
      - 'src/asi-universal/**'
      - '.github/workflows/asi-five-worker-source-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-five-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test five-worker planning, admission, publication and recovery
        run: |
          node --test src/asi-universal/five-worker-wave.test.mjs
          node --test src/asi-universal/five-worker-preparation.test.mjs
          node --test src/asi-universal/native-five-worker-publisher.test.mjs
          node --test src/asi-universal/native-five-worker-cycle.test.mjs
