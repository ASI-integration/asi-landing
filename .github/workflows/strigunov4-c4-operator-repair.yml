name: Strigunov4 C4 protected operator configuration repair

on:
  pull_request:
    paths:
      - '.github/workflows/strigunov4-c4-operator-repair.yml'
      - 'scripts/strigunov4/*operator*'
      - 'scripts/strigunov4/staging_no_send_host.py'
      - 'scripts/strigunov4/staging_no_send_patch.py'
      - 'docs/strigunov4/C4-OPERATOR-REPAIR.md'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact separately owner-approved current main SHA
        required: true
        type: string
      confirm:
        description: CONFIGURE_C4_OPERATOR_<full SHA>
        required: true
        type: string
      incident_run:
        description: Fixed diagnostic run 39140030546
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'strigunov4-staging-nine-sql-apply' || format('strigunov4-c4-operator-pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  isolated_operator_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pure patch and isolated file recovery tests; no host credentials
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_c4_operator_*.py' -v
          git diff --check

  protected_operator_repair:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing'
    needs: isolated_operator_tests
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact owner, workflow, current main and one-attempt gate
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CONFIRM: ${{ inputs.confirm }}
          INCIDENT: ${{ inputs.incident_run }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ASI-integration/asi-landing"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "ASI-integration"
          test "$GITHUB_ACTOR_ID" = "207600140"
          test "$GITHUB_TRIGGERING_ACTOR" = "ASI-integration"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_WORKFLOW_REF" = 'ASI-integration/asi-landing/.github/workflows/strigunov4-c4-operator-repair.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = "CONFIGURE_C4_OPERATOR_$GITHUB_SHA"
          test "$INCIDENT" = "39140030546"
          test "$(git ls-remote https://github.com/ASI-integration/asi-landing.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One separately authorized fixed operator addition and staging restart
        env:
          STAGING_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          C4_OPERATOR_CONFIRM: ${{ inputs.confirm }}
          C4_OPERATOR_INCIDENT: ${{ inputs.incident_run }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: python3 scripts/strigunov4/protected_c4_operator_repair.py
