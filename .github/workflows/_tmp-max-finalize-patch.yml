name: Temporary MAX finalize patch

on:
  push:
    branches:
      - chatgpt/max-channel-v1
    paths:
      - .github/workflows/_tmp-max-finalize-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/max-channel-v1
          fetch-depth: 0
      - name: Apply exact patches
        run: |
          python3 - <<'PY'
          from pathlib import Path

          max_path = Path('src/lib/communication/channels/max.ts')
          text = max_path.read_text()
          old_import = "import { estimateVoiceSeconds } from '../voice-response-policy';\n"
          if text.count(old_import) != 1:
              raise SystemExit(f'expected estimate import once, found {text.count(old_import)}')
          text = text.replace(old_import, '', 1)
          old_call = 'estimatedSeconds: estimateVoiceSeconds(voiceText),'
          if text.count(old_call) != 1:
              raise SystemExit(f'expected estimate call once, found {text.count(old_call)}')
          text = text.replace(old_call, 'estimatedSeconds: estimateMaxVoiceSeconds(voiceText),', 1)
          anchor = "function safeMaxApiErrorCode(raw: string): string | null {\n"
          helper = """function estimateMaxVoiceSeconds(text: string): number {\n  return Math.min(45, Math.max(3, Math.ceil(text.length / 14)));\n}\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'expected safe error anchor once, found {text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)
          max_path.write_text(text)

          test_path = Path('src/lib/communication/__tests__/max-canon-channel.test.ts')
          test = test_path.read_text()
          old_url = "expect(firstFetchCall[0]).toBe('https://platform-api.max.ru/messages');"
          new_url = "expect(firstFetchCall[0]).toBe('https://platform-api2.max.ru/messages?chat_id=max-chat-1');"
          if old_url in test:
              test = test.replace(old_url, new_url, 1)
          elif new_url not in test:
              raise SystemExit('MAX URL assertion is neither old nor expected new form')
          old_body = "body: JSON.stringify({ text: 'hello', chat_id: 'max-chat-1' }),"
          new_body = "body: JSON.stringify({ text: 'hello' }),"
          if old_body in test:
              test = test.replace(old_body, new_body, 1)
          elif new_body not in test:
              raise SystemExit('MAX body assertion is neither old nor expected new form')
          test_path.write_text(test)
          PY
      - name: Remove temporary workflows and push
        run: |
          git config user.name "ASI - Autonomous Systems Integration"
          git config user.email "project.ayfaar@gmail.com"
          git add src/lib/communication/channels/max.ts src/lib/communication/__tests__/max-canon-channel.test.ts
          git rm .github/workflows/_tmp-max-finalize-patch.yml
          if [ -f .github/workflows/_tmp-max-test-patch.yml ]; then
            git rm .github/workflows/_tmp-max-test-patch.yml
          fi
          git diff --cached --check
          git commit -m "fix(communication): finalize MAX voice transport"
          git push origin HEAD:chatgpt/max-channel-v1
