name: Temporary Conversational Context Patch

on:
  push:
    branches:
      - chatgpt/conversational-concierge-v1

permissions:
  contents: write

jobs:
  patch-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/conversational-concierge-v1
          fetch-depth: 0

      - name: Wire sanitized recent dialogue into MiniGPT
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          brain = Path('src/lib/communication/guest-communication-brain.ts')
          source = brain.read_text()
          old_signature = """  llmSafeDomainProvider?: LlmSafeDomainProvider;
            telegramChatId?: number | string | null;
          }): Promise<CommunicationDecision> {"""
          new_signature = """  llmSafeDomainProvider?: LlmSafeDomainProvider;
            telegramChatId?: number | string | null;
            conversationContext?: string | null;
          }): Promise<CommunicationDecision> {"""
          if source.count(old_signature) != 1:
              raise SystemExit(f'guest brain signature match count={source.count(old_signature)}')
          source = source.replace(old_signature, new_signature, 1)

          old_call = """    telegramChatId: input.telegramChatId,
              provider: input.llmSafeDomainProvider,"""
          new_call = """    telegramChatId: input.telegramChatId,
              conversationContext: input.conversationContext,
              provider: input.llmSafeDomainProvider,"""
          if source.count(old_call) != 1:
              raise SystemExit(f'guest brain provider-call match count={source.count(old_call)}')
          brain.write_text(source.replace(old_call, new_call, 1))

          orchestrator = Path('src/lib/communication/orchestrator.ts')
          source = orchestrator.read_text()
          old_orchestrator_call = """          conversationMemory: commMemory,
                    telegramChatId: chatId,"""
          new_orchestrator_call = """          conversationMemory: commMemory,
                    conversationContext: convSession.memory.lastMessages
                      .slice(0, -1)
                      .slice(-6)
                      .map((message) => `${message.direction === 'inbound' ? 'guest' : 'assistant'}: ${String(message.content ?? '').slice(0, 240)}`)
                      .join('\\n'),
                    telegramChatId: chatId,"""
          if source.count(old_orchestrator_call) != 1:
              raise SystemExit(f'orchestrator MiniGPT-call match count={source.count(old_orchestrator_call)}')
          orchestrator.write_text(source.replace(old_orchestrator_call, new_orchestrator_call, 1))
          PY

      - name: Verify context wiring
        shell: bash
        run: |
          grep -n "conversationContext" src/lib/communication/guest-communication-brain.ts
          grep -n "conversationContext: convSession.memory.lastMessages" src/lib/communication/orchestrator.ts

      - name: Remove temporary workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/_tmp-conversational-context-patch.yml
          git config user.name "ASI-integration"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/communication/guest-communication-brain.ts src/lib/communication/orchestrator.ts .github/workflows/_tmp-conversational-context-patch.yml
          git diff --cached --check
          git commit -m "feat(communication): keep short concierge dialogue context"
          git push origin HEAD:chatgpt/conversational-concierge-v1
