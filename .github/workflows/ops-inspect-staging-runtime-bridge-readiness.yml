name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect Runtime release layout and readiness publisher safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          ROOT=/opt/asi-runtime
          CURRENT="$ROOT/current"
          RUNNER="$CURRENT/scripts/asi-runtime-bridge-runner.mjs"

          echo '=== RELEASE LAYOUT ==='
          printf 'current_target='; readlink -f "$CURRENT" 2>/dev/null || echo unavailable
          for p in "$ROOT" "$ROOT/releases" "$CURRENT" "$(readlink -f "$CURRENT" 2>/dev/null || true)"; do
            [ -n "$p" ] || continue
            if [ -e "$p" ]; then stat -c '%n owner=%U:%G mode=%a type=%F' "$p" 2>/dev/null || true; else echo "$p missing"; fi
          done
          if [ -d "$ROOT/releases" ]; then
            echo 'release_count='"$(find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l)"
            find "$ROOT/releases" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | tail -n 8 | sed 's/^/release=/' || true
          fi
          [ -f "$CURRENT/release-meta.json" ] && node - "$CURRENT/release-meta.json" <<'NODE' || true
          const fs=require('fs'); const p=process.argv[2];
          try { const m=JSON.parse(fs.readFileSync(p,'utf8')); console.log('release_meta_present=true'); console.log('release_git_sha='+(m.gitSha||'missing')); console.log('release_environment='+(m.environment||'missing')); } catch { console.log('release_meta_parse=false'); }
          NODE
          [ -d "$CURRENT/.git" ] && echo 'current_is_git=true' || echo 'current_is_git=false'

          echo '=== LIVE RUNNER FEATURES ==='
          if [ -r "$RUNNER" ]; then
            for pattern in runner_publish_readiness publishRunnerReadiness runner_claim_task 'runner-readiness.v1' 'runner-readiness.v2'; do
              if grep -Fq "$pattern" "$RUNNER"; then echo "feature_${pattern//[^A-Za-z0-9]/_}=present"; else echo "feature_${pattern//[^A-Za-z0-9]/_}=missing"; fi
            done
            echo 'runner_line_count='"$(wc -l < "$RUNNER")"
            grep -nE 'runner_publish_readiness|publishRunnerReadiness|runner_claim_task|runner-readiness\.v[12]' "$RUNNER" \
              | sed -E 's/(Bearer |token[^,; ]*=)[^,; ]+/\1[REDACTED]/Ig' | head -n 30 || true
          else
            echo 'runner_readable=false'
          fi

          echo '=== RELATED LIVE FILES ==='
          for f in asi-runtime-runner-config.mjs asi-runtime-baseline-recovery.mjs asi-runtime-bridge-executor-guard.mjs; do
            p="$CURRENT/scripts/$f"
            [ -r "$p" ] && echo "$f=present lines=$(wc -l < "$p")" || echo "$f=missing_or_unreadable"
          done

          echo '=== WRITABILITY ==='
          for p in "$ROOT" "$ROOT/releases"; do
            [ -w "$p" ] && echo "$p writable=true" || echo "$p writable=false"
          done
          echo '=== SERVICE ==='
          systemctl show asi-runtime-bridge-runner.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>/dev/null || true
          echo '=== END ==='
          REMOTE
