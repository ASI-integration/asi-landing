name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Verify staging baseline resolver credentials safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          APP_ENV=/var/www/asi-staging/shared/.env.staging.local

          echo '=== REQUIRED READINESS ENV ==='
          for key in GITHUB_TOKEN ASI_RUNTIME_BRIDGE_CLIENT_ID ASI_RUNTIME_BRIDGE_SUPABASE_URL ASI_RUNTIME_BRIDGE_SUPABASE_SERVICE_ROLE_KEY; do
            line="$(grep -m1 "^${key}=" "$APP_ENV" 2>/dev/null || true)"
            if [ -n "$line" ] && [ -n "${line#*=}" ]; then echo "$key=present"; else echo "$key=missing"; fi
          done

          echo '=== GITHUB BASELINE PROBE ==='
          token="$(grep -m1 '^GITHUB_TOKEN=' "$APP_ENV" 2>/dev/null | cut -d= -f2- || true)"
          if [ -z "$token" ]; then
            echo 'github_baseline_http=skipped_missing_token'
          else
            code="$(curl -sS -o /tmp/gh-baseline.json -w '%{http_code}' --max-time 8 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $token" \
              -H 'User-Agent: asi-owner-development-console' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/ASI-integration/asi-landing/commits/main || true)"
            echo "github_baseline_http=$code"
            if [ "$code" = 200 ]; then
              node - <<'NODE'
          const fs=require('fs'); let x={}; try{x=JSON.parse(fs.readFileSync('/tmp/gh-baseline.json','utf8'))}catch{}
          console.log('github_baseline_sha_valid='+String(/^[0-9a-f]{40}$/.test(String(x.sha||''))));
          NODE
            fi
            rm -f /tmp/gh-baseline.json
          fi

          echo '=== RUNNER LOCAL READINESS ==='
          ART=/var/lib/asi-runtime/state/bridge-runner-readiness.json
          if [ -e "$ART" ]; then
            now="$(date +%s)"; mt="$(stat -c %Y "$ART" 2>/dev/null || echo 0)"; echo "artifact_age_seconds=$((now-mt))"
          else
            echo 'artifact_missing=true'
          fi
          echo '=== END ==='
          REMOTE
