name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Locate live runner environment source safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          UNIT=/etc/systemd/system/asi-runtime-bridge-runner.service
          APP_ENV=/var/www/asi-staging/shared/.env.staging.local

          echo '=== RUNNER SERVICE ==='
          systemctl show asi-runtime-bridge-runner.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>/dev/null || true
          if [ -r "$UNIT" ]; then
            grep -E '^(User|Group|WorkingDirectory|ExecStart|EnvironmentFile)=' "$UNIT" \
              | sed -E 's#^(EnvironmentFile=).*#\1[present]#' || true
          else
            echo 'unit_file=unreadable'
          fi

          echo '=== RUNNER ENV FILE PATHS ==='
          paths="$(grep -E '^EnvironmentFile=' "$UNIT" 2>/dev/null | cut -d= -f2- | sed 's/^-//' || true)"
          if [ -z "$paths" ]; then
            echo 'environment_file=none_in_unit'
          else
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              # Strip optional surrounding quotes without evaluating content.
              f="${f#\"}"; f="${f%\"}"
              echo "environment_file=$f"
              if [ -e "$f" ]; then
                stat -c '  owner=%U:%G mode=%a size=%s' "$f" 2>/dev/null || true
                if [ -r "$f" ]; then
                  line="$(grep -m1 '^ASI_RUNTIME_BRIDGE_RUNNER_TOKEN=' "$f" 2>/dev/null || true)"
                  if [ -n "$line" ]; then
                    rv="${line#*=}"
                    echo "  runner_token=present length=${#rv}"
                    av="$(grep -m1 '^ASI_RUNTIME_BRIDGE_RUNNER_TOKEN=' "$APP_ENV" 2>/dev/null | cut -d= -f2- || true)"
                    if [ -n "$av" ]; then
                      [ "$rv" = "$av" ] && echo '  runner_token_matches_app=true' || echo '  runner_token_matches_app=false'
                    else
                      echo '  runner_token_matches_app=unknown_app_missing'
                    fi
                  else
                    echo '  runner_token=missing'
                  fi
                  url_line="$(grep -m1 '^ASI_RUNTIME_BRIDGE_URL=' "$f" 2>/dev/null || true)"
                  [ -n "$url_line" ] && echo '  bridge_url=present' || echo '  bridge_url=missing'
                  exec_line="$(grep -m1 '^ASI_RUNTIME_BRIDGE_EXECUTOR_JSON=' "$f" 2>/dev/null || true)"
                  [ -n "$exec_line" ] && echo '  executor_config=present' || echo '  executor_config=missing'
                  co_line="$(grep -m1 '^ASI_RUNTIME_BRIDGE_CHECKOUTS_JSON=' "$f" 2>/dev/null || true)"
                  [ -n "$co_line" ] && echo '  checkout_config=present' || echo '  checkout_config=missing'
                else
                  echo '  readable_by_probe_user=false'
                fi
              else
                echo '  file=missing'
              fi
            done <<< "$paths"
          fi

          echo '=== APP AUTH ==='
          if [ -r "$APP_ENV" ]; then
            for key in ASI_RUNTIME_BRIDGE_CHAT_TOKEN ASI_RUNTIME_BRIDGE_OWNER_TOKEN ASI_RUNTIME_BRIDGE_RUNNER_TOKEN; do
              line="$(grep -m1 "^${key}=" "$APP_ENV" 2>/dev/null || true)"
              if [ -n "$line" ]; then value="${line#*=}"; echo "$key=present length=${#value}"; else echo "$key=missing"; fi
            done
          else
            echo 'app_env=unreadable'
          fi

          echo '=== PROCESS ==='
          ps -eo pid,ppid,etimes,stat,comm,args | grep -E 'asi-runtime-bridge-runner|git .*asi-landing|git-upload-pack' | grep -v grep || true
          echo '=== END ==='
          REMOTE
