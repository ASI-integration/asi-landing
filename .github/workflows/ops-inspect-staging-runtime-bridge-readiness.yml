name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect runner identity and readiness publication state safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          ROOT=/opt/asi-runtime/current/scripts
          RUNNER="$ROOT/asi-runtime-bridge-runner.mjs"
          CYCLE="$ROOT/asi-runtime-bridge-runner-readiness.mjs"
          ART=/var/lib/asi-runtime/state/bridge-runner-readiness.json

          echo '=== RUNNER BOOT/IDENTITY CODE ==='
          sed -n '1,105p' "$RUNNER" 2>/dev/null || true

          echo '=== READINESS PUBLISH CYCLE IMPLEMENTATION ==='
          sed -n '180,340p' "$CYCLE" 2>/dev/null || true

          echo '=== LOCAL READINESS ARTIFACT METADATA ==='
          if [ -e "$ART" ]; then
            stat -c 'artifact_exists=true owner=%U:%G mode=%a size=%s mtime_epoch=%Y' "$ART" 2>/dev/null || true
            now="$(date +%s)"; mt="$(stat -c %Y "$ART" 2>/dev/null || echo 0)"; echo "artifact_age_seconds=$((now-mt))"
          else
            echo 'artifact_exists=false'
          fi

          echo '=== PROCESS ==='
          ps -eo pid,ppid,etimes,stat,comm,args | grep -E 'asi-runtime-bridge-runner|git .*asi-landing|git-upload-pack' | grep -v grep || true
          echo '=== END ==='
          REMOTE
