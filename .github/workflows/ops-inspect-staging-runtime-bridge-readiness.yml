name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect staging Runtime Bridge readiness safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo '=== SERVICE ==='
          printf 'runner_active='; systemctl is-active asi-runtime-bridge-runner.service 2>/dev/null || true
          echo '=== GIT PERMISSIONS ==='
          for p in /var/lib/asi-runtime/repos/asi-landing /srv/asi-landing; do
            echo "checkout=$p"
            stat -c '  worktree=%U:%G %a' "$p" 2>/dev/null || true
            stat -c '  gitdir=%U:%G %a' "$p/.git" 2>/dev/null || true
            stat -c '  HEAD=%U:%G %a size=%s' "$p/.git/HEAD" 2>/dev/null || true
            stat -c '  config=%U:%G %a size=%s' "$p/.git/config" 2>/dev/null || true
            stat -c '  mainref=%U:%G %a size=%s' "$p/.git/refs/heads/main" 2>/dev/null || true
            printf '  service_user_HEAD='; sudo -n -u asi-runtime sh -c 'tr -d "\r\n" < "$1/.git/HEAD"' sh "$p" 2>&1 || true; echo
            echo '  service_user_git:'
            sudo -n -u asi-runtime git -C "$p" rev-parse --is-inside-work-tree 2>&1 | sed 's/^/    /' || true
          done
          echo '=== END ==='
          REMOTE
