name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Probe live runner auth path without mutating Bridge
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          APP_ENV=/var/www/asi-staging/shared/.env.staging.local
          RUNNER_ENV=/etc/asi-runtime/runtime.env

          echo '=== SERVICE STATE ==='
          systemctl show asi-runtime-bridge-runner.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>/dev/null || true
          systemctl show asi-landing-staging.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>/dev/null || true

          echo '=== CONFIG CONSISTENCY ==='
          app_runner="$(grep -m1 '^ASI_RUNTIME_BRIDGE_RUNNER_TOKEN=' "$APP_ENV" 2>/dev/null | cut -d= -f2- || true)"
          runner_runner="$(grep -m1 '^ASI_RUNTIME_BRIDGE_RUNNER_TOKEN=' "$RUNNER_ENV" 2>/dev/null | cut -d= -f2- || true)"
          runner_url="$(grep -m1 '^ASI_RUNTIME_BRIDGE_URL=' "$RUNNER_ENV" 2>/dev/null | cut -d= -f2- || true)"
          runner_client="$(grep -m1 '^ASI_RUNTIME_BRIDGE_CLIENT_ID=' "$RUNNER_ENV" 2>/dev/null | cut -d= -f2- || true)"
          app_client="$(grep -m1 '^ASI_RUNTIME_BRIDGE_CLIENT_ID=' "$APP_ENV" 2>/dev/null | cut -d= -f2- || true)"
          [ -n "$app_runner" ] && echo 'app_runner_token=present' || echo 'app_runner_token=missing'
          [ -n "$runner_runner" ] && echo 'runner_token=present' || echo 'runner_token=missing'
          [ -n "$app_runner" ] && [ "$app_runner" = "$runner_runner" ] && echo 'runner_token_matches_app=true' || echo 'runner_token_matches_app=false'
          [ "$runner_url" = 'https://staging.asi-global.ru' ] && echo 'runner_url_is_staging=true' || echo 'runner_url_is_staging=false'
          [ -n "$runner_client" ] && [ "$runner_client" = "$app_client" ] && echo 'client_id_matches_app=true' || echo 'client_id_matches_app=false'

          echo '=== NON-MUTATING AUTH PROBE ==='
          if [ -n "$app_runner" ]; then
            code="$(curl -sS -o /tmp/runner-probe.json -w '%{http_code}' \
              -H "Authorization: Bearer $app_runner" \
              -H 'Content-Type: application/json' \
              --data '{}' \
              'https://staging.asi-global.ru/api/internal/asi-runtime/bridge/runner' || true)"
            echo "runner_endpoint_http=$code"
            node - <<'NODE'
          const fs=require('fs');
          let x={}; try{x=JSON.parse(fs.readFileSync('/tmp/runner-probe.json','utf8'))}catch{}
          console.log('runner_endpoint_error='+(typeof x.error==='string'?x.error:'none'));
          NODE
            rm -f /tmp/runner-probe.json
          else
            echo 'runner_endpoint_http=skipped_no_token'
          fi

          echo '=== RUNNER PROCESS ==='
          ps -eo pid,ppid,etimes,stat,comm,args | grep -E 'asi-runtime-bridge-runner|git .*asi-landing|git-upload-pack' | grep -v grep || true
          echo '=== END ==='
          REMOTE
