name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect live Runtime Bridge runner status safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo '=== RUNNER STATE ==='
          systemctl show asi-runtime-bridge-runner.service \
            -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp -p User -p Group \
            --no-pager 2>/dev/null || true

          echo '=== PROCESS SNAPSHOT 1 ==='
          ps -eo pid,ppid,etimes,stat,comm,args \
            | grep -E 'asi-runtime-bridge-runner|git .*asi-landing|git-upload-pack' \
            | grep -v grep || true

          echo '=== CHECKOUT REFS ==='
          for p in /var/lib/asi-runtime/repos/asi-landing /srv/asi-landing; do
            echo "checkout=$p"
            for ref in "$p/.git/refs/heads/main" "$p/.git/refs/remotes/origin/main"; do
              label="$(basename "$(dirname "$ref")")/$(basename "$ref")"
              if [ -r "$ref" ]; then
                value="$(tr -d '\r\n' < "$ref" 2>/dev/null || true)"
                if printf '%s' "$value" | grep -Eq '^[0-9a-fA-F]{40}$'; then
                  echo "  $label=$value"
                else
                  echo "  $label=invalid_or_empty"
                fi
              elif [ -e "$ref" ]; then
                echo "  $label=unreadable"
              else
                echo "  $label=missing_or_packed"
              fi
            done
            if [ -e "$p/.git/index.lock" ]; then echo '  index_lock=present'; else echo '  index_lock=absent'; fi
            if [ -e "$p/.git/FETCH_HEAD" ]; then
              stat -c '  FETCH_HEAD_age_epoch=%Y size=%s' "$p/.git/FETCH_HEAD" 2>/dev/null || true
            else
              echo '  FETCH_HEAD=missing'
            fi
          done

          sleep 8
          echo '=== PROCESS SNAPSHOT 2 ==='
          ps -eo pid,ppid,etimes,stat,comm,args \
            | grep -E 'asi-runtime-bridge-runner|git .*asi-landing|git-upload-pack' \
            | grep -v grep || true

          echo '=== SERVICE SUMMARY ==='
          systemctl show asi-runtime-bridge-runner.service \
            -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus \
            --no-pager 2>/dev/null || true
          echo '=== END ==='
          REMOTE
