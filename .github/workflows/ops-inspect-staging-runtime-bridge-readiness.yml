name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Provision and verify staging Runtime repository checkouts
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          [ "$(id -u)" = 0 ] || { echo 'BLOCKED: staging SSH user must be root for guarded checkout bootstrap'; exit 20; }
          command -v runuser >/dev/null || { echo 'BLOCKED: runuser is unavailable'; exit 21; }
          getent passwd asi-runtime >/dev/null || { echo 'BLOCKED: asi-runtime user missing'; exit 22; }
          RUNTIME_HOME="$(getent passwd asi-runtime | cut -d: -f6)"
          [ -d "$RUNTIME_HOME" ] || { echo 'BLOCKED: asi-runtime home missing'; exit 23; }

          as_runtime() {
            runuser -u asi-runtime -- env HOME="$RUNTIME_HOME" USER=asi-runtime LOGNAME=asi-runtime "$@"
          }

          echo '=== PRECHECK: EXECUTION LANE MUST BE FREE ==='
          curl -fsS --max-time 5 http://127.0.0.1:4173/api/queue > /tmp/asi-runtime-queue.json
          node - /tmp/asi-runtime-queue.json <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const safe={active:q.active&&{taskId:q.active.taskId,status:q.active.status},waiting:Array.isArray(q.waiting)?q.waiting.map(x=>({taskId:x.taskId,status:x.status,position:x.position})):[],canLaunch:q.canLaunch};
          console.log(JSON.stringify(safe));
          if(q.active || (Array.isArray(q.waiting)&&q.waiting.length) || q.canLaunch!==true) process.exit(24);
          NODE

          LANDING_ORIGIN='git@github.com-asi-landing:ASI-integration/asi-landing.git'
          RUNTIME_ORIGIN='git@github.com-asi-os-runtime:ASI-integration/asi-os-runtime.git'

          echo '=== VERIFY RUNTIME GITHUB SSH IDENTITIES ==='
          probe_remote() {
            local label="$1" origin="$2" result sha
            if ! result="$(as_runtime git ls-remote "$origin" refs/heads/main 2>/tmp/${label}-lsremote.err)"; then
              echo "BLOCKED: ${label} GitHub SSH identity cannot read main"
              sed -E 's/(token|secret|key)[^[:space:]]*/\1=[REDACTED]/Ig' /tmp/${label}-lsremote.err | tail -n 8 || true
              exit 25
            fi
            sha="${result%%[[:space:]]*}"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCKED: ${label} main did not resolve to a commit"; exit 26; }
            echo "${label}_remote_main=${sha}"
          }
          probe_remote landing "$LANDING_ORIGIN"
          probe_remote runtime "$RUNTIME_ORIGIN"

          ensure_checkout() {
            local label="$1" path="$2" origin="$3"
            echo "=== CHECKOUT ${label}: ${path} ==="
            if [ -e "$path" ] && [ ! -d "$path" ]; then
              echo "BLOCKED: ${path} exists and is not a directory"; exit 30
            fi
            if [ -d "$path" ] && ! as_runtime git -C "$path" rev-parse --git-dir >/dev/null 2>&1; then
              if [ -n "$(find "$path" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
                echo "BLOCKED: ${path} is non-empty and not a Git repository; refusing destructive bootstrap"; exit 31
              fi
            fi

            install -d -o asi-runtime -g asi-runtime -m 0755 "$path"

            if ! as_runtime git -C "$path" rev-parse --git-dir >/dev/null 2>&1; then
              as_runtime git -C "$path" init --initial-branch=main >/dev/null
              as_runtime git -C "$path" remote add origin "$origin"
              echo 'bootstrap=fresh'
            else
              echo 'bootstrap=existing_git'
            fi

            local observed_origin
            observed_origin="$(as_runtime git -C "$path" remote get-url origin 2>/dev/null || true)"
            if [ "$observed_origin" != "$origin" ]; then
              echo "BLOCKED: ${path} origin mismatch"; exit 32
            fi
            if [ -n "$(as_runtime git -C "$path" status --porcelain --untracked-files=all 2>/dev/null || true)" ]; then
              echo "BLOCKED: ${path} is dirty; refusing to reset it"; exit 33
            fi

            as_runtime git -C "$path" fetch --prune origin main >/dev/null
            local remote_sha head branch
            remote_sha="$(as_runtime git -C "$path" rev-parse refs/remotes/origin/main)"
            as_runtime git -C "$path" checkout -B main refs/remotes/origin/main >/dev/null
            as_runtime git -C "$path" branch --set-upstream-to=origin/main main >/dev/null
            head="$(as_runtime git -C "$path" rev-parse HEAD)"
            branch="$(as_runtime git -C "$path" branch --show-current)"
            [ "$head" = "$remote_sha" ] || { echo "BLOCKED: ${path} HEAD is not origin/main"; exit 34; }
            [ "$branch" = main ] || { echo "BLOCKED: ${path} is not on main"; exit 35; }
            [ -z "$(as_runtime git -C "$path" status --porcelain --untracked-files=all)" ] || { echo "BLOCKED: ${path} became dirty"; exit 36; }
            echo "verified=true branch=${branch} head=${head}"
          }

          ensure_checkout landing-srv /srv/asi-landing "$LANDING_ORIGIN"
          ensure_checkout landing-pool /var/lib/asi-runtime/repos/asi-landing "$LANDING_ORIGIN"
          ensure_checkout runtime-srv /srv/asi-os-runtime "$RUNTIME_ORIGIN"
          ensure_checkout runtime-pool /var/lib/asi-runtime/repos/asi-os-runtime "$RUNTIME_ORIGIN"

          echo '=== WAIT FOR BRIDGE RUNNER READINESS RECONCILIATION ==='
          sleep 12
          ART=/var/lib/asi-runtime/state/bridge-runner-readiness.json
          [ -r "$ART" ] || { echo 'BLOCKED: readiness artifact missing'; exit 40; }
          node - "$ART" <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const out={
            schemaVersion:x.schemaVersion,
            checkedAt:x.checkedAt,
            expiresAt:x.expiresAt,
            capabilities:x.capabilities,
            blockers:x.blockers,
            repositories:Array.isArray(x.repositories)?x.repositories.map(r=>({repositoryId:r.repositoryId,fullName:r.fullName,canonicalCheckoutPath:r.canonicalCheckoutPath,observedBaselineSha:r.observedBaselineSha,checkoutReady:r.checkoutReady,originReady:r.originReady,baselineReady:r.baselineReady,recoveryReady:r.recoveryReady,blockers:r.blockers})):[]
          };
          console.log(JSON.stringify(out));
          const repos=out.repositories;
          const everyRepoReady=repos.length>=4 && repos.every(r=>r.checkoutReady&&r.originReady&&r.baselineReady&&r.recoveryReady&&(!r.blockers||r.blockers.length===0));
          const caps=x.capabilities||{};
          const capabilitiesReady=caps.checkouts?.state==='ready' && caps.baselineRecovery?.state==='ready' && caps.executor?.state==='ready';
          if(!everyRepoReady || !capabilitiesReady || (Array.isArray(x.blockers)&&x.blockers.length)) process.exit(41);
          NODE

          echo '=== FINAL RUNTIME LANE ==='
          curl -fsS --max-time 5 http://127.0.0.1:4173/api/queue > /tmp/asi-runtime-queue-after.json
          node - /tmp/asi-runtime-queue-after.json <<'NODE'
          const fs=require('fs'); const q=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(JSON.stringify({active:q.active&&{taskId:q.active.taskId,status:q.active.status},waiting:Array.isArray(q.waiting)?q.waiting.map(x=>({taskId:x.taskId,status:x.status,position:x.position})):[],canLaunch:q.canLaunch}));
          if(q.active || (Array.isArray(q.waiting)&&q.waiting.length) || q.canLaunch!==true) process.exit(42);
          NODE
          echo 'STRIGUNOV_RUNTIME_CHECKOUTS_READY=true'
          rm -f /tmp/asi-runtime-queue.json /tmp/asi-runtime-queue-after.json /tmp/landing-lsremote.err /tmp/runtime-lsremote.err
          REMOTE
