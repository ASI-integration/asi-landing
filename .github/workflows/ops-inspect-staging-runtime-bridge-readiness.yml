name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect staging Runtime Bridge readiness safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required staging secret: ${key}"
              exit 1
            fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key

          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo '=== SERVICE ==='
          printf 'runner_active='; systemctl is-active asi-runtime-bridge-runner.service 2>/dev/null || true
          systemctl show asi-runtime-bridge-runner.service -p User -p Group -p WorkingDirectory -p EnvironmentFiles -p ExecStart --no-pager 2>/dev/null || true

          echo '=== SAFE HOST READINESS ==='
          cat > /tmp/asi-runtime-readiness-probe.mjs <<'NODE'
          import fs from 'node:fs';
          const envPath = '/etc/asi-runtime/runtime.env';
          const runtimeRoot = '/opt/asi-runtime/current';
          const modulePath = 'file:///opt/asi-runtime/current/scripts/asi-runtime-runner-config.mjs';
          const raw = fs.readFileSync(envPath, 'utf8');
          for (const line of raw.split(/\r?\n/)) {
            const trimmed = line.trim();
            if (!trimmed || trimmed.startsWith('#')) continue;
            const i = trimmed.indexOf('=');
            if (i <= 0) continue;
            const key = trimmed.slice(0, i).trim();
            let value = trimmed.slice(i + 1).trim();
            if ((value.startsWith("'") && value.endsWith("'")) || (value.startsWith('"') && value.endsWith('"'))) value = value.slice(1, -1);
            process.env[key] = value;
          }
          process.chdir(runtimeRoot);
          const { inspectRuntimeRunnerHostReadiness } = await import(modulePath);
          const r = await inspectRuntimeRunnerHostReadiness();
          console.log(JSON.stringify({
            canExecute: r.canExecute,
            baselineSha: r.baselineSha,
            capabilities: r.capabilities,
            checkoutCount: Array.isArray(r.runtimeCheckouts) ? r.runtimeCheckouts.length : 0,
            hasExecutorConfig: r.executorConfig !== null,
          }));
          NODE
          chmod 644 /tmp/asi-runtime-readiness-probe.mjs
          if [ -r /etc/asi-runtime/runtime.env ]; then
            node /tmp/asi-runtime-readiness-probe.mjs || true
          elif sudo -n -u asi-runtime /usr/bin/node /tmp/asi-runtime-readiness-probe.mjs >/tmp/asi-runtime-readiness.out 2>/tmp/asi-runtime-readiness.err; then
            cat /tmp/asi-runtime-readiness.out
          else
            echo 'probe_unavailable=runtime_env_not_readable_and_no_safe_sudo'
          fi
          rm -f /tmp/asi-runtime-readiness-probe.mjs /tmp/asi-runtime-readiness.out /tmp/asi-runtime-readiness.err

          echo '=== GIT METADATA INTEGRITY ==='
          for p in /var/lib/asi-runtime/repos/asi-landing /srv/asi-landing; do
            echo "checkout=$p"
            for f in HEAD config; do
              if [ -f "$p/.git/$f" ]; then
                printf '  %s=present size=' "$f"; stat -c %s "$p/.git/$f" 2>/dev/null || true
              else
                echo "  $f=missing"
              fi
            done
            for d in objects refs; do
              if [ -d "$p/.git/$d" ]; then
                printf '  %s=present entries=' "$d"; find "$p/.git/$d" -mindepth 1 -maxdepth 2 2>/dev/null | wc -l
              else
                echo "  $d=missing"
              fi
            done
            if [ -f "$p/.git/HEAD" ]; then
              head_line="$(head -n1 "$p/.git/HEAD" 2>/dev/null || true)"
              case "$head_line" in
                ref:\ refs/heads/*) echo "  HEAD_shape=symbolic" ;;
                [0-9a-f][0-9a-f]*) echo "  HEAD_shape=detached_or_sha" ;;
                *) echo "  HEAD_shape=invalid" ;;
              esac
            fi
            printf '  git_rev_parse='; sudo -n -u asi-runtime git -C "$p" rev-parse --git-dir 2>/dev/null || echo FAIL
          done
          echo '=== END ==='
          REMOTE
