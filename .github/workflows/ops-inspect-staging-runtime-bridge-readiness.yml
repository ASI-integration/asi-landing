name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Sync and verify staging Runtime landing baseline
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          API=https://api.github.com/repos/ASI-integration/asi-landing/commits/main
          REPO=''
          for candidate in /srv/asi-landing /var/lib/asi-runtime/repos/asi-landing; do
            if git -C "$candidate" rev-parse --git-dir >/dev/null 2>&1; then REPO="$candidate"; break; fi
          done
          if [ -z "$REPO" ]; then echo 'runtime_landing_checkout_missing=true'; exit 21; fi
          echo "runtime_landing_checkout=$REPO"
          before="$(git -C "$REPO" rev-parse HEAD)"
          echo "checkout_head_before=$before"

          if sudo -n -u asi-runtime git -C "$REPO" fetch --prune origin main >/dev/null 2>&1; then
            GIT='sudo -n -u asi-runtime git'
            echo 'fetch_mode=asi-runtime'
          else
            git -C "$REPO" fetch --prune origin main >/dev/null
            GIT='git'
            echo 'fetch_mode=ssh-user'
          fi

          remote="$($GIT -C "$REPO" rev-parse refs/remotes/origin/main)"
          public="$(curl -fsS --max-time 10 -H 'Accept: application/vnd.github+json' -H 'User-Agent: asi-runtime-baseline-sync' "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).sha))")"
          echo "origin_main=$remote"
          echo "github_main=$public"
          test "$remote" = "$public"
          $GIT -C "$REPO" cat-file -e "${public}^{commit}"
          echo 'RUNTIME_BASELINE_SYNCED=true'

          curl -fsS --max-time 5 http://127.0.0.1:4173/api/queue | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const q=JSON.parse(s); console.log(JSON.stringify({active:q.active,waiting:q.waiting,canLaunch:q.canLaunch})); if(q.active||q.waiting?.length||q.canLaunch!==true)process.exit(22)})"
          echo 'RUNTIME_LANE_FREE=true'
          REMOTE