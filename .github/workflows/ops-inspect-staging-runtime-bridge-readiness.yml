name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Identify live readiness contract and staging release safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          ROOT=/opt/asi-runtime/current
          RUNNER="$ROOT/scripts/asi-runtime-bridge-runner.mjs"

          echo '=== STAGING APP RELEASE ==='
          curl -fsS --max-time 10 http://127.0.0.1:3001/api/version -o /tmp/asi-version.json || true
          node - <<'NODE'
          const fs=require('fs');
          try {
            const v=JSON.parse(fs.readFileSync('/tmp/asi-version.json','utf8'));
            console.log('staging_environment='+(v.environment||'missing'));
            console.log('staging_sha='+(v.sha||'missing'));
            console.log('staging_app_version='+(v.appVersion||'missing'));
          } catch { console.log('staging_version_unavailable=true'); }
          NODE
          rm -f /tmp/asi-version.json

          echo '=== RUNNER READINESS IMPORT ==='
          if [ -r "$RUNNER" ]; then
            grep -nE 'publishRunnerReadinessCycle|runner-readiness|readiness' "$RUNNER" | head -n 25 || true
          else
            echo 'runner_readable=false'
          fi

          echo '=== READINESS HELPER FILES ==='
          helpers="$(grep -RIl --include='*.mjs' 'publishRunnerReadinessCycle' "$ROOT/scripts" 2>/dev/null || true)"
          if [ -z "$helpers" ]; then
            echo 'helper=not_found'
          else
            while IFS= read -r helper; do
              [ -n "$helper" ] || continue
              echo "helper=$(basename "$helper")"
              echo "helper_lines=$(wc -l < "$helper")"
              grep -nE "schemaVersion|runner-readiness\.v[12]|reasonCode|blockers|repositories|observedBaselineSha|baselineSha" "$helper" \
                | head -n 90 || true
            done <<< "$helpers"
          fi

          echo '=== LIVE CONFIG FEATURE KEYS ==='
          CONFIG="$ROOT/scripts/asi-runtime-runner-config.mjs"
          if [ -r "$CONFIG" ]; then
            grep -nE "schemaVersion|runner-readiness\.v[12]|reasonCode|repositories|observedBaselineSha|baselineSha|canExecute" "$CONFIG" \
              | head -n 100 || true
          else
            echo 'config_readable=false'
          fi

          echo '=== SERVICE ==='
          systemctl show asi-runtime-bridge-runner.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>/dev/null || true
          echo '=== END ==='
          REMOTE
