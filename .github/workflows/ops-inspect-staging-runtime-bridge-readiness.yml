name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect live Runtime Bridge runner status safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo '=== RUNNER STATE ==='
          systemctl show asi-runtime-bridge-runner.service \
            -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus -p ActiveEnterTimestamp \
            --no-pager 2>/dev/null || true
          echo '=== RUNNER STATUS TAIL ==='
          systemctl status asi-runtime-bridge-runner.service --no-pager -n 30 2>&1 \
            | sed -E 's/(Bearer |token=)[^ ]+/\1[REDACTED]/Ig' \
            | tail -n 45 || true
          echo '=== LANDING STATE ==='
          systemctl show asi-landing-staging.service -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus --no-pager 2>/dev/null || true
          echo '=== END ==='
          REMOTE
