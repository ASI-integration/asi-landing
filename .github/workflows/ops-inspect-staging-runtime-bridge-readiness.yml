name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect staging Runtime Bridge readiness safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          echo '=== SERVICE ==='
          printf 'runner_active='; systemctl is-active asi-runtime-bridge-runner.service 2>/dev/null || true

          echo '=== HEAD CLASSIFICATION ==='
          for p in /var/lib/asi-runtime/repos/asi-landing /srv/asi-landing; do
            printf '%s: ' "$p"
            h="$(tr -d '\r\n' < "$p/.git/HEAD" 2>/dev/null || true)"
            if printf '%s' "$h" | grep -Eq '^[0-9a-fA-F]{40}$'; then
              echo "HEAD=sha40:${h}"
            elif printf '%s' "$h" | grep -Eq '^ref: refs/heads/[A-Za-z0-9._/-]+$'; then
              echo "HEAD=symbolic:${h#ref: }"
            else
              printf 'HEAD=invalid hex='
              od -An -tx1 -N48 "$p/.git/HEAD" 2>/dev/null | tr -d ' \n'; echo
            fi
            for ref in "$p/.git/refs/heads/main" "$p/.git/refs/remotes/origin/main"; do
              if [ -f "$ref" ]; then
                v="$(tr -d '\r\n' < "$ref")"
                if printf '%s' "$v" | grep -Eq '^[0-9a-fA-F]{40}$'; then echo "  $(basename "$ref")=sha40:${v}"; else echo "  $(basename "$ref")=invalid"; fi
              else
                echo "  $(basename "$ref")=missing"
              fi
            done
            [ -f "$p/.git/packed-refs" ] && echo '  packed_refs=present' || echo '  packed_refs=missing'
          done
          echo '=== END ==='
          REMOTE
