name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect staging Bridge auth wiring without exposing credentials
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail

          echo '=== SERVICES ==='
          systemctl show asi-runtime-bridge-runner.service \
            -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus -p User -p Group -p FragmentPath -p DropInPaths \
            --no-pager 2>/dev/null || true
          systemctl show asi-landing-staging.service \
            -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus -p User -p Group -p FragmentPath -p DropInPaths \
            --no-pager 2>/dev/null || true

          echo '=== ENV FILE METADATA ==='
          for f in \
            /var/www/asi-staging/shared/.env.staging.local \
            /etc/asi-runtime/bridge.env \
            /etc/asi-landing/staging-runtime-bridge.env; do
            if [ -e "$f" ]; then
              stat -c '%n owner=%U:%G mode=%a size=%s' "$f" 2>/dev/null || echo "$f metadata=unavailable"
            else
              echo "$f missing"
            fi
          done

          echo '=== APP BRIDGE AUTH SHAPE ==='
          APP_ENV=/var/www/asi-staging/shared/.env.staging.local
          if [ -r "$APP_ENV" ]; then
            for key in ASI_RUNTIME_BRIDGE_CHAT_TOKEN ASI_RUNTIME_BRIDGE_OWNER_TOKEN ASI_RUNTIME_BRIDGE_RUNNER_TOKEN ASI_RUNTIME_BRIDGE_CLIENT_ID ASI_RUNTIME_BRIDGE_SUPABASE_SCHEMA; do
              line="$(grep -m1 "^${key}=" "$APP_ENV" 2>/dev/null || true)"
              if [ -z "$line" ]; then
                echo "$key=missing"
              else
                value="${line#*=}"
                if [[ "$key" == *_TOKEN ]]; then
                  echo "$key=present length=${#value}"
                else
                  echo "$key=present"
                fi
              fi
            done
            chat="$(grep -m1 '^ASI_RUNTIME_BRIDGE_CHAT_TOKEN=' "$APP_ENV" 2>/dev/null | cut -d= -f2- || true)"
            owner="$(grep -m1 '^ASI_RUNTIME_BRIDGE_OWNER_TOKEN=' "$APP_ENV" 2>/dev/null | cut -d= -f2- || true)"
            runner="$(grep -m1 '^ASI_RUNTIME_BRIDGE_RUNNER_TOKEN=' "$APP_ENV" 2>/dev/null | cut -d= -f2- || true)"
            if [ -n "$chat" ] && [ -n "$owner" ] && [ -n "$runner" ]; then
              if [ "$chat" = "$owner" ] || [ "$chat" = "$runner" ] || [ "$owner" = "$runner" ]; then
                echo 'bridge_tokens_distinct=false'
              else
                echo 'bridge_tokens_distinct=true'
              fi
            else
              echo 'bridge_tokens_distinct=unknown_missing_token'
            fi
          else
            echo 'app_env=unreadable'
          fi

          echo '=== RECENT RUNNER LOG SHAPE ==='
          journalctl -u asi-runtime-bridge-runner.service --since '-90 seconds' --no-pager 2>/dev/null \
            | grep -E 'Runtime bridge runner poll failed|runtime-baseline|Started|Stopped|Failed' \
            | tail -n 40 || echo 'journal=unavailable_or_empty'

          echo '=== PROCESS ==='
          ps -eo pid,ppid,etimes,stat,comm,args \
            | grep -E 'asi-runtime-bridge-runner|git .*asi-landing|git-upload-pack' \
            | grep -v grep || true
          echo '=== END ==='
          REMOTE
