name: Ops Inspect Staging Runtime Bridge Readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ops-inspect-staging-runtime-bridge-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect live readiness evidence builder contract safely
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail
          for key in STAGING_SSH_HOST STAGING_SSH_USER STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!key:-}" ]; then echo "Missing required staging secret: ${key}"; exit 1; fi
          done
          SSH_PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_probe_key
          chmod 600 ~/.ssh/staging_probe_key
          ssh -i ~/.ssh/staging_probe_key -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          ROOT=/opt/asi-runtime/current/scripts
          RUNNER="$ROOT/asi-runtime-bridge-runner.mjs"
          CONFIG="$ROOT/asi-runtime-runner-config.mjs"
          CYCLE="$ROOT/asi-runtime-bridge-runner-readiness.mjs"

          echo '=== RUNNER PUBLISH FLOW ==='
          sed -n '430,472p' "$RUNNER" 2>/dev/null || true

          echo '=== EVIDENCE V2 BUILDER ==='
          sed -n '650,738p' "$CONFIG" 2>/dev/null || true

          echo '=== READINESS PUBLISH CYCLE ==='
          sed -n '1,180p' "$CYCLE" 2>/dev/null || true

          echo '=== SERVICE ==='
          systemctl show asi-runtime-bridge-runner.service -p ActiveState -p SubState -p MainPID -p NRestarts --no-pager 2>/dev/null || true
          echo '=== END ==='
          REMOTE
