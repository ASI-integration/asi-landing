name: Telegram Guest Concierge Smoke

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Optional production release SHA to verify on VPS (/api/version). Smoke assets always come from the workflow branch.
        required: false
        type: string

permissions:
  contents: read

jobs:
  telegram_smoke:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout smoke script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run live Telegram acceptance on VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
          TEST_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          REMOTE_USER="project_ayfaar"
          REMOTE_PORT="${VPS_PORT:-22}"
          REMOTE_TMP="/home/project_ayfaar/asi-deploy-tmp"
          REMOTE_TEST_CHAT_ID_FILE="${REMOTE_TMP}/telegram-test-chat-id"
          CASES_FILE="tests/guest-concierge-llm-live-cases.ru.json"
          if [[ ! -f "$CASES_FILE" ]]; then
            echo "Missing smoke cases file: $CASES_FILE (checkout ref=${GITHUB_REF}, sha=${GITHUB_SHA})"
            exit 1
          fi
          if [[ -z "${TELEGRAM_TEST_CHAT_ID:-}" ]]; then
            echo "::error::Missing required GitHub secret TELEGRAM_TEST_CHAT_ID=<id тестового Telegram-чата>"
            exit 1
          fi
          if [[ -n "${TEST_SHA:-}" ]]; then
            echo "Requested production release SHA (VPS /api/version check only): ${TEST_SHA}"
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY=~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          SSH_OPTS=(
            -i "$SSH_KEY"
            -p "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ConnectTimeout=20
          )
          SCP_OPTS=(
            -i "$SSH_KEY"
            -P "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ConnectTimeout=20
          )

          ssh-keyscan -p "$REMOTE_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "mkdir -p '${REMOTE_TMP}'"
          scp "${SCP_OPTS[@]}" scripts/telegram-live-acceptance.mjs "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/telegram-live-acceptance.mjs"
          scp "${SCP_OPTS[@]}" "$CASES_FILE" "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/guest-concierge-llm-live-cases.ru.json"
          printf '%s' "$TELEGRAM_TEST_CHAT_ID" | ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "umask 077 && cat > '${REMOTE_TEST_CHAT_ID_FILE}'"

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" bash -lc "set -euo pipefail
            cd /var/www/asi/current
            trap \"rm -f '${REMOTE_TEST_CHAT_ID_FILE}'\" EXIT
            set -a
            source /var/www/asi/shared/.env.production.live
            set +a
            echo '=== production version ==='
            curl -fsS http://127.0.0.1:3000/api/version
            echo
            echo '=== guest concierge env ==='
            echo GUEST_CONCIERGE_LLM_ENABLED=\${GUEST_CONCIERGE_LLM_ENABLED:-missing}
            echo GUEST_CONCIERGE_LLM_MODEL=\${GUEST_CONCIERGE_LLM_MODEL:-missing}
            export TELEGRAM_LIVE_CASES_PATH='${REMOTE_TMP}/guest-concierge-llm-live-cases.ru.json'
            export TELEGRAM_TEST_CHAT_ID=\"\$(cat '${REMOTE_TEST_CHAT_ID_FILE}')\"
            node '${REMOTE_TMP}/telegram-live-acceptance.mjs'
          "
