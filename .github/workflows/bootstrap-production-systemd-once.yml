name: One-time production env diagnostic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DIAGNOSE_PRODUCTION_ENV
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ inputs.confirm == 'DIAGNOSE_PRODUCTION_ENV' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect production env key names only
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          [ -n "${VPS_HOST:-}" ] || { echo "Missing VPS_HOST"; exit 1; }
          [ -n "${VPS_SSH_KEY:-}" ] || { echo "Missing VPS_SSH_KEY"; exit 1; }
          REMOTE_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          SSH_OPTS=(-i ~/.ssh/id_ed25519 -p "$REMOTE_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          ssh "${SSH_OPTS[@]}" "root@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo '=== SERVICE ==='
          systemctl show asi-landing.service -p ActiveState -p SubState -p MainPID -p FragmentPath -p DropInPaths --no-pager
          echo '=== ENV FILE KEY NAMES ==='
          for f in /srv/asi-landing/.env /srv/asi-landing/.env.local /srv/asi-landing/.env.production /srv/asi-landing/.env.production.local /var/www/asi/shared/.env.production.local; do
            [ -f "$f" ] || continue
            echo "--- $f"
            sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' "$f" | sort -u
          done
          pid="$(systemctl show asi-landing.service -p MainPID --value)"
          echo '=== PROCESS RELEVANT ENV KEYS ==='
          tr '\0' '\n' < "/proc/$pid/environ" | sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' | grep -E '^(SUPABASE|NEXT_PUBLIC_SUPABASE|BOOKING_OPS|CRON_SECRET|TELEGRAM|OPENAI|GOOGLE_|NEXT_PUBLIC_)' | sort -u || true
          echo '=== REQUIRED KEY PRESENCE ==='
          for key in SUPABASE_URL NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BOOKING_OPS_AUTO_SEND_RUNNER_SECRET; do
            if tr '\0' '\n' < "/proc/$pid/environ" | grep -q "^${key}="; then echo "$key=SET"; else echo "$key=MISSING"; fi
          done
          REMOTE
