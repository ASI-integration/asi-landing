name: Apply ASI Runtime Snapshot Migration

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Type APPLY_ASI_RUNTIME_SNAPSHOT_MIGRATION to run production DDL
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply_asi_runtime_snapshot_migration:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production_migration }}" != "APPLY_ASI_RUNTIME_SNAPSHOT_MIGRATION" ]; then
            echo "Set confirm_production_migration to APPLY_ASI_RUNTIME_SNAPSHOT_MIGRATION."
            exit 1
          fi

      - name: Checkout migration files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply migration on production database
        shell: bash
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${PRODUCTION_DATABASE_URL:-}" ]]; then
            echo "::error::Missing PRODUCTION_DATABASE_URL"
            exit 1
          fi

          python3 -m pip install --quiet psycopg2-binary
          PRODUCTION_DATABASE_URL="$PRODUCTION_DATABASE_URL" python3 scripts/apply-asi-runtime-snapshot-migration-remote.py

      - name: Verify migration via Supabase REST on VPS env
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          REMOTE_USER="project_ayfaar"
          REMOTE_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY=~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          ssh-keyscan -p "$REMOTE_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          SSH_OPTS=(-i "$SSH_KEY" -p "$REMOTE_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20)
          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "bash -lc 'set -a; source /var/www/asi/shared/.env.production.live; set +a; curl -sS -o /tmp/runtime-table-probe.json -w \"http=%{http_code}\n\" \"\${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/asi_runtime_snapshots?select=user_id&limit=1\" -H \"apikey: \${SUPABASE_SERVICE_ROLE_KEY}\" -H \"Authorization: Bearer \${SUPABASE_SERVICE_ROLE_KEY}\"'"
