name: Apply ASI Runtime Snapshot Migration

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Type APPLY_ASI_RUNTIME_SNAPSHOT_MIGRATION to run production DDL
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply_asi_runtime_snapshot_migration:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_production_migration }}" != "APPLY_ASI_RUNTIME_SNAPSHOT_MIGRATION" ]; then
            echo "Set confirm_production_migration to APPLY_ASI_RUNTIME_SNAPSHOT_MIGRATION."
            exit 1
          fi

      - name: Checkout migration files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply migration on production VPS database
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" || -z "${VPS_SSH_KEY:-}" ]]; then
            echo "::error::Missing VPS_HOST or VPS_SSH_KEY"
            exit 1
          fi

          REMOTE_USER="project_ayfaar"
          REMOTE_PORT="${VPS_PORT:-22}"
          REMOTE_TMP="/home/project_ayfaar/asi-migration-tmp"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY=~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          ssh-keyscan -p "$REMOTE_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS=(-i "$SSH_KEY" -p "$REMOTE_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20)
          SCP_OPTS=(-i "$SSH_KEY" -P "$REMOTE_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o LogLevel=ERROR -o ConnectTimeout=20)

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "mkdir -p '${REMOTE_TMP}' && chmod 700 '${REMOTE_TMP}'"
          scp "${SCP_OPTS[@]}" supabase/migrations/20260720120000_asi_runtime_snapshot_v1.sql "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/asi_runtime_snapshot_v1.sql"

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          ENV_FILE=/var/www/asi/shared/.env.production.live
          set -a
          # shellcheck disable=SC1090
          source "$ENV_FILE"
          set +a
          PM2_ENV="$(sudo -u project_ayfaar pm2 env 0 2>/dev/null || true)"
          while IFS= read -r line; do
            for prefix in SUPABASE_DB_URL: DATABASE_URL: PRODUCTION_DATABASE_URL:; do
              if [[ "$line" == "$prefix"* ]]; then
                key="${prefix%:}"
                val="${line#"$prefix"}"
                val="${val#"${val%%[![:space:]]*}"}"
                export "$key=$val"
              fi
            done
          done <<< "$PM2_ENV"
          DB_URL="${SUPABASE_DB_URL:-${DATABASE_URL:-${PRODUCTION_DATABASE_URL:-}}}"
          if [[ -z "$DB_URL" ]]; then
            echo "Missing SUPABASE_DB_URL/DATABASE_URL/PRODUCTION_DATABASE_URL in production env or pm2 env"
            echo "available_db_keys=$(grep -E '^(SUPABASE_DB_URL|DATABASE_URL|PRODUCTION_DATABASE_URL)=' "$ENV_FILE" | cut -d= -f1 | tr '\n' ',' || true)"
            exit 2
          fi
          SQL_FILE="/home/project_ayfaar/asi-migration-tmp/asi_runtime_snapshot_v1.sql"
          PROBE_URL="${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/asi_runtime_snapshots?select=user_id&limit=1"
          BEFORE_CODE="$(curl -sS -o /tmp/runtime-table-before.json -w '%{http_code}' \
            "$PROBE_URL" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" || true)"
          echo "before_http=${BEFORE_CODE}"
          if [[ "$BEFORE_CODE" == "200" ]]; then
            echo "MIGRATION_STATUS=already_applied"
            exit 0
          fi
          if command -v psql >/dev/null 2>&1; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
          else
            VENV="/home/project_ayfaar/asi-migration-tmp/.venv"
            python3 -m venv "$VENV"
            "$VENV/bin/pip" install --quiet psycopg2-binary
            ASI_RUNTIME_MIGRATION_SQL="$SQL_FILE" SUPABASE_DB_URL="$DB_URL" "$VENV/bin/python" - <<'PY'
          import os
          from pathlib import Path
          import psycopg2
          sql = Path(os.environ["ASI_RUNTIME_MIGRATION_SQL"]).read_text(encoding="utf-8")
          conn = psycopg2.connect(os.environ["SUPABASE_DB_URL"])
          conn.autocommit = True
          with conn.cursor() as cur:
              cur.execute(sql)
              cur.execute("NOTIFY pgrst, 'reload schema';")
          conn.close()
          print("MIGRATION_STATUS=applied_now")
          PY
          fi
          AFTER_CODE="$(curl -sS -o /tmp/runtime-table-after.json -w '%{http_code}' \
            "$PROBE_URL" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" || true)"
          echo "after_http=${AFTER_CODE}"
          if [[ "$AFTER_CODE" != "200" ]]; then
            echo "MIGRATION_STATUS=apply_failed"
            head -c 240 /tmp/runtime-table-after.json 2>/dev/null || true
            echo
            exit 3
          fi
          echo "MIGRATION_STATUS=applied_ok"
          REMOTE
