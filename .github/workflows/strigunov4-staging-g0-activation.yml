name: Strigunov4 staging G0 protected systemd activation

on:
  pull_request:
    paths:
      - '.github/workflows/strigunov4-staging-g0-activation.yml'
      - 'scripts/strigunov4/g0_safe_extract.py'
      - 'scripts/strigunov4/g0_staging_host.py'
      - 'scripts/strigunov4/protected_staging_g0_activation.py'
      - 'scripts/strigunov4/test_g0_safe_extract.py'
      - 'scripts/strigunov4/test_protected_staging_g0_activation.py'
      - 'docs/strigunov4/PROTECTED-G0-STAGING-ACTIVATION.md'
      - 'scripts/strigunov4/g0_release_archive.py'
      - 'scripts/strigunov4/protected_staging_sql_apply.py'
      - 'scripts/strigunov4/staging_nine_sql_candidate.py'
  workflow_dispatch:
    inputs:
      reviewed_main_sha:
        description: Exact current reviewed main SHA
        required: true
        type: string
      confirm:
        description: Type ACTIVATE_STRIGUNOV4_G0_<full main SHA>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: strigunov4-staging-g0-activation
  cancel-in-progress: false

jobs:
  offline_source_tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify safe archive materialization and fail-closed protected admission
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/strigunov4/g0_safe_extract.py scripts/strigunov4/g0_staging_host.py scripts/strigunov4/protected_staging_g0_activation.py
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_g0_safe_extract.py' -v
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_protected_staging_g0_activation.py' -v
          git diff --check

  protected_owner_activate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 35
    steps:
      - name: Fail closed unless exact protected main SHA and owner confirmation
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = ASI-integration/asi-landing
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = ASI-integration
          test "$GITHUB_ACTOR_ID" = 207600140
          test "$GITHUB_TRIGGERING_ACTOR" = ASI-integration
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_WORKFLOW_REF" = 'ASI-integration/asi-landing/.github/workflows/strigunov4-staging-g0-activation.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$REVIEWED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = "ACTIVATE_STRIGUNOV4_G0_$REVIEWED_SHA"
      - name: Checkout exact approved protected source, never persist credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Test exact checkout without exposing staging credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_g0_safe_extract.py' -v
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_protected_staging_g0_activation.py' -v
      - name: Refuse a stale main branch before any staging mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api repos/ASI-integration/asi-landing/git/ref/heads/main --jq .object.sha)"
          test "$current_sha" = "$GITHUB_SHA"
      - name: Check committed nine SQL, verified no-send, then activate exact G0 release
        env:
          STAGING_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          STAGING_ACTIVATE_CONFIRM: ${{ inputs.confirm }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: python3 scripts/strigunov4/protected_staging_g0_activation.py
