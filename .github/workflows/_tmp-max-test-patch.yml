name: Temporary MAX test patch

on:
  push:
    branches:
      - chatgpt/max-channel-v1
    paths:
      - .github/workflows/_tmp-max-test-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/max-channel-v1
          fetch-depth: 0
      - name: Patch stale MAX API expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/communication/__tests__/max-canon-channel.test.ts')
          text = path.read_text()
          old_url = "expect(firstFetchCall[0]).toBe('https://platform-api.max.ru/messages');"
          new_url = "expect(firstFetchCall[0]).toBe('https://platform-api2.max.ru/messages?chat_id=max-chat-1');"
          if text.count(old_url) != 1:
              raise SystemExit(f'expected one old URL assertion, found {text.count(old_url)}')
          text = text.replace(old_url, new_url, 1)
          old_body = "body: JSON.stringify({ text: 'hello', chat_id: 'max-chat-1' }),"
          new_body = "body: JSON.stringify({ text: 'hello' }),"
          if text.count(old_body) != 1:
              raise SystemExit(f'expected one old body assertion, found {text.count(old_body)}')
          text = text.replace(old_body, new_body, 1)
          path.write_text(text)
          PY
      - name: Remove temporary workflow and push
        run: |
          git config user.name "ASI - Autonomous Systems Integration"
          git config user.email "project.ayfaar@gmail.com"
          git add src/lib/communication/__tests__/max-canon-channel.test.ts
          git rm .github/workflows/_tmp-max-test-patch.yml
          git diff --cached --check
          git commit -m "test(communication): align MAX API transport expectations"
          git push origin HEAD:chatgpt/max-channel-v1
