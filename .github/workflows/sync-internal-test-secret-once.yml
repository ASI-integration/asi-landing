name: Sync Internal Test Secret Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-internal-test-secret-once.yml
      - src/lib/communication/autopilot.ts
      - src/lib/communication/__tests__/autopilot.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync_and_acceptance:
    runs-on: ubuntu-latest
    environment: production
    env:
      ACCEPTANCE_BASE_URL: https://asi-global.ru
      INTERNAL_TEST_SECRET: ${{ secrets.INTERNAL_TEST_SECRET }}
      GUEST_CONCIERGE_LLM_ENABLED: "true"
      GUEST_CONCIERGE_LLM_MODEL: gpt-4o-mini
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Checkout acceptance script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Focused tests
        run: npm exec -- vitest run src/lib/communication/__tests__/autopilot.test.ts src/lib/communication/__tests__/guest-concierge-http-guardrails.test.ts

      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          npm run build
          npm prune --omit=dev

          rm -rf release
          mkdir -p release
          cp package.json package-lock.json next.config.js ecosystem.config.cjs release/
          mkdir -p release/scripts release/tests
          cp scripts/telegram-live-acceptance.mjs release/scripts/
          cp scripts/check-location-pdf-chromium.mjs release/scripts/
          cp scripts/verify-location-report-pdf-production.mjs release/scripts/
          cp tests/telegram-live-cases.ru.json release/tests/
          cp tests/location-report-production-cases.json release/tests/
          if [ -d public ]; then cp -R public release/; fi
          cp -R .next release/
          cp -a node_modules release/

          node - <<'NODE'
          const fs = require('fs');
          const gitSha = process.env.GIT_SHA_EXACT;
          const meta = {
            gitSha,
            builtAt: new Date().toISOString(),
            workflowRunId: process.env.GITHUB_RUN_ID || null,
            github: {
              run_number: process.env.GITHUB_RUN_NUMBER || null,
              workflow: process.env.GITHUB_WORKFLOW || null,
              repository: process.env.GITHUB_REPOSITORY || null,
            },
            node: process.version,
          };
          fs.writeFileSync('release/release-meta.json', JSON.stringify(meta, null, 2) + '\n');
          NODE

          tar -czf "asi-release-${SHA}.tgz" -C release .
          echo "sha=${SHA}" >> "$GITHUB_ENV"
          echo "artifact_file=asi-release-${SHA}.tgz" >> "$GITHUB_ENV"
        env:
          GIT_SHA_EXACT: ${{ github.sha }}

      - name: Deploy current SHA to production
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" || -z "${VPS_SSH_KEY:-}" ]]; then
            echo "::error::Missing required VPS SSH secrets"
            exit 1
          fi

          REMOTE_USER="project_ayfaar"
          REMOTE_PORT="${VPS_PORT:-22}"
          REMOTE_TMP="/home/project_ayfaar/asi-deploy-tmp"
          SSH_KEY="$RUNNER_TEMP/asi_vps_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          SSH_OPTS=(
            -i "$SSH_KEY"
            -p "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )
          SCP_OPTS=(
            -i "$SSH_KEY"
            -P "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "mkdir -p '${REMOTE_TMP}' && chmod 700 '${REMOTE_TMP}'"
          scp "${SCP_OPTS[@]}" scripts/deploy-artifact.sh "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/asi-deploy-artifact.sh"
          scp "${SCP_OPTS[@]}" "$artifact_file" "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/${artifact_file}"
          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" \
            "bash -lc 'set -euo pipefail
              chmod +x ${REMOTE_TMP}/asi-deploy-artifact.sh || true
              ASI_BASE_DIR=\"/var/www/asi\" bash ${REMOTE_TMP}/asi-deploy-artifact.sh \"${sha}\" \"${REMOTE_TMP}/${artifact_file}\"
              rm -f ${REMOTE_TMP}/asi-deploy-artifact.sh \"${REMOTE_TMP}/${artifact_file}\"
              curl -fsS http://127.0.0.1:3000/api/version
            '"

      - name: Sync secret into production runtime env
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${INTERNAL_TEST_SECRET:-}" ]]; then
            echo "::error::Missing required GitHub secret INTERNAL_TEST_SECRET"
            exit 1
          fi
          if [[ -z "${VPS_HOST:-}" || -z "${VPS_SSH_KEY:-}" ]]; then
            echo "::error::Missing required VPS SSH secrets"
            exit 1
          fi
          if [[ ! "$INTERNAL_TEST_SECRET" =~ ^[A-Za-z0-9._~:/+=@-]+$ ]]; then
            echo "::error::INTERNAL_TEST_SECRET contains unsupported characters for the current production env parser"
            exit 1
          fi

          REMOTE_USER="project_ayfaar"
          REMOTE_PORT="${VPS_PORT:-22}"
          REMOTE_TMP="/home/project_ayfaar/asi-deploy-tmp"
          SSH_KEY="$RUNNER_TEMP/asi_vps_key"
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"
          SSH_OPTS=(
            -i "$SSH_KEY"
            -p "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o ConnectTimeout=20
          )

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "mkdir -p '$REMOTE_TMP' && chmod 700 '$REMOTE_TMP'"
          printf '%s' "$INTERNAL_TEST_SECRET" | ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "umask 077 && cat > '$REMOTE_TMP/internal-test-secret.value'"

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          export PM2_HOME=/home/project_ayfaar/.pm2
          SECRET_FILE=/home/project_ayfaar/asi-deploy-tmp/internal-test-secret.value
          ENV_FILE=/var/www/asi/shared/.env.production.live
          CURRENT_ENV=/var/www/asi/current/.env.production.live

          python3 - <<'PY'
          from pathlib import Path
          import re

          secret_path = Path('/home/project_ayfaar/asi-deploy-tmp/internal-test-secret.value')
          env_path = Path('/var/www/asi/shared/.env.production.live')
          secret = secret_path.read_text(encoding='utf-8')
          if not secret or not re.fullmatch(r'[A-Za-z0-9._~:/+=@-]+', secret):
              raise SystemExit('invalid secret format')
          lines = env_path.read_text(encoding='utf-8').splitlines() if env_path.exists() else []
          changed = False
          found = False
          out = []
          for line in lines:
              if line.startswith('INTERNAL_TEST_SECRET='):
                  found = True
                  new_line = 'INTERNAL_TEST_SECRET=' + secret
                  changed = changed or (line != new_line)
                  out.append(new_line)
              else:
                  out.append(line)
          if not found:
              changed = True
              out.append('INTERNAL_TEST_SECRET=' + secret)
          if changed:
              backup = env_path.with_name(env_path.name + '.bak.internal-test-secret')
              if env_path.exists():
                  backup.write_text(env_path.read_text(encoding='utf-8'), encoding='utf-8')
              env_path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('env_file=' + ('changed' if changed else 'already_current'))
          print('internal_test_secret_file=present')
          PY

          ln -sfn "$ENV_FILE" "$CURRENT_ENV"
          rm -f "$SECRET_FILE"

          set -a
          . "$ENV_FILE"
          set +a
          pm2 restart asi-landing --update-env
          pm2 save || true
          pm2 env 0 | grep -q '^INTERNAL_TEST_SECRET:' && echo 'pm2_has_internal_test_secret=yes' || { echo 'pm2_has_internal_test_secret=no'; exit 1; }
          curl -fsS http://127.0.0.1:3000/api/version >/dev/null
          REMOTE

      - name: Run HTTP acceptance against production
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/guest-concierge-http-acceptance.mjs
          node scripts/guest-concierge-http-acceptance.mjs
