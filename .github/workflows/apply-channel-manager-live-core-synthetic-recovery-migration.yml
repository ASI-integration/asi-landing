name: Apply Channel Manager Live Core Synthetic Recovery v1 Migration

on:
  workflow_dispatch:
    inputs:
      confirm_production_migration:
        description: Type APPLY_20260805120000_RECOVERY_V1_TO_PRODUCTION to run this exact production DDL
        required: true
        type: string

concurrency:
  group: production-migration-channel-manager-live-core-synthetic-recovery-v1
  cancel-in-progress: false

permissions:
  contents: read

env:
  AUTHORIZED_REPOSITORY: ASI-integration/asi-landing
  AUTHORIZED_SHA: 6b9f022e423e1032f66286b9348160c4dd59f45c
  AUTHORIZED_PRE_MIGRATION_SHA: f5c7b91d7a6af87a07043673403aa44c56cf348a
  AUTHORIZED_MIGRATION: supabase/migrations/20260805120000_channel_manager_live_core_synthetic_recovery_v1.sql
  AUTHORIZED_MIGRATION_SHA256: b87133906dea94b148b4778cd15006be9acec1e4cd995512ca975b12d8c69868
  AUTHORIZED_MIGRATION_BLOB: f56db2124b2e91782fcf05be7fb37b51998808b3
  EXPECTED_SUPABASE_PROJECT_REF: jwinifeienvzejofmbua

jobs:
  exact_artifact_preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require exact production migration confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm_production_migration }}" != "APPLY_20260805120000_RECOVERY_V1_TO_PRODUCTION" ]]; then
            echo "Set confirm_production_migration to APPLY_20260805120000_RECOVERY_V1_TO_PRODUCTION."
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "$AUTHORIZED_REPOSITORY" ]]; then
            echo "Unexpected repository: $GITHUB_REPOSITORY"
            exit 1
          fi

      - name: Checkout the authorized source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 6b9f022e423e1032f66286b9348160c4dd59f45c

      - name: Verify exact commit and migration bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"
          test "$(git hash-object "$AUTHORIZED_MIGRATION")" = "$AUTHORIZED_MIGRATION_BLOB"
          ACTUAL_SHA256="$(
            git cat-file blob "${AUTHORIZED_SHA}:${AUTHORIZED_MIGRATION}" | sha256sum | awk '{print $1}'
          )"
          test "$ACTUAL_SHA256" = "$AUTHORIZED_MIGRATION_SHA256"
          test -z "$(git status --porcelain)"

      - name: Verify current public production release
        shell: bash
        run: |
          set -euo pipefail
          VERSION_JSON="$(curl --fail --silent --show-error --max-time 20 https://asi-global.ru/api/version)"
          VERSION_JSON="$VERSION_JSON" node <<'NODE'
          const value = JSON.parse(process.env.VERSION_JSON || '{}');
          const expected = process.env.AUTHORIZED_PRE_MIGRATION_SHA;
          if (value.environment !== 'production' || value.sha !== expected) {
            throw new Error(`Production release mismatch: expected ${expected}, received ${String(value.sha || 'unknown')}`);
          }
          console.log(`production_release_verified=${value.sha}`);
          NODE

  apply_exact_migration:
    runs-on: ubuntu-latest
    needs: [exact_artifact_preflight]
    environment: production
    steps:
      - name: Checkout the authorized source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: 6b9f022e423e1032f66286b9348160c4dd59f45c

      - name: Reverify exact commit and migration bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$AUTHORIZED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$AUTHORIZED_SHA"
          test "$(git hash-object "$AUTHORIZED_MIGRATION")" = "$AUTHORIZED_MIGRATION_BLOB"
          ACTUAL_SHA256="$(
            git cat-file blob "${AUTHORIZED_SHA}:${AUTHORIZED_MIGRATION}" | sha256sum | awk '{print $1}'
          )"
          test "$ACTUAL_SHA256" = "$AUTHORIZED_MIGRATION_SHA256"

      - name: Require GitHub production SUPABASE_DB_URL and verify project identity
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ env.EXPECTED_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::SUPABASE_DB_URL secret is missing."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_DB_URL}"

          # Identity only: never print URL, password, or userinfo.
          SUPABASE_DB_URL="$SUPABASE_DB_URL" EXPECTED_SUPABASE_PROJECT_REF="$EXPECTED_SUPABASE_PROJECT_REF" python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          raw = os.environ.get("SUPABASE_DB_URL", "")
          expected = (os.environ.get("EXPECTED_SUPABASE_PROJECT_REF") or "").strip().lower()

          if not raw or not raw.strip():
              raise SystemExit("SUPABASE_DB_URL secret is missing.")

          normalized = raw.strip()
          if len(normalized) >= 2 and normalized[0] in ("'", '"', "`") and normalized[-1] == normalized[0]:
              normalized = normalized[1:-1].strip()
          if not normalized or ("\r" in normalized) or ("\n" in normalized):
              raise SystemExit("SUPABASE_DB_URL is invalid.")

          parsed = urlparse(normalized)
          scheme_ok = parsed.scheme in ("postgres", "postgresql")
          hostname = (parsed.hostname or "").lower()
          username = unquote(parsed.username or "").lower()
          host_has_ref = bool(expected) and expected in hostname
          user_has_ref = bool(expected) and expected in username

          print(f"secret_present=true")
          print(f"scheme_is_postgres={str(scheme_ok).lower()}")
          print(f"hostname_has_expected_ref={str(host_has_ref).lower()}")
          print(f"username_has_expected_ref={str(user_has_ref).lower()}")
          print(f"expected_project_ref={expected}")

          if not scheme_ok:
              raise SystemExit("SUPABASE_DB_URL must be a postgres/postgresql URL.")
          if not host_has_ref and not user_has_ref:
              raise SystemExit("SUPABASE_DB_URL project identity mismatch.")
          print("production_supabase_db_identity_verified=yes")
          PY

      - name: Reverify public production runtime identity before SQL
        shell: bash
        run: |
          set -euo pipefail
          VERSION_JSON="$(curl --fail --silent --show-error --max-time 20 https://asi-global.ru/api/version)"
          VERSION_JSON="$VERSION_JSON" node <<'NODE'
          const value = JSON.parse(process.env.VERSION_JSON || '{}');
          const expected = process.env.AUTHORIZED_PRE_MIGRATION_SHA;
          if (value.environment !== 'production' || value.sha !== expected) {
            throw new Error(`Production release mismatch before SQL: expected ${expected}, received ${String(value.sha || 'unknown')}`);
          }
          console.log(`pre_sql_production_runtime_verified=${value.sha}`);
          NODE

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-client

      - name: Apply only the authorized migration via GitHub production SUPABASE_DB_URL
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED_SUPABASE_PROJECT_REF: ${{ env.EXPECTED_SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "::error::SUPABASE_DB_URL secret is missing."
            exit 1
          fi
          echo "::add-mask::${SUPABASE_DB_URL}"

          # Fail closed again immediately before SQL (no VPS process-env or shared-env DB credential fallback).
          SUPABASE_DB_URL="$SUPABASE_DB_URL" EXPECTED_SUPABASE_PROJECT_REF="$EXPECTED_SUPABASE_PROJECT_REF" python3 - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          raw = os.environ.get("SUPABASE_DB_URL", "")
          expected = (os.environ.get("EXPECTED_SUPABASE_PROJECT_REF") or "").strip().lower()
          if not raw or not raw.strip():
              raise SystemExit("SUPABASE_DB_URL secret is missing.")
          normalized = raw.strip()
          if len(normalized) >= 2 and normalized[0] in ("'", '"', "`") and normalized[-1] == normalized[0]:
              normalized = normalized[1:-1].strip()
          parsed = urlparse(normalized)
          hostname = (parsed.hostname or "").lower()
          username = unquote(parsed.username or "").lower()
          if parsed.scheme not in ("postgres", "postgresql"):
              raise SystemExit("SUPABASE_DB_URL must be a postgres/postgresql URL.")
          if expected not in hostname and expected not in username:
              raise SystemExit("SUPABASE_DB_URL project identity mismatch.")
          print("pre_sql_identity_reverified=yes")
          PY

          VERIFY_BLOCK="DO \$verify\$
          DECLARE
            v_signature text;
            v_oid regprocedure;
          BEGIN
            FOREACH v_signature IN ARRAY ARRAY[
              'public.channel_manager_live_core_recovery_expected_fk_edges()',
              'public.channel_manager_live_core_booking_ops_fk_children(uuid)',
              'public.channel_manager_live_core_synthetic_recovery_cleanup(text,boolean,uuid,text,text,text,jsonb,uuid,uuid,uuid,uuid[])'
            ] LOOP
              v_oid := to_regprocedure(v_signature);
              IF v_oid IS NULL THEN
                RAISE EXCEPTION 'missing recovery function: %', v_signature;
              END IF;
              IF NOT EXISTS (
                SELECT 1 FROM pg_proc
                WHERE oid = v_oid
                  AND prosecdef
                  AND coalesce(proconfig @> ARRAY['search_path=public'], false)
              ) THEN
                RAISE EXCEPTION 'unsafe recovery function configuration: %', v_signature;
              END IF;
              IF NOT has_function_privilege('service_role', v_oid, 'EXECUTE')
                 OR has_function_privilege('anon', v_oid, 'EXECUTE')
                 OR has_function_privilege('authenticated', v_oid, 'EXECUTE') THEN
                RAISE EXCEPTION 'unsafe recovery function grants: %', v_signature;
              END IF;
            END LOOP;
          END
          \$verify\$;"

          psql -X "$SUPABASE_DB_URL" --set ON_ERROR_STOP=1 --single-transaction \
            --file "$AUTHORIZED_MIGRATION" \
            --command "NOTIFY pgrst, 'reload schema';" \
            --command "$VERIFY_BLOCK"

          echo "MIGRATION_STATUS=applied_and_verified"

      - name: Confirm production runtime unchanged after migration
        shell: bash
        run: |
          set -euo pipefail
          VERSION_JSON="$(curl --fail --silent --show-error --max-time 20 https://asi-global.ru/api/version)"
          VERSION_JSON="$VERSION_JSON" node <<'NODE'
          const value = JSON.parse(process.env.VERSION_JSON || '{}');
          const expected = process.env.AUTHORIZED_PRE_MIGRATION_SHA;
          if (value.environment !== 'production' || value.sha !== expected) {
            throw new Error(`Production runtime changed during migration: expected ${expected}, received ${String(value.sha || 'unknown')}`);
          }
          console.log('post_migration_runtime_unchanged=yes');
          NODE
