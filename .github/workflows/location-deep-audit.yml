name: Location deep audit offline
on:
  pull_request:
    paths:
      - 'src/lib/location/**'
      - 'docs/location/evidence/**'
      - 'docs/location/independent-benchmark/**'
      - 'scripts/acceptance/independent-geo-benchmark.cjs'
      - 'scripts/acceptance/geo-source-acquisition.cjs'
      - 'src/app/api/location*/**'
      - 'scripts/acceptance/location-audit-offline.cjs'
      - '.github/workflows/location-deep-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: location-deep-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  offline:
    if: github.repository == 'ASI-integration/asi-landing' && (github.event_name == 'workflow_dispatch' || ((github.event.pull_request.head.ref == 'asi/location-deep-audit-20261015' || github.event.pull_request.head.ref == 'asi/location-calibration-finishline-20261015' || github.event.pull_request.head.ref == 'asi/location-realworld-20261015' || github.event.pull_request.head.ref == 'asi/location-independent-geo-20261015') && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [regression, calibration]
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      REVIEWED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Owner gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = ASI-integration
          test "$GITHUB_ACTOR_ID" = 207600140
          test "$GITHUB_TRIGGERING_ACTOR" = ASI-integration
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$REVIEWED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Exact source receipt
        run: |
          mkdir -p audit-results
          test "$(git rev-parse HEAD)" = "$REVIEWED_SOURCE_SHA"
          node -e 'require("fs").writeFileSync("audit-results/source.json",JSON.stringify({head:process.env.REVIEWED_SOURCE_SHA,run:process.env.GITHUB_RUN_ID,suite:"${{ matrix.suite }}",syntheticOnly:true,productionTouched:false}))'
      - name: Independent geographic evidence integrity (not release acceptance)
        if: matrix.suite == 'regression'
        run: node scripts/acceptance/independent-geo-benchmark.cjs > audit-results/independent-geography.json
      - name: Regression and security integration
        if: matrix.suite == 'regression'
        env:
          NODE_OPTIONS: --require=./scripts/acceptance/location-audit-offline.cjs
        run: node node_modules/vitest/vitest.mjs run src/lib/location src/app/api/location-demo-analyze src/app/api/location-analyze src/app/api/location-report src/app/api/location-full-report --exclude=src/lib/location/tests/ru-residential-calibration-matrix.test.ts --maxWorkers=2 --reporter=json --outputFile=audit-results/tests.json
      - name: Historical calibration acceptance (known baseline failures stay visible)
        if: matrix.suite == 'calibration'
        env:
          NODE_OPTIONS: --require=./scripts/acceptance/location-audit-offline.cjs
        run: node node_modules/vitest/vitest.mjs run src/lib/location/tests/ru-residential-calibration-matrix.test.ts --maxWorkers=2 --reporter=json --outputFile=audit-results/tests.json
      - name: Typecheck
        if: matrix.suite == 'regression'
        run: npm run typecheck
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: location-audit-${{ matrix.suite }}-${{ github.run_id }}
          path: audit-results/*
          retention-days: 7
          if-no-files-found: error
