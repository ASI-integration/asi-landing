name: Communication Production Completion v1

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Readiness only, activate production flags, or run live acceptance
        required: true
        default: readiness
        type: choice
        options:
          - readiness
          - activate
          - acceptance
      safety_acknowledgement:
        description: Technical safety acknowledgement (owner approval remains separate)
        required: true
        default: not_authorized
        type: choice
        options:
          - not_authorized
          - authorized_for_selected_mode
      telegram_test_chat_id:
        description: Dedicated test chat integer only, e.g. 931919812 or -1001234567890 (never owner chat unless intended)
        required: false
        type: string
      stt_file_id:
        description: Optional Telegram voice file_id override for diagnostics; normal acceptance discovers a fresh configured test-chat voice automatically
        required: false
        type: string

permissions:
  contents: read

jobs:
  production_completion:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require production safety acknowledgement
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          SAFETY_ACKNOWLEDGEMENT: ${{ inputs.safety_acknowledgement }}
        run: |
          set -euo pipefail
          case "$MODE" in
            readiness|activate|acceptance) ;;
            *) echo "::error::Unsupported mode: $MODE"; exit 1 ;;
          esac
          if [[ "$SAFETY_ACKNOWLEDGEMENT" != "authorized_for_selected_mode" ]]; then
            echo "::error::Select authorized_for_selected_mode after obtaining owner approval for mode=$MODE"
            exit 1
          fi

      - name: Checkout exact scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run controlled production completion step
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          MODE: ${{ inputs.mode }}
          INPUT_TEST_CHAT_ID: ${{ inputs.telegram_test_chat_id }}
          INPUT_STT_FILE_ID: ${{ inputs.stt_file_id }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "acceptance" || -n "${INPUT_TEST_CHAT_ID:-}" ]]; then
            INPUT_TEST_CHAT_ID="$(node scripts/telegram-test-chat-id.mjs "$INPUT_TEST_CHAT_ID")"
          fi
          if [[ -z "${VPS_HOST:-}" || -z "${VPS_SSH_KEY:-}" ]]; then
            echo "::error::Missing production SSH secrets"
            exit 1
          fi

          REMOTE_USER="project_ayfaar"
          REMOTE_PORT="${VPS_PORT:-22}"
          REMOTE_TMP="/home/project_ayfaar/asi-communication-completion-v1"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          SSH_KEY=~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          SSH_OPTS=(
            -i "$SSH_KEY"
            -p "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ConnectTimeout=20
          )
          SCP_OPTS=(
            -i "$SSH_KEY"
            -P "$REMOTE_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o LogLevel=ERROR
            -o ConnectTimeout=20
          )

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "mkdir -p '${REMOTE_TMP}'"
          scp "${SCP_OPTS[@]}" \
            scripts/communication-production-readiness-v1.mjs \
            scripts/communication-voice-live-probe-v1.mjs \
            scripts/telegram-autopilot-live-acceptance.mjs \
            scripts/telegram-autopilot-reservation.mjs \
            scripts/telegram-test-chat-id.mjs \
            scripts/telegram-voice-acceptance-input.mjs \
            scripts/telegram-voice-stt-dry-run.mjs \
            "${REMOTE_USER}@${VPS_HOST}:${REMOTE_TMP}/"

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" \
            "MODE='${MODE}' INPUT_TEST_CHAT_ID='${INPUT_TEST_CHAT_ID}' INPUT_STT_FILE_ID='${INPUT_STT_FILE_ID}' REMOTE_TMP='${REMOTE_TMP}' bash -s" <<'REMOTE'
          set -euo pipefail
          APP_DIR="/var/www/asi/current"
          ENV_FILE="/var/www/asi/shared/.env.production.live"
          PM2_APP="asi-landing"
          trap 'rm -rf "${REMOTE_TMP}"' EXIT

          if [[ ! -f "$ENV_FILE" ]]; then
            echo "::error::Missing $ENV_FILE"
            exit 1
          fi

          load_env() {
            set -a
            # shellcheck disable=SC1090
            source "$ENV_FILE"
            set +a
            if [[ -n "${INPUT_TEST_CHAT_ID:-}" ]]; then
              export TELEGRAM_TEST_CHAT_ID="$INPUT_TEST_CHAT_ID"
              export TELEGRAM_AUTOPILOT_TEST_CHAT_ID="$INPUT_TEST_CHAT_ID"
              export COMM_VOICE_PROBE_CHAT_ID="$INPUT_TEST_CHAT_ID"
            fi
          }

          restart_with_current_env() {
            load_env
            pm2 restart "$PM2_APP" --update-env
            pm2 save
          }

          run_acceptance_stage() {
            local stage="$1"
            shift
            echo "::group::communication_acceptance stage=${stage}"
            if "$@"; then
              echo "communication_acceptance stage=${stage} result=PASS"
              echo "::endgroup::"
              return 0
            else
              local status=$?
              echo "::endgroup::"
              echo "::error::Communication production acceptance failed at stage=${stage} exit=${status}"
              return "$status"
            fi
          }

          echo "=== production version before ==="
          curl -fsS http://127.0.0.1:3000/api/version
          echo
          curl -fsS http://127.0.0.1:3000/api/health
          echo

          load_env

          case "$MODE" in
            readiness)
              echo "=== communication readiness ==="
              node "$REMOTE_TMP/communication-production-readiness-v1.mjs" --probe-network
              ;;

            activate)
              echo "=== pre-activation prerequisites ==="
              node "$REMOTE_TMP/communication-production-readiness-v1.mjs" --require-prereqs --probe-network

              BACKUP_FILE="${ENV_FILE}.bak.communication-v1.$(date -u +%Y%m%dT%H%M%SZ)"
              cp "$ENV_FILE" "$BACKUP_FILE"
              echo "Created timestamped communication env backup."

              ENV_FILE="$ENV_FILE" python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path(os.environ['ENV_FILE'])
          text = path.read_text(encoding='utf-8')
          values = {
              'LLM_SAFE_DOMAIN_ENABLED': '1',
              'VOICE_REPLY_ENABLED': '1',
              'VOICE_TRANSCRIPTION_DISABLED': '0',
              'DRY_RUN_TELEGRAM_OUTBOUND': '0',
              'TELEGRAM_DRY_RUN': '0',
              'COMMUNICATION_KILL_SWITCH': '0',
              'COMMUNICATION_AUTOPILOT_FORCE_DISABLED': '0',
          }
          for key, value in values.items():
              pattern = re.compile(rf'(?m)^\s*{re.escape(key)}\s*=.*$')
              replacement = f'{key}={value}'
              if pattern.search(text):
                  text = pattern.sub(replacement, text)
              else:
                  if text and not text.endswith('\n'):
                      text += '\n'
                  text += replacement + '\n'
          path.write_text(text, encoding='utf-8')
          PY

              echo "=== activate and verify ==="
              if ! (
                restart_with_current_env
                sleep 4
                curl -fsS http://127.0.0.1:3000/api/health
                echo
                node "$REMOTE_TMP/communication-production-readiness-v1.mjs" --require-active --probe-network
              ); then
                echo "::error::Communication activation verification failed; restoring previous production env."
                cp "$BACKUP_FILE" "$ENV_FILE"
                restart_with_current_env
                sleep 3
                curl -fsS http://127.0.0.1:3000/api/health || true
                echo
                echo "Previous production env restored."
                exit 1
              fi
              echo "Communication activation verified; rollback backup preserved at a timestamped path."
              ;;

            acceptance)
              run_acceptance_stage active_state \
                node "$REMOTE_TMP/communication-production-readiness-v1.mjs" --require-active --probe-network

              if [[ -z "${TELEGRAM_TEST_CHAT_ID:-}" ]]; then
                echo "::error::Communication production acceptance failed at stage=test_chat_configuration: dedicated TELEGRAM_TEST_CHAT_ID or telegram_test_chat_id input is required"
                exit 1
              fi

              cd "$APP_DIR"
              run_acceptance_stage text_autopilot \
                env ACCEPTANCE_BASE_URL="https://asi-global.ru" node "$REMOTE_TMP/telegram-autopilot-live-acceptance.mjs"

              run_acceptance_stage outbound_tts_and_send_voice \
                node "$REMOTE_TMP/communication-voice-live-probe-v1.mjs"

              if ! FILE_ID="$(
                node "$REMOTE_TMP/telegram-voice-acceptance-input.mjs" \
                  --explicit-file-id "${INPUT_STT_FILE_ID:-}" \
                  --test-chat-id "$TELEGRAM_TEST_CHAT_ID" \
                  --max-age-seconds 1200
              )"; then
                exit 1
              fi
              run_acceptance_stage inbound_stt \
                node "$REMOTE_TMP/telegram-voice-stt-dry-run.mjs" --file-id "$FILE_ID"
              ;;
          esac

          echo "=== production version after ==="
          curl -fsS http://127.0.0.1:3000/api/version
          echo
          curl -fsS http://127.0.0.1:3000/api/health
          echo
          REMOTE
