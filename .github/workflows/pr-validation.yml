name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Initial Sync Recovery rollout artifact regression
        id: rollout_artifact_regression
        run: |
          set -euo pipefail
          npx vitest run \
            src/lib/asi-runtime/__tests__/initial-sync-recovery-rollout-artifacts.test.ts \
            --reporter=verbose 2>&1 | tee rollout-artifact-regression.out
          if grep -E '↓|skipped|SKIPPED' rollout-artifact-regression.out | grep -Fq 'Initial Sync Recovery v1 production rollout artifacts'; then
            echo "Rollout artifact regression suite was skipped — failing job"
            exit 1
          fi
          if ! grep -Fq 'ASI_ROLLOUT_ARTIFACT_PROOF' rollout-artifact-regression.out; then
            echo "Missing ASI_ROLLOUT_ARTIFACT_PROOF output — failing job"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const out = fs.readFileSync('rollout-artifact-regression.out', 'utf8');
          const line = out.split(/\r?\n/).find((entry) => entry.includes('ASI_ROLLOUT_ARTIFACT_PROOF'));
          if (!line) {
            console.error('proof_line_missing');
            process.exit(1);
          }
          const json = line.slice(line.indexOf('ASI_ROLLOUT_ARTIFACT_PROOF') + 'ASI_ROLLOUT_ARTIFACT_PROOF'.length).trim();
          const proof = JSON.parse(json);
          const expected = {
            migrationBlobSha1: 'f56db2124b2e91782fcf05be7fb37b51998808b3',
            migrationBlobSize: 36467,
            migrationSha256: 'b87133906dea94b148b4778cd15006be9acec1e4cd995512ca975b12d8c69868',
            workflowPinMatches: true,
            sourceSha: '6b9f022e423e1032f66286b9348160c4dd59f45c',
            migrationPath: 'supabase/migrations/20260805120000_channel_manager_live_core_synthetic_recovery_v1.sql',
            retiredHashAbsentFromActiveAuthorization: true,
            deployGateMissing: true,
            deployGateUnapproved: true,
          };
          if (JSON.stringify(proof) !== JSON.stringify(expected)) {
            console.error('proof_mismatch', proof);
            process.exit(1);
          }
          console.log('rollout_artifact_proof_ok', JSON.stringify(proof));
          NODE

      - name: Initial Sync Recovery production env diagnostic workflow regression
        id: env_diag_workflow_regression
        run: |
          set -euo pipefail
          npx vitest run \
            src/lib/asi-runtime/__tests__/diagnose-initial-sync-recovery-production-env-workflow.test.ts \
            --reporter=verbose 2>&1 | tee env-diag-workflow-regression.out
          if grep -E '↓|skipped|SKIPPED' env-diag-workflow-regression.out | grep -Fq 'diagnose initial sync recovery production env workflow'; then
            echo "Env diagnostic workflow regression suite was skipped — failing job"
            exit 1
          fi

      - name: Tests (Booking Ops focused regression coverage)
        run: |
          npx vitest run \
            src/lib/booking-ops/__tests__/booking-automation-rollout.test.ts \
            src/app/api/dashboard/booking-ops/alerts/orchestrate/__tests__/route.test.ts \
            src/lib/booking-ops/__tests__/ops-alert-engine.test.ts \
            src/app/api/internal/booking-ops/alerts/run/__tests__/route.test.ts \
            src/lib/booking-ops/__tests__/golden-path-acceptance.test.ts \
            src/lib/booking-ops/__tests__/lifecycle.test.ts \
            src/lib/booking-ops/__tests__/lifecycle-orchestrator.test.ts \
            src/lib/booking-ops/__tests__/lifecycle-entry-adapter.test.ts \
            src/lib/booking-ops/__tests__/lifecycle-autopilot.test.ts \
            src/app/api/dashboard/booking-ops/lifecycle-orchestrator/__tests__/route.test.ts \
            src/lib/reservations/__tests__/visibility-hotfix.test.ts

      - name: Syntax check ops-alert-scheduler.mjs
        run: node --check scripts/ops-alert-scheduler.mjs

      - name: Syntax check deploy-artifact.sh
        run: bash -n scripts/deploy-artifact.sh

      - name: Syntax check rollback-artifact.sh
        run: bash -n scripts/rollback-artifact.sh

      - name: Syntax check pm2-sync-ops-alert-scheduler.sh
        run: bash -n scripts/pm2-sync-ops-alert-scheduler.sh

      - name: Syntax check ci-artifact-smoke.sh
        run: bash -n scripts/ci-artifact-smoke.sh

      - name: Channel Manager Incremental Sync unit regression
        run: |
          set -euo pipefail
          npx vitest run \
            src/lib/booking-ops/__tests__/channel-manager-live-incremental-sync.test.ts \
            src/app/api/dashboard/channel-manager/import-runs/__tests__/incremental-sync-route.test.ts \
            --reporter=verbose 2>&1 | tee incremental-sync-unit.out
          if grep -E '↓|skipped|SKIPPED' incremental-sync-unit.out | grep -Eiq 'incremental'; then
            echo "Incremental Sync unit suite was skipped — failing job"
            exit 1
          fi

      - name: Channel Manager Live Core regression
        run: |
          set -euo pipefail
          npx vitest run \
            src/lib/booking-ops/__tests__/channel-manager-live-core.test.ts \
            --reporter=verbose 2>&1 | tee live-core-unit.out
          if grep -E '↓|skipped|SKIPPED' live-core-unit.out | grep -Eiq 'Live Core|channel-manager-live-core'; then
            echo "Live Core suite was skipped — failing job"
            exit 1
          fi

      - name: Channel Manager recovery workflow YAML syntax validation
        run: |
          python3 - <<'PY'
          import subprocess, sys
          try:
            import yaml
          except ImportError:
            subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML'])
            import yaml
          from pathlib import Path
          path = Path('.github/workflows/apply-channel-manager-live-core-synthetic-recovery-migration.yml')
          doc = yaml.safe_load(path.read_text(encoding='utf-8'))
          assert doc is not None
          on = doc.get(True) or doc.get('on')  # YAML may parse 'on' as True
          assert on is not None
          assert 'workflow_dispatch' in on
          assert 'push' not in on
          assert 'pull_request' not in on
          # production environment remains owner-gated — check jobs use environment: production
          jobs = doc['jobs']
          assert any(
            (job.get('environment') == 'production' or (isinstance(job.get('environment'), dict) and job['environment'].get('name') == 'production'))
            for job in jobs.values()
          )
          print('recovery_workflow_yaml_ok')
          PY

      - name: Build
        run: npm run build

      - name: Prune devDependencies for runtime bundle
        run: npm prune --omit=dev

      - name: Resolve artifact metadata
        id: build_meta
        shell: bash
        run: |
          set -euo pipefail
          FULL="$(git rev-parse HEAD)"
          echo "sha=${FULL}" >> "$GITHUB_OUTPUT"
          echo "artifact_file=asi-release-${FULL}.tgz" >> "$GITHUB_OUTPUT"

      - name: Create release artifact (.tgz)
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ steps.build_meta.outputs.sha }}"

          rm -rf release
          mkdir -p release

          cp package.json package-lock.json next.config.js ecosystem.config.cjs release/
          mkdir -p release/scripts release/tests
          cp scripts/telegram-live-acceptance.mjs release/scripts/
          cp scripts/check-location-pdf-chromium.mjs release/scripts/
          cp scripts/verify-location-report-pdf-production.mjs release/scripts/
          cp scripts/communication-ops-live-acceptance.mjs release/scripts/
          cp scripts/communication-ops-live-acceptance.runner.ts release/scripts/
          cp scripts/telegram-ops-live-acceptance.mjs release/scripts/
          cp scripts/pilot-readiness-live-acceptance.mjs release/scripts/
          cp scripts/pilot-readiness-live-acceptance.runner.ts release/scripts/
          cp scripts/ops-sync.mjs release/scripts/
          cp scripts/ops-sync.runner.ts release/scripts/
          cp scripts/support-bot-live-acceptance.mjs release/scripts/
          cp scripts/support-bot-live-acceptance.runner.ts release/scripts/
          cp scripts/ops-alert-scheduler.mjs release/scripts/
          cp scripts/pm2-sync-ops-alert-scheduler.sh release/scripts/
          cp tsconfig.json release/
          cp -R src release/
          cp tests/telegram-live-cases.ru.json release/tests/
          cp tests/location-report-production-cases.json release/tests/
          if [ -d public ]; then cp -R public release/; fi
          cp -R .next release/
          cp -a node_modules release/

          node - <<'NODE'
          const fs = require('fs');
          const gitSha = (process.env.GIT_SHA_EXACT || '').trim();
          const meta = {
            gitSha,
            builtAt: new Date().toISOString(),
            workflowRunId: process.env.GITHUB_RUN_ID || null,
            github: {
              run_number: process.env.GITHUB_RUN_NUMBER || null,
              workflow: process.env.GITHUB_WORKFLOW || null,
              repository: process.env.GITHUB_REPOSITORY || null,
            },
            node: process.version,
          };
          fs.writeFileSync('release/release-meta.json', JSON.stringify(meta, null, 2) + '\n');
          NODE
        env:
          GIT_SHA_EXACT: ${{ steps.build_meta.outputs.sha }}

      - name: Tar release
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.build_meta.outputs.artifact_file }}"
          tar -czf "$OUT" -C release .

      - name: Verify scheduler files in artifact
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.build_meta.outputs.artifact_file }}"
          tar -tzf "$OUT" | grep -Fx './scripts/ops-alert-scheduler.mjs'
          tar -tzf "$OUT" | grep -Fx './scripts/pm2-sync-ops-alert-scheduler.sh'

      - name: Artifact smoke (isolated local port)
        shell: bash
        env:
          EXPECT_SHA: ${{ steps.build_meta.outputs.sha }}
        run: |
          set -euo pipefail
          OUT="${{ steps.build_meta.outputs.artifact_file }}"
          chmod +x scripts/ci-artifact-smoke.sh
          bash scripts/ci-artifact-smoke.sh "$OUT" 13077

      - name: Whitespace check (git diff --check)
        run: git diff --check

  channel-manager-recovery-postgres:
    name: channel-manager-recovery-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asi_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asi_recovery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ASI_DISPOSABLE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/asi_recovery_test
      ASI_REQUIRE_DISPOSABLE_PG: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify pg package is installed
        run: node -e "require('pg'); console.log('pg_ok')"

      - name: Wait for disposable PostgreSQL
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { Client } = require('pg');
          const url = process.env.ASI_DISPOSABLE_POSTGRES_URL;
          (async () => {
            let lastErr;
            for (let i = 0; i < 30; i += 1) {
              const client = new Client({ connectionString: url });
              try {
                await client.connect();
                const r = await client.query('select current_database() as db, current_user as usr');
                console.log('postgres_ready', r.rows[0]);
                await client.end();
                process.exit(0);
              } catch (err) {
                lastErr = err;
                try { await client.end(); } catch (_) {}
                await new Promise((r) => setTimeout(r, 2000));
              }
            }
            console.error('PostgreSQL was unreachable', lastErr);
            process.exit(1);
          })();
          NODE

      - name: Run Live Core recovery PostgreSQL RPC integration
        id: pg_integration
        run: |
          set -euo pipefail
          npx vitest run \
            src/lib/booking-ops/__tests__/channel-manager-live-core-recovery.pg.integration.test.ts \
            --reporter=verbose 2>&1 | tee pg-integration.out
          if grep -E '↓|skipped|SKIPPED' pg-integration.out | grep -Fq 'Live Core recovery PostgreSQL RPC integration'; then
            echo "Integration suite was skipped — failing job"
            exit 1
          fi
          if ! grep -Fq 'ASI_PG_INTEGRATION_PROOF' pg-integration.out; then
            echo "Missing ASI_PG_INTEGRATION_PROOF output — failing job"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const out = fs.readFileSync('pg-integration.out', 'utf8');
          const line = out.split(/\r?\n/).find((l) => l.includes('ASI_PG_INTEGRATION_PROOF'));
          if (!line) {
            console.error('proof_line_missing');
            process.exit(1);
          }
          const json = line.slice(line.indexOf('ASI_PG_INTEGRATION_PROOF') + 'ASI_PG_INTEGRATION_PROOF'.length).trim();
          const proof = JSON.parse(json);
          const expected = {
            hasDisposablePg: true,
            runtimeVerified: true,
            migrationApplied: true,
            fkDiscoveryPassed: true,
            dryRunPassed: true,
            injectedMidDeleteFailureStatus: 'failed',
            rowsRemainingAfterInjectedFailure: 67,
            committedDeletedTotal: 67,
            contourPreserved: { owners: 1, properties: 1, connections: 1, runs: 1 },
            finalTransactionRolledBack: true,
            productionTouched: false,
            stagingTouched: false,
          };
          if (JSON.stringify(proof) !== JSON.stringify(expected)) {
            console.error('proof_mismatch', proof);
            process.exit(1);
          }
          console.log('proof_ok', JSON.stringify(proof));
          NODE

      - name: Channel Manager Incremental Sync PostgreSQL integration
        id: incremental_pg_integration
        run: |
          set -euo pipefail
          npx vitest run \
            src/lib/booking-ops/__tests__/channel-manager-live-incremental-sync.pg.integration.test.ts \
            --reporter=verbose 2>&1 | tee incremental-pg-integration.out
          if grep -E '↓|skipped|SKIPPED' incremental-pg-integration.out | grep -Fq 'Live Incremental Sync PostgreSQL'; then
            echo "Incremental PG suite was skipped — failing job"
            exit 1
          fi
          if ! grep -Fq 'ASI_INCREMENTAL_PG_INTEGRATION_PROOF' incremental-pg-integration.out; then
            echo "Missing ASI_INCREMENTAL_PG_INTEGRATION_PROOF — failing job"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const out = fs.readFileSync('incremental-pg-integration.out', 'utf8');
          const line = out.split(/\r?\n/).find((l) => l.includes('ASI_INCREMENTAL_PG_INTEGRATION_PROOF'));
          if (!line) {
            console.error('proof_line_missing');
            process.exit(1);
          }
          const json = line.slice(line.indexOf('ASI_INCREMENTAL_PG_INTEGRATION_PROOF') + 'ASI_INCREMENTAL_PG_INTEGRATION_PROOF'.length).trim();
          const proof = JSON.parse(json);
          const expected = {
            hasDisposablePg: true,
            runtimeVerified: true,
            schemaVersion: 2,
            incrementalSyncTypeReady: true,
            atomicLiveSyncGuardReady: true,
            cursorStorageReady: true,
            atomicCommitRpcReady: true,
            replayFinalizeRpcReady: true,
            commitAndRunCompletedTogether: true,
            staleExpectedCursorRejected: true,
            previousCursorUnchangedOnReject: true,
            forcedFailureRolledBack: true,
            serviceRoleGrantOnly: true,
            finalTransactionRolledBack: true,
            productionTouched: false,
            stagingTouched: false,
          };
          if (JSON.stringify(proof) !== JSON.stringify(expected)) {
            console.error('proof_mismatch', proof);
            process.exit(1);
          }
          console.log('incremental_pg_proof_ok', JSON.stringify(proof));
          NODE
