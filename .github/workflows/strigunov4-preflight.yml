name: Strigunov4 recovery preflight
on:
  pull_request:
    paths:
      - 'scripts/strigunov4/**'
      - 'scripts/staging-booking-ops-schema-smoke.sh'
      - '.github/workflows/strigunov4-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact source
        run: git rev-parse HEAD
      - name: Focused offline safety checks
        run: |
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_preflight.py' -v
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_audit.py' -v
          bash -n scripts/staging-booking-ops-schema-smoke.sh
  catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ASI_CATALOG_SYNTHETIC: YES
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: synthetic
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: python3 scripts/strigunov4/test_catalog.py
