name: Booking Ops safe auto-send runner

on:
  workflow_dispatch:
    inputs:
      owner_gate_json:
        description: Approved asi.agent-os.owner-gate.v1 JSON (required; typed confirmation is not approval)
        required: true
        type: string
      dry_run:
        description: Run without provider calls
        required: true
        default: true
        type: boolean

concurrency:
  group: booking-ops-safe-auto-send
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production_owner_gate:
    uses: ./.github/workflows/production-owner-gate.yml
    with:
      requested_action: real_external_message_or_provider_call
      environment_identity: production
      owner_gate_json: ${{ inputs.owner_gate_json }}
  run-safe-batch:
    needs: [production_owner_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call protected runner
        env:
          RUNNER_SECRET: ${{ secrets.BOOKING_OPS_AUTO_SEND_RUNNER_SECRET }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_SECRET:-}"
          BODY='{}'
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_DRY_RUN" = "true" ]; then
            BODY='{"dryRun":true}'
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            -X POST 'https://asi-global.ru/api/internal/booking-ops/communications/auto-send/run' \
            -H "Authorization: Bearer ${RUNNER_SECRET}" \
            -H 'Content-Type: application/json' \
            --data "$BODY"
