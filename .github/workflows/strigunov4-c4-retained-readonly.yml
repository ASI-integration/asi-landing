name: Strigunov4 C4 retained run read-only reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/strigunov4-c4-retained-readonly.yml'
      - 'scripts/strigunov4/c4_retained_readonly.py'
      - 'scripts/strigunov4/c4_dependency_manifest.json'
      - 'scripts/strigunov4/c4_dependency_readonly.py'
      - 'scripts/strigunov4/c4_staging_readonly_probe.py'
      - 'scripts/strigunov4/protected_staging_g0_activation.py'
      - 'scripts/strigunov4/backup_export.py'
      - 'scripts/strigunov4/tls_guard.py'
      - 'scripts/strigunov4/preflight.py'
      - 'scripts/strigunov4/c4_retained_fixture.json'
      - 'scripts/strigunov4/test_c4_dependency_postgres.py'
      - 'scripts/strigunov4/test_c4_retained_readonly_postgres.py'
      - 'scripts/strigunov4/c4_incident_readonly.py'
      - 'scripts/strigunov4/protected_staging_sql_apply.py'
      - 'scripts/strigunov4/test_c4_retained_readonly.py'
      - 'docs/strigunov4/C4-RETAINED-READONLY.md'
      - 'scripts/strigunov4/*operator*.py'
      - 'docs/strigunov4/C4-OPERATOR-OBSERVER.md'
  workflow_dispatch:
    inputs:
      diagnostic_scope:
        description: Separate permission required for the fixed operator incident observer
        required: true
        type: choice
        default: retained
        options:
          - retained
          - operator-39145734946
      reviewed_main_sha:
        description: Exact reviewed current protected main SHA
        required: true
        type: string
      confirm:
        description: READONLY_C4_RETAINED_<SHA> or READONLY_C4_OPERATOR_<SHA> for selected scope
        required: true
        type: string
      incident_run:
        description: 39127850376 for retained or 39145734946 for operator observer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'strigunov4-staging-nine-sql-apply' || format('strigunov4-c4-retained-readonly-pr-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  offline_source_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Source-only security and JSON witness tests
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/strigunov4/c4_retained_readonly.py
          python3 -m unittest discover -s scripts/strigunov4 -p 'test_c4_retained_readonly.py' -v
          git diff --check

  isolated_retained_postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: c4_dependency
          POSTGRES_DB: c4_dependency
          POSTGRES_PASSWORD: isolated_fixture_only
        ports:
          - 127.0.0.1:55481:5432
        options: >-
          --health-cmd "pg_isready -U c4_dependency -d c4_dependency"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Actual isolated PostgreSQL dependency and rollback scenarios
        env:
          C4_DEPENDENCY_ISOLATED_PG: '1'
        run: python3 -m unittest discover -s scripts/strigunov4 -p 'test_c4_retained_readonly_postgres.py' -v

  protected_retained_readonly:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing' && inputs.diagnostic_scope == 'retained'
    needs: [offline_source_tests, isolated_retained_postgres]
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact owner, main source, current SHA and incident gate
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CONFIRM: ${{ inputs.confirm }}
          INCIDENT: ${{ inputs.incident_run }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ASI-integration/asi-landing"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "ASI-integration"
          test "$GITHUB_ACTOR_ID" = "207600140"
          test "$GITHUB_TRIGGERING_ACTOR" = "ASI-integration"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_WORKFLOW_REF" = 'ASI-integration/asi-landing/.github/workflows/strigunov4-c4-retained-readonly.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = "READONLY_C4_RETAINED_$GITHUB_SHA"
          test "$INCIDENT" = "39127850376"
          test "$(git ls-remote https://github.com/ASI-integration/asi-landing.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pinned PostgreSQL17 TLS verify-full read-only fixed retained roots and dependent tables inventory
        env:
          C4_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          C4_CONFIRM: ${{ inputs.confirm }}
          C4_INCIDENT_RUN: ${{ inputs.incident_run }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: python3 scripts/strigunov4/c4_retained_readonly.py

  protected_retained_host_readonly:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing' && inputs.diagnostic_scope == 'retained'
    needs: [offline_source_tests, isolated_retained_postgres]
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Exact owner, main source, current SHA and incident gate
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CONFIRM: ${{ inputs.confirm }}
          INCIDENT: ${{ inputs.incident_run }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ASI-integration/asi-landing"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "ASI-integration"
          test "$GITHUB_ACTOR_ID" = "207600140"
          test "$GITHUB_TRIGGERING_ACTOR" = "ASI-integration"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_WORKFLOW_REF" = 'ASI-integration/asi-landing/.github/workflows/strigunov4-c4-retained-readonly.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = "READONLY_C4_RETAINED_$GITHUB_SHA"
          test "$INCIDENT" = "39127850376"
          test "$(git ls-remote https://github.com/ASI-integration/asi-landing.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Existing read-only G0 host and fixed operator preflight
        env:
          C4_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          C4_CONFIRM: ${{ inputs.confirm }}
          C4_INCIDENT_RUN: ${{ inputs.incident_run }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: python3 scripts/strigunov4/c4_retained_readonly.py --host-only

  isolated_operator_observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fixed observer, admission, privacy and disposable file recovery tests
        run: |
          cd scripts/strigunov4
          python3 -B -m unittest test_c4_operator_patch test_c4_operator_host -v

  protected_operator_observer:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing' && inputs.diagnostic_scope == 'operator-39145734946'
    needs: [isolated_operator_observer]
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact owner, current main, distinct read permission and consumed incident
        shell: bash
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_main_sha }}
          CONFIRM: ${{ inputs.confirm }}
          INCIDENT: ${{ inputs.incident_run }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ASI-integration/asi-landing"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_ACTOR" = "ASI-integration"
          test "$GITHUB_ACTOR_ID" = "207600140"
          test "$GITHUB_TRIGGERING_ACTOR" = "ASI-integration"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_WORKFLOW_REF" = 'ASI-integration/asi-landing/.github/workflows/strigunov4-c4-retained-readonly.yml@refs/heads/main'
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$CONFIRM" = "READONLY_C4_OPERATOR_$GITHUB_SHA"
          test "$INCIDENT" = "39145734946"
          test "$(git ls-remote https://github.com/ASI-integration/asi-landing.git refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Observe fixed host preflight and existing incident markers without changes
        env:
          STAGING_REVIEWED_MAIN_SHA: ${{ inputs.reviewed_main_sha }}
          C4_OPERATOR_CONFIRM: ${{ inputs.confirm }}
          C4_OPERATOR_INCIDENT: ${{ inputs.incident_run }}
          C4_DIAGNOSTIC_SCOPE: ${{ inputs.diagnostic_scope }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: python3 -B scripts/strigunov4/protected_c4_operator_observer.py
