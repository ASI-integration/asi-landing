# TEMPORARY / diagnostic-only, adapted from diagnose-initial-sync-recovery-production-env.yml.
# That workflow assumes PM2; production is systemd-managed (asi-landing.service).
# Read-only: process env-key PRESENCE/NONEMPTY (never values) + sanitized journal window
# around the SIGNUP_FAILED incident. No mutation, no restart, no deploy, no migration.
name: Diagnose Production Signup (systemd, Read-Only)

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_diagnostic:
        description: Type DIAGNOSE_PRODUCTION_SIGNUP_SYSTEMD_READ_ONLY to run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-production-signup-systemd-readonly
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Validate owner gate phrase
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED="DIAGNOSE_PRODUCTION_SIGNUP_SYSTEMD_READ_ONLY"
          PROVIDED="${{ github.event.inputs.confirm_read_only_diagnostic }}"
          if [[ "$PROVIDED" != "$REQUIRED" ]]; then
            echo "::error::Confirmation phrase mismatch. Refusing to run diagnostics."
            exit 1
          fi

      - name: Start SSH agent with production key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
          log-public-key: false

      - name: Read-only systemd process, env-key presence, and journal window
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" ]]; then
            echo "::error::Missing VPS_HOST"
            exit 1
          fi
          if [[ -z "${SSH_AUTH_SOCK:-}" || ! -S "$SSH_AUTH_SOCK" ]]; then
            echo "::error::SSH agent socket is unavailable"
            exit 1
          fi
          if ! ssh-add -l >/dev/null 2>&1; then
            echo "::error::No SSH identity is loaded"
            exit 1
          fi

          REMOTE_USER="project_ayfaar"
          REMOTE_PORT="${VPS_PORT:-22}"

          SSH_OPTS=(
            -p "$REMOTE_PORT"
            -o "IdentityAgent=${SSH_AUTH_SOCK}"
            -o IdentitiesOnly=no
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
          )

          ssh "${SSH_OPTS[@]}" "${REMOTE_USER}@${VPS_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail

          REMOTE_USER="project_ayfaar"
          SERVICE="asi-landing.service"
          KEYS=(
            "SUPABASE_URL"
            "NEXT_PUBLIC_SUPABASE_URL"
            "SUPABASE_SERVICE_ROLE_KEY"
            "SESSION_SECRET"
            "HOST_VARIANT"
          )
          WINDOW_SINCE="2026-09-20T17:12:00Z"
          WINDOW_UNTIL="2026-09-20T17:22:00Z"

          echo "[section] systemd service identity"
          systemctl show "$SERVICE" -p ActiveState -p SubState -p MainPID -p FragmentPath -p WorkingDirectory -p EnvironmentFiles 2>&1 || true

          MAIN_PID="$(systemctl show "$SERVICE" -p MainPID --value 2>/dev/null || echo 0)"
          echo "[systemd] service=$SERVICE main_pid=$MAIN_PID"

          echo "[section] process env-key presence (values never printed)"
          if [[ "$MAIN_PID" != "0" && -r "/proc/$MAIN_PID/environ" ]]; then
            ENVIRON_KEYS="$(tr '\0' '\n' < "/proc/$MAIN_PID/environ" 2>/dev/null | sed -nE 's/^([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p')"
            for key in "${KEYS[@]}"; do
              line="$(tr '\0' '\n' < "/proc/$MAIN_PID/environ" 2>/dev/null | grep -E "^${key}=" || true)"
              if [[ -z "$line" ]]; then
                if printf '%s\n' "$ENVIRON_KEYS" | grep -qx "$key"; then
                  printf 'key=%s present=yes nonempty=unknown\n' "$key"
                else
                  printf 'key=%s present=no nonempty=no\n' "$key"
                fi
                continue
              fi
              value="${line#*=}"
              if [[ -n "$value" ]]; then
                printf 'key=%s present=yes nonempty=yes\n' "$key"
              else
                printf 'key=%s present=yes nonempty=no\n' "$key"
              fi
            done
          else
            echo "[proc-environ] MainPID environ not readable by ${REMOTE_USER}; presence check skipped (reporting fact, not bypassing permissions)"
          fi

          ENV_FILE="/var/www/asi/shared/.env.production.local"
          echo "[section] env file key presence (values never printed): ${ENV_FILE}"
          if [[ -r "$ENV_FILE" ]]; then
            for key in "${KEYS[@]}"; do
              line="$(grep -E "^[[:space:]]*${key}=" "$ENV_FILE" | tail -n 1 || true)"
              if [[ -z "$line" ]]; then
                printf 'env_file key=%s present=no nonempty=no\n' "$key"
                continue
              fi
              value="${line#*=}"
              value="${value%\"}"
              value="${value#\"}"
              if [[ -n "${value//[[:space:]]/}" ]]; then
                printf 'env_file key=%s present=yes nonempty=yes\n' "$key"
              else
                printf 'env_file key=%s present=yes nonempty=no\n' "$key"
              fi
            done
          else
            echo "[env-file] ${ENV_FILE} not readable by ${REMOTE_USER}; presence check skipped (reporting fact, not bypassing permissions)"
          fi

          echo "[section] systemd Environment= key presence (raw property never printed)"
          SYSTEMD_ENVIRONMENT="$(systemctl show "$SERVICE" -p Environment --value 2>/dev/null || true)"
          for key in "${KEYS[@]}"; do
            if printf '%s' "$SYSTEMD_ENVIRONMENT" | grep -qE "(^|[[:space:]])${key}="; then
              # Environment= values may be shell-quoted by systemd; splitting on
              # whitespace here is not a faithful parse, so emptiness is not
              # safely determinable without risking a wrong or partial read.
              printf 'systemd_environment key=%s present=yes nonempty=unknown\n' "$key"
            else
              printf 'systemd_environment key=%s present=no nonempty=no\n' "$key"
            fi
          done
          unset SYSTEMD_ENVIRONMENT

          echo "[section] PassEnvironment / UnsetEnvironment key presence (raw property never printed)"
          PASS_ENVIRONMENT="$(systemctl show "$SERVICE" -p PassEnvironment --value 2>/dev/null || true)"
          UNSET_ENVIRONMENT="$(systemctl show "$SERVICE" -p UnsetEnvironment --value 2>/dev/null || true)"
          for key in "${KEYS[@]}"; do
            if printf '%s\n' "$PASS_ENVIRONMENT" | tr ' ' '\n' | grep -qx "$key"; then
              printf 'pass_environment key=%s present=yes\n' "$key"
            else
              printf 'pass_environment key=%s present=no\n' "$key"
            fi
            if printf '%s\n' "$UNSET_ENVIRONMENT" | tr ' ' '\n' | grep -qx "$key"; then
              printf 'unset_environment key=%s present=yes\n' "$key"
            else
              printf 'unset_environment key=%s present=no\n' "$key"
            fi
          done
          unset PASS_ENVIRONMENT UNSET_ENVIRONMENT

          echo "[section] ${REMOTE_USER} group membership"
          USER_GROUPS="$(id -nG "$REMOTE_USER" 2>/dev/null || true)"
          for grp in systemd-journal adm; do
            if printf '%s\n' "$USER_GROUPS" | tr ' ' '\n' | grep -qx "$grp"; then
              printf 'group=%s member=yes\n' "$grp"
            else
              printf 'group=%s member=no\n' "$grp"
            fi
          done
          unset USER_GROUPS

          echo "[section] journal window ${WINDOW_SINCE} .. ${WINDOW_UNTIL}"
          JOURNAL_STATUS=0
          JOURNAL_OUTPUT="$(journalctl -u "$SERVICE" --since "$WINDOW_SINCE" --until "$WINDOW_UNTIL" -o cat 2>/dev/null)" || JOURNAL_STATUS=$?

          if [[ $JOURNAL_STATUS -eq 0 ]]; then
            if [[ -z "$JOURNAL_OUTPUT" ]]; then
              TOTAL_LINES=0
            else
              TOTAL_LINES="$(printf '%s\n' "$JOURNAL_OUTPUT" | wc -l)"
            fi
            FILTERED="$(printf '%s\n' "$JOURNAL_OUTPUT" | grep -E '\[Signup\]|SIGNUP_FAILED|Supabase|Supabase env vars not configured' || true)"
            if [[ -n "$FILTERED" ]]; then
              MATCHED_LINES="$(printf '%s\n' "$FILTERED" | wc -l)"
              printf '%s\n' "$FILTERED" \
                | sed -E \
                    -e 's/("?password_hash"?[[:space:]]*[:=][[:space:]]*)"[^"]*"/\1"[REDACTED]"/gI' \
                    -e 's/("?password"?[[:space:]]*[:=][[:space:]]*)"[^"]*"/\1"[REDACTED]"/gI' \
                    -e 's/("?cookie"?[[:space:]]*[:=][[:space:]]*)"[^"]*"/\1"[REDACTED]"/gI' \
                    -e 's/("?authorization"?[[:space:]]*[:=][[:space:]]*)"[^"]*"/\1"[REDACTED]"/gI' \
                    -e 's/(postgres(ql)?:\/\/)[^[:space:]"]+/\1[REDACTED]/gI' \
                    -e 's/("?[a-z_]*token[a-z_]*"?[[:space:]]*[:=][[:space:]]*)"[^"]*"/\1"[REDACTED]"/gI' \
                    -e 's/("?[a-z_]*secret[a-z_]*"?[[:space:]]*[:=][[:space:]]*)"[^"]*"/\1"[REDACTED]"/gI' \
                    -e 's/("?[a-z_]*key[a-z_]*"?[[:space:]]*[:=][[:space:]]*)"[^"]*"/\1"[REDACTED]"/gI' \
                | head -n 200
            else
              MATCHED_LINES=0
              echo "[journal] no matching [Signup]/SIGNUP_FAILED/Supabase lines in window"
            fi
            echo "[journal] total_lines=${TOTAL_LINES} matched_lines=${MATCHED_LINES}"
          else
            echo "[journal] journalctl read failed for ${SERVICE} (exit=${JOURNAL_STATUS}); access may be restricted for ${REMOTE_USER}"
          fi
          unset JOURNAL_OUTPUT FILTERED TOTAL_LINES MATCHED_LINES
          REMOTE
