name: Strigunov4 G1 independent protected physical acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/strigunov4-c4-unit-apply.yml'
      - 'scripts/strigunov4/protected_c4_unit_apply.py'
      - 'scripts/strigunov4/test_protected_c4_unit_apply.py'
  workflow_dispatch:
    inputs:
      target:
        description: Exact new physically reviewed target
        type: choice
        required: true
        options:
          - beget-g1-readonly

permissions:
  contents: read

concurrency:
  group: strigunov4-staging-nine-sql-apply
  cancel-in-progress: false

jobs:
  offline_negative_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exact-scoped independent proof checks
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/strigunov4 -p 'test_protected_c4_unit_apply.py' -v
          python3 -B -m py_compile scripts/strigunov4/protected_c4_unit_apply.py
          git diff --check

  protected_c4_unit_apply:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ASI-integration/asi-landing'
    needs: [offline_negative_tests]
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Protected and run-bound Beget read-only G1 acceptance witness
        env:
          G1_PHYSICAL_TARGET: ${{ inputs.target }}
          BEGET_SSH_HOST: '31.129.96.181'
          BEGET_SSH_PORT: '22'
          BEGET_SSH_USER: 'root'
          BEGET_SSH_PRIVATE_KEY: ${{ secrets.BEGET_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s scripts/strigunov4 -p 'test_protected_c4_unit_apply.py' -v
          python3 -B scripts/strigunov4/protected_c4_unit_apply.py
