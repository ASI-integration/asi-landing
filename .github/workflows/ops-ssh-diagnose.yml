name: Ops Diagnose SSH Capacity And Policy

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect SSH capacity and policy
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" "PORT='$PORT' bash -s" <<'REMOTE'
          set +e
          echo '=== SSH POLICY ==='
          grep -RniE '^[[:space:]]*(Port|ListenAddress|Match|AllowUsers|AllowGroups|DenyUsers|DenyGroups|MaxStartups|MaxAuthTries|LoginGraceTime|UseDNS|PerSource)[[:space:]]' /etc/ssh/sshd_config /etc/ssh/sshd_config.d 2>/dev/null || true

          echo '=== SYSTEMD SOCKET ==='
          systemctl show ssh.socket -p ActiveState -p SubState -p NConnections -p NAccepted -p TriggerLimitIntervalUSec -p TriggerLimitBurst --no-pager 2>&1 || true

          echo '=== SSHD PROCESSES ==='
          ps -eo user=,stat=,etimes=,cmd= | grep '[s]shd' | head -80 || true
          printf 'SSHD_PROCESS_COUNT='; ps -eo cmd= | grep -c '[s]shd' || true

          echo '=== ESTABLISHED SSH TCP COUNT ==='
          printf 'ESTABLISHED_COUNT='; ss -Htn state established sport = :"$PORT" 2>/dev/null | wc -l || true
          printf 'SYN_RECV_COUNT='; ss -Htn state syn-recv sport = :"$PORT" 2>/dev/null | wc -l || true

          echo '=== SECURITY SERVICES ==='
          printf 'FAIL2BAN='; systemctl is-active fail2ban 2>/dev/null || true
          printf 'UFW='; systemctl is-active ufw 2>/dev/null || true
          printf 'SSH_SERVICE='; systemctl is-active ssh.service 2>/dev/null || true
          printf 'SSH_SOCKET='; systemctl is-active ssh.socket 2>/dev/null || true

          echo 'SSH_CAPACITY_POLICY_DIAG_DONE'
          REMOTE
