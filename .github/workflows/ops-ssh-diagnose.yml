name: Ops Rescue Configure Staging Deploy

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Configure staging deploy permissions on mounted Ubuntu
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key

          ssh -i ~/.ssh/staging_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "root@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "RESCUE_SSH_OK hostname=$(hostname) user=$(id -un)"
          mkdir -p /mnt/server
          mountpoint -q /mnt/server || mount /dev/sda1 /mnt/server
          test -f /mnt/server/etc/os-release
          grep -q '^ID=ubuntu$' /mnt/server/etc/os-release

          chroot /mnt/server /usr/sbin/usermod -aG asi-runtime project_ayfaar

          for d in /var/www/asi-staging /var/www/asi-staging/releases /var/www/asi-staging/shared; do
            chroot /mnt/server /usr/bin/mkdir -p "$d"
            chroot /mnt/server /usr/bin/chgrp asi-runtime "$d"
            chroot /mnt/server /usr/bin/chmod 2770 "$d"
          done

          cat > /mnt/server/etc/sudoers.d/asi-staging-deploy <<'EOF'
          project_ayfaar ALL=(root) NOPASSWD: /usr/bin/systemctl restart asi-landing-staging.service
          EOF
          chmod 0440 /mnt/server/etc/sudoers.d/asi-staging-deploy
          chroot /mnt/server /usr/sbin/visudo -cf /etc/sudoers.d/asi-staging-deploy

          echo '=== VERIFY GROUP ==='
          chroot /mnt/server /usr/bin/id project_ayfaar
          echo '=== VERIFY DIRS ==='
          chroot /mnt/server /usr/bin/stat -c '%A %U %G %n' \
            /var/www/asi-staging \
            /var/www/asi-staging/releases \
            /var/www/asi-staging/shared
          echo '=== VERIFY SUDOERS ==='
          cat /mnt/server/etc/sudoers.d/asi-staging-deploy
          sync
          echo 'STAGING_DEPLOY_PERMISSIONS_CONFIGURED'
          REMOTE
