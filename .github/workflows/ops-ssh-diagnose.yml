name: Ops Identify Listener Service

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Identify listener service without failing workflow
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set +e
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== RUNNING SERVICES ==='
          systemctl --no-pager --plain --type=service --state=running 2>&1 | head -200 || true
          echo '=== PROCESS NAMES ==='
          ps -eo pid,user,comm --sort=comm | head -250 || true
          echo '=== FUSER 443 ==='
          fuser -n tcp 443 2>&1 || true
          echo '=== LSOF 443 ==='
          lsof -nP -iTCP:443 -sTCP:LISTEN 2>&1 || true
          echo 'INSPECT_COMPLETE'
          REMOTE
          exit 0
