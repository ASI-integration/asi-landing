name: Ops Identify Systemd Socket On 443

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Inspect socket activation on installed Ubuntu
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== LIST SOCKETS ==='
          systemctl list-sockets --all --no-pager 2>&1 || true
          echo '=== SSH SOCKET UNIT ==='
          systemctl cat ssh.socket 2>&1 || true
          echo '=== SSH SOCKET STATUS ==='
          systemctl status ssh.socket --no-pager -l 2>&1 || true
          echo '=== SSH SOCKET PROPERTIES ==='
          systemctl show ssh.socket -p Listen -p FragmentPath -p DropInPaths -p ActiveState -p SubState --no-pager 2>&1 || true
          echo '=== SUDO RIGHTS ==='
          sudo -n -l 2>&1 || true
          echo 'SOCKET_INSPECT_COMPLETE'
          REMOTE
