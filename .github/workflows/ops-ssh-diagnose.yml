name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect production environment wiring names only
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "HOST=$(hostname)"
          echo '[section] unit metadata'
          systemctl show asi-landing.service --no-pager \
            -p User -p Group -p WorkingDirectory -p FragmentPath -p DropInPaths -p EnvironmentFiles -p MainPID -p ActiveState -p SubState 2>/dev/null

          echo '[section] environment variable names only'
          systemctl show asi-landing.service -p Environment --value 2>/dev/null | python3 -c '
import shlex,sys
raw=sys.stdin.read().strip()
try: parts=shlex.split(raw)
except Exception: parts=[]
for item in parts:
    if "=" in item:
        print("[env-name] "+item.split("=",1)[0])
' | sort -u

          if systemctl show asi-landing.service -p Environment --value 2>/dev/null | grep -q 'BOOKING_OPS_AUTO_SEND_RUNNER_SECRET='; then
            echo '[unit-booking-secret] present=yes'
          else
            echo '[unit-booking-secret] present=no'
          fi

          echo '[section] sanitized unit directives'
          systemctl cat asi-landing.service 2>/dev/null | while IFS= read -r line; do
            case "$line" in
              User=*|Group=*|WorkingDirectory=*|EnvironmentFile=*|ExecStart=*|ExecStartPre=*) echo "$line" ;;
              Environment=*)
                printf '%s\n' "$line" | sed -E 's/(Environment=)?"?([^= ]+)=.*/EnvironmentName=\2/'
                ;;
            esac
          done
          exit 0
          REMOTE
