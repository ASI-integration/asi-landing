name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Locate live ASI process and config safely
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "HOST=$(hostname)"
          echo "WHO=$(whoami)"

          echo '[section] /srv/asi-landing metadata'
          ls -la /srv/asi-landing 2>/dev/null | sed -n '1,80p' || true
          git -C /srv/asi-landing rev-parse HEAD 2>/dev/null | sed 's/^/[git-sha] /' || true
          git -C /srv/asi-landing status --short 2>/dev/null | sed 's/^/[git-status] /' || true

          echo '[section] listeners'
          sudo ss -ltnp 2>/dev/null | grep -E ':(3000|3001|4173|8787|80|443)[[:space:]]' || true

          echo '[section] node-like processes'
          ps -eo user=,pid=,ppid=,args= | grep -E '(next-server|next start|node .*asi|pm2|npm .*start)' | grep -v grep | head -80 || true

          echo '[section] asi systemd units'
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -Ei 'asi|landing|next|node' | head -80 || true
          find /etc/systemd/system -maxdepth 1 -type f \( -iname '*asi*' -o -iname '*landing*' \) -printf '%f\n' 2>/dev/null | sed 's/^/[unit-file] /' || true

          echo '[section] nginx proxy targets'
          sudo grep -RHE 'server_name|proxy_pass|root ' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | grep -E 'asi-global|3000|3001|4173|8787|server_name' | head -120 || true

          echo '[section] process env booking-secret presence'
          PIDS="$(sudo ss -ltnp 2>/dev/null | sed -nE 's/.*:3000 .*pid=([0-9]+).*/\1/p' | sort -u)"
          if [[ -z "$PIDS" ]]; then
            echo '[port3000] pid=none'
          fi
          for pid in $PIDS; do
            cmd="$(sudo tr '\0' ' ' < /proc/$pid/cmdline 2>/dev/null || true)"
            user="$(ps -o user= -p "$pid" 2>/dev/null | xargs || true)"
            printf '[port3000] pid=%s user=%s cmd=%s\n' "$pid" "${user:-unknown}" "${cmd:-unknown}"
            if sudo tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -q '^BOOKING_OPS_AUTO_SEND_RUNNER_SECRET='; then
              echo '[process-booking-secret] present=yes'
            else
              echo '[process-booking-secret] present=no'
            fi
          done
          REMOTE
