name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Show staging deploy public key only
        shell: bash
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          echo 'STAGING_DEPLOY_PUBLIC_KEY_BEGIN'
          ssh-keygen -y -f ~/.ssh/staging_key
          echo 'STAGING_DEPLOY_PUBLIC_KEY_END'
          ssh-keygen -lf ~/.ssh/staging_key
