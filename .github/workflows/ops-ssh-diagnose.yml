name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      USER: ${{ secrets.STAGING_SSH_USER }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout production deploy fix
        uses: actions/checkout@v4
        with:
          ref: fix/prod-systemd-deploy-20260910
          fetch-depth: 1
      - name: Stage bootstrap script on Hetzner
        shell: bash
        run: |
          set -euo pipefail
          P="${PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
          SSH=( -i ~/.ssh/k -p "$P" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes )
          SCP=( -i ~/.ssh/k -P "$P" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes )
          ssh "${SSH[@]}" "$USER@$HOST" 'mkdir -p ~/asi-deploy-tmp && chmod 700 ~/asi-deploy-tmp'
          scp "${SCP[@]}" scripts/bootstrap-production-systemd.sh "$USER@$HOST:~/asi-deploy-tmp/bootstrap-production-systemd.sh"
          ssh "${SSH[@]}" "$USER@$HOST" 'chmod 700 ~/asi-deploy-tmp/bootstrap-production-systemd.sh; echo staged=$(realpath ~/asi-deploy-tmp/bootstrap-production-systemd.sh); sha256sum ~/asi-deploy-tmp/bootstrap-production-systemd.sh | cut -d" " -f1'
