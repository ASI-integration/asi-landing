name: Ops Locate SSH Port 443 Config

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - name: Locate SSH configuration that claims 443
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== SSHD PORT/LISTEN DIRECTIVES ==='
          grep -RniE '^[[:space:]]*(Port|ListenAddress)[[:space:]]+' /etc/ssh/sshd_config /etc/ssh/sshd_config.d 2>/dev/null || true
          echo '=== SSHD INCLUDE DIRECTIVES ==='
          grep -niE '^[[:space:]]*Include[[:space:]]+' /etc/ssh/sshd_config 2>/dev/null || true
          echo '=== GENERATOR OUTPUT ==='
          cat /run/systemd/generator/ssh.socket.d/addresses.conf 2>/dev/null || true
          echo 'SSH_CONFIG_LOCATE_COMPLETE'
          REMOTE
