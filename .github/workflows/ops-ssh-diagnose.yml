name: Ops Inspect Effective SSHD Config

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect effective sshd configuration
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== SSHD -T RELEVANT ==='
          /usr/sbin/sshd -T 2>&1 | grep -Ei '^(port|usedns|maxstartups|persource|maxauthtries|logingracetime|passwordauthentication|pubkeyauthentication|permitrootlogin|authenticationmethods|allowusers|denyusers)' || true
          echo "SSHD_T_RC=${PIPESTATUS[0]}"
          echo '=== OTHER SECURITY SERVICES ==='
          systemctl list-units --type=service --state=running --no-pager 2>/dev/null | grep -Ei '(sshguard|crowdsec|fail2ban|ufw|firewall)' || true
          echo 'SSHD_EFFECTIVE_DIAG_DONE'
          REMOTE
