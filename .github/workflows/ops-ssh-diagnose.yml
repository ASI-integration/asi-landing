name: Ops Rescue Readonly Path Inspect

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Enumerate Runtime paths on local disk
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "root@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "RESCUE_ROOT_SSH_OK hostname=$(hostname)"
          echo '--- /opt/asi-runtime ---'
          debugfs -R 'ls -l /opt/asi-runtime' /dev/sda1 2>&1 || true
          echo '--- /opt/asi-runtime/releases ---'
          debugfs -R 'ls -l /opt/asi-runtime/releases' /dev/sda1 2>&1 || true
          echo '--- /etc/asi-runtime ---'
          debugfs -R 'ls -l /etc/asi-runtime' /dev/sda1 2>&1 || true
          REMOTE
