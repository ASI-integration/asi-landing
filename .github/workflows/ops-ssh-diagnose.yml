name: Ops Inspect SSH Recovery Config

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect current SSH config and firewall metadata
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo '=== MAIN SSHD CONFIG RELEVANT ==='
          grep -nE '^[[:space:]]*(Include|Port|ListenAddress|PermitRootLogin|PasswordAuthentication|PubkeyAuthentication|AuthenticationMethods|AllowUsers|AllowGroups|DenyUsers|DenyGroups|MaxStartups|PerSource|LoginGraceTime|UseDNS|Match)[[:space:]]' /etc/ssh/sshd_config 2>/dev/null || true

          for f in /etc/ssh/sshd_config.d/00-rescue-recovery.conf /etc/ssh/sshd_config.d/01-alt-port.conf /etc/ssh/sshd_config.d/50-cloud-init.conf; do
            echo "=== FILE: $f ==="
            ls -l "$f" 2>&1 || true
            cat "$f" 2>&1 || true
          done

          echo '=== UFW FILE METADATA ==='
          ls -l /etc/ufw/user.rules /etc/ufw/user6.rules 2>&1 || true
          echo '=== UFW SSH RULE SNIPPETS IF READABLE ==='
          grep -nEi '(22|ssh|limit|deny|reject)' /etc/ufw/user.rules /etc/ufw/user6.rules 2>&1 | head -80 || true

          echo '=== SSH VERSION ==='
          ssh -V 2>&1 || true
          echo 'SSH_RECOVERY_CONFIG_DIAG_DONE'
          REMOTE
