name: Ops Compare Hetzner Connectivity

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe candidate Hetzner endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import socket, time
          hosts = ['2.29.31.29', '2.29.18.190']
          ports = [22, 443]
          for host in hosts:
              for port in ports:
                  t0=time.time()
                  try:
                      s=socket.create_connection((host,port),timeout=8)
                      s.settimeout(3)
                      data=b''
                      try:
                          data=s.recv(100)
                      except Exception:
                          pass
                      s.close()
                      text=data.decode('utf-8','replace').strip()
                      print(f'{host}:{port} TCP_OK {time.time()-t0:.2f}s banner={text[:80]!r}')
                  except Exception as e:
                      print(f'{host}:{port} FAIL {type(e).__name__}: {e}')
          PY
