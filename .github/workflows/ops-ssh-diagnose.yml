name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect deploy permissions and env names safely
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "HOST=$(hostname)"
          echo '[section] identity'
          id
          echo '[section] sudo-list'
          sudo -n -l 2>&1 | sed -E 's/(PASSWD|NOPASSWD):.*/\1: [commands listed by sudo policy]/' | head -80

          echo '[section] unit environment names only'
          python3 - <<'PY'
import shlex, subprocess
raw = subprocess.run(['systemctl','show','asi-landing.service','-p','Environment','--value'], capture_output=True, text=True).stdout.strip()
try:
    parts=shlex.split(raw)
except Exception:
    parts=[]
names=sorted({p.split('=',1)[0] for p in parts if '=' in p})
for n in names:
    print('[env-name]', n)
print('[booking-secret-in-unit]', 'yes' if 'BOOKING_OPS_AUTO_SEND_RUNNER_SECRET' in names else 'no')
PY

          echo '[section] writable checks'
          for p in /srv/asi-landing /etc/systemd/system /etc/systemd/system/asi-landing.service.d; do
            if [[ -e "$p" ]]; then
              [[ -w "$p" ]] && w=yes || w=no
              printf '[writable] path=%s direct=%s owner=%s mode=%s\n' "$p" "$w" "$(stat -c %U:%G "$p" 2>/dev/null)" "$(stat -c %a "$p" 2>/dev/null)"
            else
              printf '[writable] path=%s exists=no\n' "$p"
            fi
          done
          exit 0
          REMOTE
