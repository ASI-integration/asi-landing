name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.STAGING_SSH_HOST }}
      USER: ${{ secrets.STAGING_SSH_USER }}
      PORT: ${{ secrets.STAGING_SSH_PORT }}
      KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/k
          chmod 600 ~/.ssh/k
      - name: Inspect production service safely
        shell: bash
        run: |
          P="${PORT:-22}"
          ssh -i ~/.ssh/k -p "$P" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes "$USER@$HOST" \
            "echo HOST=\$(hostname); echo '[env names]'; systemctl show asi-landing.service -p Environment --value | tr ' ' '\n' | grep '=' | cut -d= -f1 | sort -u; echo '[restart]'; systemctl show asi-landing.service -p Restart -p RestartUSec -p MainPID --no-pager"
      - name: Test owner SSH identity
        continue-on-error: true
        shell: bash
        run: |
          P="${PORT:-22}"
          ssh -i ~/.ssh/k -p "$P" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=8 "asi-runtime@$HOST" 'whoami; hostname'
