name: Ops Runtime Readonly Inspect

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect staging PM2 path without sudo
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "SSH_OK hostname=$(hostname) user=$(id -un)"
          echo "PATH=$PATH"
          echo '=== COMMANDS ==='
          printf 'node='; command -v node || true
          printf 'npm='; command -v npm || true
          printf 'pm2='; command -v pm2 || true
          printf 'npx='; command -v npx || true
          echo '=== NPM GLOBAL ==='
          npm prefix -g 2>&1 || true
          npm root -g 2>&1 || true
          echo '=== COMMON PM2 LOCATIONS ==='
          for p in /usr/bin/pm2 /usr/local/bin/pm2 "$HOME/.local/bin/pm2" "$HOME/.npm-global/bin/pm2"; do
            if [ -e "$p" ]; then ls -l "$p"; fi
          done
          echo '=== PROCESS HINTS ==='
          ps -eo user,pid,args | grep -E '[p]m2|[n]ext' | head -30 || true
          echo '=== PM2 HOME ==='
          ls -ld "$HOME/.pm2" 2>&1 || true
          ls -l "$HOME/.pm2" 2>&1 | head -30 || true
          REMOTE
