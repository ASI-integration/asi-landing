name: Ops Rescue Identify Port 443 Owner

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Inspect installed Ubuntu boot and services
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set +e
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "root@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          mkdir -p /mnt/installed
          mountpoint -q /mnt/installed || mount /dev/sda1 /mnt/installed
          echo '=== FIRST FAILING BOOT WINDOW ==='
          journalctl --directory=/mnt/installed/var/log/journal --since '2026-09-09 18:13:00' --until '2026-09-09 18:13:20' --no-pager -o short-iso 2>&1 | head -500 || true
          echo '=== ENABLED UNIT SYMLINKS ==='
          find /mnt/installed/etc/systemd/system -type l -printf '%p -> %l\n' 2>/dev/null | sort | head -300 || true
          echo '=== PORT 443 REFERENCES IN SYSTEM CONFIG ==='
          grep -RniE '(^|[^0-9])443([^0-9]|$)|listen.*443|:443' /mnt/installed/etc/systemd /mnt/installed/etc/default /mnt/installed/etc/init.d /mnt/installed/etc/nginx /mnt/installed/etc/tailscale 2>/dev/null | head -300 || true
          echo '=== POSSIBLE PROXY BINARIES ==='
          for n in nginx caddy apache2 httpd haproxy traefik xray sing-box cloudflared frps frpc socat stunnel; do
            p=$(find /mnt/installed/usr /mnt/installed/opt /mnt/installed/usr/local -type f -name "$n" -perm -111 2>/dev/null | head -5)
            [ -n "$p" ] && printf '%s\n%s\n' "$n" "$p"
          done
          echo '=== PSIMON FILES ==='
          find /mnt/installed -xdev \( -name 'psimon' -o -name 'psimon*' \) 2>/dev/null | head -80 || true
          echo '=== CUSTOM SYSTEMD SERVICES ==='
          find /mnt/installed/etc/systemd/system -maxdepth 2 -type f -name '*.service' -print 2>/dev/null | sort | head -200 || true
          echo 'IDENTIFY_COMPLETE'
          REMOTE
          exit 0
