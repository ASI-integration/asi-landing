name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect actual Hetzner app layout safely
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "HOST=$(hostname)"
          echo "WHO=$(whoami)"
          echo '[section] candidate directories'
          for d in /srv/asi-landing /srv/asi-runtime /var/www/asi /home/project_ayfaar; do
            if [[ -e "$d" ]]; then
              printf '[dir] path=%s exists=yes kind=%s\n' "$d" "$(stat -c %F "$d" 2>/dev/null || echo unknown)"
            else
              printf '[dir] path=%s exists=no\n' "$d"
            fi
          done

          echo '[section] pm2'
          pm2 jlist 2>/dev/null | node - <<'NODE' || true
          let data='';
          process.stdin.on('data',c=>data+=c);
          process.stdin.on('end',()=>{
            try {
              for (const p of JSON.parse(data)) {
                const e=p.pm2_env||{};
                console.log(`[pm2] name=${p.name||''} status=${e.status||''} cwd=${e.pm_cwd||''} exec=${e.pm_exec_path||''}`);
              }
            } catch { console.log('[pm2] parse_failed'); }
          });
          NODE

          echo '[section] env file metadata + booking secret presence'
          for f in \
            /srv/asi-landing/.env \
            /srv/asi-landing/.env.production \
            /srv/asi-landing/.env.production.local \
            /srv/asi-landing/.env.production.live \
            /var/www/asi/shared/.env.production.live; do
            if [[ -e "$f" ]]; then
              printf '[env] path=%s exists=yes owner=%s mode=%s\n' "$f" "$(stat -c %U:%G "$f" 2>/dev/null || echo unknown)" "$(stat -c %a "$f" 2>/dev/null || echo unknown)"
              if grep -q '^BOOKING_OPS_AUTO_SEND_RUNNER_SECRET=' "$f" 2>/dev/null; then
                v="$(grep '^BOOKING_OPS_AUTO_SEND_RUNNER_SECRET=' "$f" | tail -n1 | cut -d= -f2-)"
                if [[ -n "$v" ]]; then echo '[booking-secret] present=yes nonempty=yes'; else echo '[booking-secret] present=yes nonempty=no'; fi
              else
                echo '[booking-secret] present=no nonempty=no'
              fi
            else
              printf '[env] path=%s exists=no\n' "$f"
            fi
          done
          REMOTE
