name: Ops Diagnose Local SSH Timeout

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Diagnose SSH from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          echo '=== NORMAL USER ==='
          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo USER_SSH_OK
          id
          echo '--- ssh units ---'
          systemctl is-active ssh.service ssh.socket 2>&1 || true
          systemctl show ssh.service -p ActiveState -p SubState -p NRestarts --no-pager 2>&1 || true
          echo '--- listeners ---'
          ss -lnt | grep -E ':(22|443)\b' || true
          echo '--- fail2ban ---'
          systemctl is-active fail2ban 2>&1 || true
          echo '--- sudo ---'
          sudo -n -l 2>&1 || true
          REMOTE

          echo '=== ROOT KEY TEST ==='
          set +e
          "${SSH[@]}" "root@$STAGING_SSH_HOST" 'echo ROOT_SSH_OK; id -u; systemctl is-active ssh.service ssh.socket 2>&1 || true'
          ROOT_RC=$?
          set -e
          echo "ROOT_SSH_RC=$ROOT_RC"
