name: Ops Rescue Inspect Custom Services

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Inspect custom systemd services and port settings
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set +e
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "root@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          mkdir -p /mnt/installed
          mountpoint -q /mnt/installed || mount /dev/sda1 /mnt/installed
          echo '=== CUSTOM UNIT FILES ==='
          for f in /mnt/installed/etc/systemd/system/asi-*.service; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            sed -n '1,220p' "$f"
          done
          echo '=== PORT/HOST SETTINGS FROM REFERENCED ENV FILES ==='
          for f in $(grep -h '^EnvironmentFile=' /mnt/installed/etc/systemd/system/asi-*.service 2>/dev/null | sed 's/^EnvironmentFile=-\?//' | sort -u); do
            rf="/mnt/installed$f"
            echo "--- $f ---"
            if [ -f "$rf" ]; then
              grep -E '^[A-Z0-9_]*(PORT|HOST|BIND|LISTEN)[A-Z0-9_]*=' "$rf" 2>/dev/null || true
            else
              echo 'MISSING'
            fi
          done
          echo '=== EXECUTABLES REFERENCED BY CUSTOM SERVICES ==='
          grep -h '^ExecStart=' /mnt/installed/etc/systemd/system/asi-*.service 2>/dev/null | sort -u
          echo 'CUSTOM_INSPECT_COMPLETE'
          REMOTE
          exit 0
