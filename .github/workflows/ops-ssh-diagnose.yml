name: Ops Rescue Readonly Disk Inspect

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Read Runtime identity and safe config from local disk
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "root@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "RESCUE_ROOT_SSH_OK hostname=$(hostname)"
          command -v debugfs >/dev/null
          test -b /dev/sda1
          echo '--- runtime current ---'
          debugfs -R 'stat /opt/asi-runtime/current' /dev/sda1 2>/dev/null || true
          echo '--- source commit ---'
          debugfs -R 'cat /opt/asi-runtime/current/SOURCE_COMMIT' /dev/sda1 2>/dev/null || true
          echo '--- SP01 ---'
          if debugfs -R 'cat /opt/asi-runtime/current/lib/agent-ops/events.mjs' /dev/sda1 2>/dev/null | grep -q 'strigunov_pilot_v1'; then
            echo 'SP01_CODE_PRESENT=YES'
          else
            echo 'SP01_CODE_PRESENT=NO'
          fi
          echo '--- safe env ---'
          debugfs -R 'cat /etc/asi-runtime/runtime.env' /dev/sda1 2>/dev/null | grep -E '^(ASI_OWNER_TELEGRAM_PROFILE|ASI_RUNTIME_BRIDGE_URL)=' || true
          if debugfs -R 'cat /etc/asi-runtime/runtime.env' /dev/sda1 2>/dev/null | grep -Eq '^ASI_RUNTIME_BRIDGE_RUNNER_TOKEN=.+$'; then
            echo 'RUNNER_TOKEN=PRESENT'
          else
            echo 'RUNNER_TOKEN=MISSING'
          fi
          REMOTE
