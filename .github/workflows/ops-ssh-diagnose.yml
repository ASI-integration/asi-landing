name: Ops SSH Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect live systemd wiring safely
        shell: bash
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          SSH=(ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes)

          "${SSH[@]}" "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "HOST=$(hostname)"
          for unit in asi-landing.service asi-landing-staging.service; do
            echo "[unit] $unit"
            systemctl show "$unit" --no-pager \
              -p User -p Group -p WorkingDirectory -p FragmentPath -p EnvironmentFiles -p ExecStart -p MainPID -p ActiveState -p SubState 2>/dev/null
            echo '[unit-directives]'
            systemctl cat "$unit" 2>/dev/null | grep -E '^(User|Group|WorkingDirectory|EnvironmentFile|ExecStart|ExecStartPre)=' || true
          done

          echo '[section] candidate env paths from units'
          systemctl cat asi-landing.service asi-landing-staging.service 2>/dev/null \
            | sed -nE 's/^EnvironmentFile=-?//p' \
            | sed 's/^/[env-path] /' || true

          echo '[section] sudo noninteractive capability'
          if sudo -n true 2>/dev/null; then echo '[sudo] noninteractive=yes'; else echo '[sudo] noninteractive=no'; fi

          echo '[section] prod process env booking secret presence'
          pid="$(systemctl show asi-landing.service -p MainPID --value 2>/dev/null)"
          if [[ -n "$pid" && "$pid" != "0" ]]; then
            echo "[prod-pid] $pid"
            if sudo -n tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null | grep -q '^BOOKING_OPS_AUTO_SEND_RUNNER_SECRET='; then
              echo '[process-booking-secret] present=yes'
            else
              echo '[process-booking-secret] present=no'
            fi
          fi
          exit 0
          REMOTE
