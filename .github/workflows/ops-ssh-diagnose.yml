name: Ops Rescue Inspect Failing Boot Sequence

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 4
    steps:
      - name: Inspect exact boot window around nginx bind failure
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set +e
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "root@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          mkdir -p /mnt/installed
          mountpoint -q /mnt/installed || mount /dev/sda1 /mnt/installed
          echo '=== FAILING BOOT WINDOW LOCAL TIME ==='
          journalctl --directory=/mnt/installed/var/log/journal --since '2026-09-09 20:12:50' --until '2026-09-09 20:13:25' --no-pager -o short-iso-precise 2>&1 | head -900 || true
          echo '=== FAILING BOOT WINDOW UTC ==='
          TZ=UTC journalctl --directory=/mnt/installed/var/log/journal --since '2026-09-09 18:12:50 UTC' --until '2026-09-09 18:13:25 UTC' --no-pager -o short-iso-precise 2>&1 | head -900 || true
          echo 'BOOT_SEQUENCE_INSPECT_COMPLETE'
          REMOTE
          exit 0
