name: Ops Runtime Readonly Inspect

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect live Runtime health without sudo
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "SSH_OK hostname=$(hostname) user=$(id -un)"
          echo '=== RUNTIME HEALTH ==='
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4173/api/health
          echo
          echo '=== SERVICES ==='
          printf 'worker='; systemctl is-active asi-runtime-worker
          printf 'dashboard='; systemctl is-active asi-runtime-dashboard
          printf 'bridge_runner='; systemctl is-active asi-runtime-bridge-runner
          REMOTE
