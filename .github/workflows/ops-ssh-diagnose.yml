name: Ops Runtime Readonly Inspect

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Inspect staging supervisor without sudo
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "SSH_OK hostname=$(hostname) user=$(id -un)"
          echo '=== PORTS ==='
          ss -ltnp 2>&1 | grep -E ':3000|:3001' || true
          echo '=== CANDIDATE SERVICES ==='
          for unit in asi-landing-staging asi-landing; do
            echo "--- $unit ---"
            systemctl show "$unit" -p LoadState -p ActiveState -p SubState -p MainPID -p ExecStart -p WorkingDirectory --no-pager 2>&1 || true
          done
          echo '=== STAGING PATH ==='
          ls -ld /var/www/asi-staging /var/www/asi-staging/current /var/www/asi-staging/shared 2>&1 || true
          readlink -f /var/www/asi-staging/current 2>&1 || true
          REMOTE
