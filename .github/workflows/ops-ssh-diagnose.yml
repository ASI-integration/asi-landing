name: Ops Public Staging Probe

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe staging public endpoints without failing workflow
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          getent ahosts staging.asi-global.ru | head -20 || true
          echo '=== HEALTH ==='
          curl -sSvk --connect-timeout 10 --max-time 20 https://staging.asi-global.ru/api/health -o /tmp/health 2>/tmp/health.err
          HEALTH_RC=$?
          echo "health_rc=$HEALTH_RC"
          tail -80 /tmp/health.err || true
          echo 'health_body:'
          cat /tmp/health 2>/dev/null || true
          echo
          echo '=== VERSION ==='
          curl -sSvk --connect-timeout 10 --max-time 20 https://staging.asi-global.ru/api/version -o /tmp/version 2>/tmp/version.err
          VERSION_RC=$?
          echo "version_rc=$VERSION_RC"
          tail -80 /tmp/version.err || true
          echo 'version_body:'
          cat /tmp/version 2>/dev/null || true
          echo
          echo 'PROBE_COMPLETE'
          exit 0
