name: Ops Runtime Readonly Diagnose

on:
  push:
    branches:
      - ops/ssh-diagnose-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Diagnose staging Runtime without sudo
        shell: bash
        env:
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_SSH_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PORT="${STAGING_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh -i ~/.ssh/staging_key \
            -p "$PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            "$STAGING_SSH_USER@$STAGING_SSH_HOST" 'bash -s' <<'REMOTE'
          set +e
          echo "SSH_OK hostname=$(hostname) user=$(id -un)"
          echo "CURRENT_LINK=$(readlink /opt/asi-runtime/current 2>/dev/null || echo UNREADABLE)"
          echo '--- permissions ---'
          ls -ld /opt/asi-runtime /opt/asi-runtime/current 2>/dev/null || true
          namei -l /opt/asi-runtime/current/lib/agent-ops/events.mjs 2>/dev/null || true
          echo '--- unit metadata ---'
          systemctl show asi-runtime-worker -p ActiveState -p SubState -p User -p EnvironmentFiles -p ExecStart --no-pager || true
          systemctl show asi-runtime-bridge-runner -p ActiveState -p SubState -p User -p EnvironmentFiles -p ExecStart --no-pager || true
          echo '--- safe selected environment ---'
          for unit in asi-runtime-worker asi-runtime-bridge-runner; do
            ENVLINE="$(systemctl show "$unit" -p Environment --value 2>/dev/null || true)"
            printf '%s\n' "$ENVLINE" | tr ' ' '\n' | grep -E '^(ASI_OWNER_TELEGRAM_PROFILE|ASI_RUNTIME_BRIDGE_URL)=' || true
            if printf '%s\n' "$ENVLINE" | tr ' ' '\n' | grep -Eq '^ASI_RUNTIME_BRIDGE_RUNNER_TOKEN=.+$'; then
              echo "$unit RUNNER_TOKEN=PRESENT"
            else
              echo "$unit RUNNER_TOKEN=NOT_EXPOSED"
            fi
          done
          echo '--- sudo capabilities ---'
          sudo -n -l 2>&1 || true
          REMOTE
