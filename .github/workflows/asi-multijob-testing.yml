name: Strigunov 4 multi-job source-only tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/strigunov4/ASI-STRIGUNOV4-MULTIJOB-20261020.mjs'
      - 'scripts/strigunov4/ASI-STRIGUNOV4-MULTIJOB-20261020.test.mjs'
      - 'scripts/strigunov4/ASI-STRIGUNOV4-ORCHESTRATOR-CANDIDATE-20261020.mjs'
      - 'scripts/strigunov4/ASI-STRIGUNOV4-ORCHESTRATOR-CANDIDATE-20261020.test.mjs'
      - 'scripts/strigunov4/ASI-STRIGUNOV4-RUNNER-BRIDGE-20261020.mjs'
      - 'scripts/strigunov4/ASI-STRIGUNOV4-RUNNER-BRIDGE-20261020.test.mjs'
      - 'scripts/strigunov4/ASI-STRIGUNOV4-GITHUB-SNAPSHOT-20261020.mjs'
      - 'scripts/strigunov4/ASI-STRIGUNOV4-GITHUB-SNAPSHOT-20261020.test.mjs'
      - 'scripts/strigunov4/execution-adapters/**'
      - '.github/workflows/asi-multijob-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi_job_unit:
    if: github.repository == 'ASI-integration/asi-landing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout unprivileged PR test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0 # The full-checkout host test uses the immutable b27b07b base.
      - name: Use Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Verify dispatcher and bridge source syntax
        run: |
          node --check scripts/strigunov4/ASI-STRIGUNOV4-MULTIJOB-20261020.mjs
          node --check scripts/strigunov4/ASI-STRIGUNOV4-MULTIJOB-20261020.test.mjs
          node --check scripts/strigunov4/ASI-STRIGUNOV4-ORCHESTRATOR-CANDIDATE-20261020.mjs
          node --check scripts/strigunov4/ASI-STRIGUNOV4-ORCHESTRATOR-CANDIDATE-20261020.test.mjs
          node --check scripts/strigunov4/ASI-STRIGUNOV4-RUNNER-BRIDGE-20261020.mjs
          node --check scripts/strigunov4/ASI-STRIGUNOV4-RUNNER-BRIDGE-20261020.test.mjs
          node --check scripts/strigunov4/ASI-STRIGUNOV4-GITHUB-SNAPSHOT-20261020.mjs
          node --check scripts/strigunov4/ASI-STRIGUNOV4-GITHUB-SNAPSHOT-20261020.test.mjs
      - name: Run focused dispatcher and bridge regression tests
        run: |
          node --test \
            scripts/strigunov4/ASI-STRIGUNOV4-MULTIJOB-20261020.test.mjs \
            scripts/strigunov4/ASI-STRIGUNOV4-ORCHESTRATOR-CANDIDATE-20261020.test.mjs \
            scripts/strigunov4/ASI-STRIGUNOV4-RUNNER-BRIDGE-20261020.test.mjs \
            scripts/strigunov4/ASI-STRIGUNOV4-GITHUB-SNAPSHOT-20261020.test.mjs
      - name: Verify isolated adapter syntax, acceptance and security regressions
        run: |
          for source in scripts/strigunov4/execution-adapters/*.mjs; do node --check "$source"; done
          node --test scripts/strigunov4/execution-adapters/isolated-loop.test.mjs \
            scripts/strigunov4/execution-adapters/security-review.test.mjs \
            scripts/strigunov4/execution-adapters/github-publisher.test.mjs \
            scripts/strigunov4/execution-adapters/host-integration.test.mjs
      - name: Verify two-order closed loop without live credentials or paid review
        run: node --test scripts/strigunov4/execution-adapters/closed-loop.test.mjs scripts/strigunov4/execution-adapters/host-loop.test.mjs scripts/strigunov4/execution-adapters/beget-host.test.mjs
      - name: Bounded goal integration and preclaim regressions
        run: node --test scripts/global-dispatcher/goal-decomposition.test.mjs scripts/global-dispatcher/goal-routing.test.mjs scripts/strigunov4/execution-adapters/goal-publication.test.mjs scripts/strigunov4/execution-adapters/beget-preclaim.test.mjs scripts/strigunov4/execution-adapters/beget-owner-review.test.mjs scripts/strigunov4/execution-adapters/beget-owner-policy.test.mjs
