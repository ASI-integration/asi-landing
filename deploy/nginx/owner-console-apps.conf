# One frontend on this VPS. app.guestautopilot.com and app.asi-global.ru
# both proxy here. Next.js reads Host / X-Forwarded-Host and selects
# English hospitality vs Russian platform. Do not rewrite Host.

upstream owner_console_next {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.guestautopilot.com app.asi-global.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.guestautopilot.com;

    ssl_certificate /etc/letsencrypt/live/app.guestautopilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.guestautopilot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://owner_console_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.asi-global.ru;

    ssl_certificate /etc/letsencrypt/live/app.asi-global.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.asi-global.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://owner_console_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
