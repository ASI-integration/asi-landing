# Example nginx for asi-global.ru — proxy everything to asi-landing (Next.js on PM2).
# Install: copy into sites-available, symlink to sites-enabled, certbot --nginx, nginx -t && systemctl reload nginx
#
# Cutover from automation-core apps/web or a static "pilot" root:
# - Remove any `root` / `alias` that served a pilot landing at /
# - Remove upstream blocks pointing at the old Node port
# - Ensure only this server (or merged equivalent) proxies to 127.0.0.1:3000

upstream asi_landing_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name asi-global.ru www.asi-global.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://asi-global.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.asi-global.ru;

    # Certificate must include both names:
    #   certbot --nginx -d asi-global.ru -d www.asi-global.ru
    ssl_certificate /etc/letsencrypt/live/asi-global.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asi-global.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://asi-global.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asi-global.ru;

    # Certificate must include both names:
    #   certbot --nginx -d asi-global.ru -d www.asi-global.ru
    ssl_certificate /etc/letsencrypt/live/asi-global.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asi-global.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://asi_landing_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
