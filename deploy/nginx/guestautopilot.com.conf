# nginx for www.guestautopilot.com (Guest Autopilot / international production) —
# dedicated Hetzner VPS, entirely separate from asi-global.ru's Timeweb VPS.
# Install: copy into sites-available, symlink to sites-enabled, certbot --nginx, nginx -t && systemctl reload nginx
#
# Canonical host is `www`, not the apex — the apex is redirect-only. Do not
# reverse this: src/config/publicOrigins.ts's GUEST_AUTOPILOT_ORIGIN is
# https://www.guestautopilot.com and every canonical/OG tag in the app
# assumes `www` is where the site actually lives.
#
# No asi-global.ru references anywhere in this file — this proxies to a
# dedicated guestautopilot Node service on a dedicated port, on a dedicated
# server. It shares nothing with the RU nginx config.

upstream guestautopilot_next {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ---- HTTP: apex + www, both plain :80 for ACME + redirect to canonical https ----
server {
    listen 80;
    listen [::]:80;
    server_name guestautopilot.com www.guestautopilot.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Apex on :80 -> canonical https://www
    location / {
        return 301 https://www.guestautopilot.com$request_uri;
    }
}

# ---- HTTPS: apex redirects to https://www (301, permanent) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name guestautopilot.com;

    # Certificate must include both names:
    #   certbot --nginx -d guestautopilot.com -d www.guestautopilot.com
    ssl_certificate /etc/letsencrypt/live/guestautopilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guestautopilot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://www.guestautopilot.com$request_uri;
}

# ---- HTTPS: www is the real, canonical, proxied site ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.guestautopilot.com;

    # Certificate must include both names:
    #   certbot --nginx -d guestautopilot.com -d www.guestautopilot.com
    ssl_certificate /etc/letsencrypt/live/guestautopilot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guestautopilot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://guestautopilot_next;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR upgrade support (harmless in production, required if
        # any future feature needs a persistent connection).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400;
        proxy_connect_timeout 10;
        proxy_send_timeout 60;
    }
}
